out('decision',['Overview','Scorecards','Evidence','Decision','Settings'],'CRO Selection','RFP decision and evidence review',c)}\nfunction settings(title,description,fields){return heading(title,description)+`\u003cdiv class=\"settings-grid\"\u003e\u003cnav class=\"settings-nav\" aria-label=\"Settings categories\"\u003e${['General','Display','About'].map(s=\u003e`\u003cbutton class=\"${S.settingsSection===s?'active':''}\" data-action=\"settings-section:${s}\"\u003e${s}\u003c/button\u003e`).join('')}\u003c/nav\u003e\u003cdiv class=\"card settings-panel\"\u003e${S.settingsSection==='About'?`\u003ch2\u003eAbout this app\u003c/h2\u003e\u003cp\u003eApp template, source coverage and operational boundaries.\u003c/p\u003e\u003cdiv class=\"row-item\"\u003e\u003cstrong\u003eEnvironment\u003c/strong\u003e\u003cspan class=\"badge blue\"\u003eStatic design review\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"row-item\"\u003e\u003cstrong\u003eData\u003c/strong\u003e\u003cspan\u003eFictional examples, local only\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"row-item\"\u003e\u003cstrong\u003eProduction handling\u003c/strong\u003e\u003cspan\u003eTrialAgents native access, configuration and audit\u003c/span\u003e\u003c/div\u003e`:S.settingsSection==='Display'?`\u003ch2\u003eDisplay preferences\u003c/h2\u003e\u003cp\u003eChoose a comfortable working density and how summary cards behave.\u003c/p\u003e${fields.filter(f=\u003ef.key==='density'||f.key==='compactRows'||f.key==='showDelta').map(fieldHTML).join('')}\u003cdiv class=\"settings-actions\"\u003e${btn('Save preview','save-settings','btn primary')}${btn('Ignore','ignore-settings','btn')}\u003c/div\u003e`:`\u003ch2\u003eGeneral preferences\u003c/h2\u003e\u003cp\u003eThese controls are an interactive local preview of the structured settings page.\u003c/p\u003e${fields.map(fieldHTML).join('')}\u003cdiv class=\"settings-actions\"\u003e${btn('Save preview','save-settings','btn primary')}${btn('Ignore','ignore-settings','btn')}\u 03e\u003cdiv class=\"shell-nav\"\u003e${['Overview','Analysis','Data','\u2699 Settings'].map((x,i)=\u003e`\u003cbutton data-action=\"component-demo\" class=\"${i===1?'active':''}\"\u003e${x}\u003c/button\u003e`).join('')}\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"card component-demo\"\u003e\u003cdiv class=\"caps\"\u003e02 / State\u003c/div\u003e\u003ch3\u003eSemantic badges and feedback\u003c/h3\u003e\u003cp\u003eUse the same statuses across views; color supplements the label.\u003c/p\u003e\u003cdiv style=\"display:flex;gap:8px;flex-wrap:wrap\"\u003e${['On track','Review','Blocked','Qualified','Researching'].map(status).join('')}\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"card component-demo\"\u003e\u003cdiv class=\"caps\"\u003e03 / Controls\u003c/div\u003e\u003ch3\u003eFilter toolbar\u003c/h3\u003e\u003cp\u003eSearch, date/scope filters and primary action remain on one row until narrow layouts need Filters.\u003c/p\u003e${recordsToolbar().replace('record-search','component-search')}\u003c/div\u003e\u003cdiv class=\"card component-demo\"\u003e\u003cdiv class=\"caps\"\u003e04 / Settings\u003c/div\u003e\u003ch3\u003eVersioned settings destination\u003c/h3\u003e\u003cp\u003eFull structured page with General, Display and About. Live host owns persistence.\u003c/p\u003e\u003cdiv class=\"row-item\"\u003e\u003cspan\u003eDefault view\u003c/span\u003e\u003cspan class=\"badge blue\"\u003eOverview\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"row-item\"\u003e\u003cspan\u003eChart density\u003c/span\u003e\u003cspan\u003eComfortable\u003c/span\u003e\u003c/div\u003e${btn('See analytics settings \u2197','open-analytics-settings','btn primary')}\u003c/div\u003e\u003cdiv class=\"card component-demo\" style=\"grid-column:1/-1\"\u003e\u003cdiv class=\"caps\"\u003e05 / Analytical charts\u003c/div\u003e\u003ch3\u003eModern interactive chart contract\u003c/h3\u003e\u003cp\u003eClick legends to toggle series. Hover or focus the SVG and use arrow keys for precise point values, crosshair, and an aligned tooltip.\u003c/p\u003e\u003cdiv class=\"mini-legend\"\u003e${series.map(s=\u003e`\u003cbutton data-action=\"series:${s.key}\" class=\"${S.seriesHidden[s.key]?'off':''}\"\u003e\u003ci class=\"swatch\" style=\"--c:${s.color}\"\u003e\u003c/i\u003e${s.key}\u003c/button\u003e`).join('')}\u003c/div\u003e\u003cdiv class=\"chart-wrap\" style=\"max-width:860px\"\u003e${chartSVG(metrics.id,window.innerWidth\u003c620?355:window.innerWidth\u003c850?600:860)}\u003cdiv class=\"chart-tooltip\" hidden\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"card component-demo\"\u003e\u003cdiv class=\"caps\"\u003e06 / Record operations\u003c/div\u003e\u003ch3\u003eSearchable tables with safe actions\u003c/h3\u003e\u003cp\u003eFull dataset query \u2192 sort and filter \u2192 pagination; explicit View, Duplicate and Delete affordances.\u003c/p\u003e\u003cdiv class=\"row-item\"\u003e\u003cstrong\u003eCascadia Bio\u003c/strong\u003e${status('Qualified')}\u003c/div\u003e\u003cdiv class=\"row-item\"\u003e\u003cstrong\u003eOriole Therapeutics\u003c/strong\u003e${status('Researching')}\u003c/div\u003e${btn('Explore record shell \u2197','open-records','btn primary')}\u003c/div\u003e\u003cdiv class=\"card component-demo\"\u003e\u003cdiv class=\"caps\"\u003e07 / Decision integrity\u003c/div\u003e\u003ch3\u003eEvidence and human approvals\u003c/h3\u003e\u003cp\u003eCompare candidate scores while keeping coverage, review state and decision authority explicit.\u003c/p\u003e\u003cdiv class=\"ranking-row\" style=\"grid-template-columns:25px 115px minmax(0,1fr) 35px\"\u003e\u003cspan\u003e01\u003c/span\u003e\u003cstrong\u003eNorthbridge\u003c/strong\u003e\u003cdiv class=\"progress\"\u003e\u003cspan style=\"width:89%\"\u003e\u003c/span\u003e\u003c/div\u003e\u003cb\u003e89\u003c/b\u003e\u003c/div\u003e\u003cdiv class=\"row-item\"\u003e\u003cspan\u003eDecision sign-off\u003c/span\u003e${status('Review')}\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e`}\nfunction render(){let variant=document.body.dataset.variant;let h=variant==='analytics'?analytics():variant==='portfolio'?portfolioRender():variant==='records'?records():variant==='decision'?decision():componentPage();const root=$('#app');if(root)root.innerHTML=h+(variant==='records'\u0026\u0026S.drawer?recordsDrawer():'');attachCharts();}\nfunction updateTooltip(svg,index){const wrap=svg.closest('.chart-wrap'),tip=wrap.querySelector('.chart-tooltip');if(!tip)return;let m=svg.dataset.chart,len=Number(S.analyticsRange),start=weeks.length-len;index=Math.max(0,Math.min(len-1,index));S.chartIndex[m]=index;const W=Number(svg.viewBox.baseVal.width),x=44+index*((W-56)/(len-1));const cross=svg.querySelector('.crosshair');if(cross){cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.style.display='block'};tip.hidden=false;tip.innerHTML=`\u003cb\u003e${weeks[start+index]}, 2026\u003c/b\u003e\u003cdiv\u003e${series.filter(s=\u003e!S.seriesHidden[s.key]).map(s=\u003e`\u003cdiv\u003e\u003cspan class=\"key\" style=\"--c:${s.color}\"\u003e\u003c/span\u003e${s.key}: \u003cstrong\u003e${fmt(valuesFor(s.key,m).slice(start)[index])}\u003c/strong\u003e\u003c/div\u003e`).join('')||'No series selected'}\u003c/div\u003e`;const rect=wrap.getBoundingClientRect(),fraction=x/W;tip.style.left=Math.max(8,Math.min(rect.width-160,rect.width*fraction-70))+'px';tip.style.top='17px'}\nfunction attachCharts(){document.querySelectorAll('svg.chart').forEach(svg=\u003e{svg.addEventListener('mousemove',e=\u003e{const r=svg.getBoundingClientRect();const W=Number(svg.viewBox.baseVal.width),p=(e.clientX-r.left)/r.width*W;const len=Number(S.analyticsRange),i=Math.round((p-44)/(W-56)*(len-1));updateTooltip(svg,i)});svg.addEventListener('mouseleave',()=\u003e{svg.querySelector('.crosshair')?.setAttribute('style','display:none');const tip=svg.closest('.chart-wrap').querySelector('.chart-tooltip');if(tip)tip.hidden=true});svg.addEventListener('keydown',e=\u003e{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();updateTooltip(svg,(S.chartIndex[svg.dataset.chart]??0)+(e.key==='ArrowRight'?1:-1))}});svg.addEventListener('focus',()=\u003eupdateTooltip(svg,S.chartIndex[svg.dataset.chart]??Number(S.analyticsRange)-1))})}\nfunction handleAction(action){if(action==='prev'){S.rowPage=Math.max(0,S.rowPage-1);render();return}if(action==='next'){S.rowPage++;render();return}if(action==='toggle-filters'){S.filtersOpen=!S.filtersOpen;render();return}if(action==='add-row'){S.drawer='new';render();return}if(action==='close-drawer'){S.drawer=null;render();return}if(action==='save-settings'){toast('Preview settings updated in local state only. No TrialAgents save was made.');return}if(action==='ignore-settings'){S.settingsSection='General';toast('Preview changes ignored.');render();return}if(action==='preview-decision'){toast(`Local preview choice: ${S.preferred}. No approval or database write.`);return}if(action==='back-gallery'){window.location.href='index.html';return}if(action==='component-demo'){toast('Navigation component: use a shell preview for a working page.');return}if(action==='open-records'){window.location.href='records.html';return}if(action==='open-analytics-settings'){window.location.href='analytics.html#settings';return}if(action.startsWith('goto:')){S.page=action.split(':')[1];S.rowPage=0;render();window.scrollTo({top:0,behavior:'instant'});return}if(action.startsWith('settings-section:')){S.settingsSection=action.split(':')[1];render();return}if(action.startsWith('series:')){let key=action.slice(7);S.seriesHidden[key]=!S.seriesHidden[key];render();return}if(action.startsWith('inspect-metric:')){const m=metricDefs.find(x=\u003ex.id===action.split(':')[1]);toast(m.title+': hover the chart, use the keyboard, or open Data to inspect source records.');return}if(action.startsWith('open-row:')){S.drawer=Number(action.split(':')[1]);render();return}if(action.startsWith('record-menu:')){S.drawer=Number(action.split(':')[1]);render();return}if(action.startsWith('duplicate:')){let r=S.records.find(x=\u003ex.id===Number(action.split(':')[1]));if(r){S.records.push({...r,id:Math.max(...S.records.map(x=\u003ex.id))+1,name:r.name+' (copy)',status:'Researching'});S.drawer=null;toast('Record duplicated locally (preview only).');render()}return}if(action.startsWith('delete:')){S.records=S.records.filter(x=\u003ex.id!==Number(action.split(':')[1]));S.drawer=null;toast('Record deleted locally (preview only).');render();return}}\ndocument.addEventListener('click',e=\u003e{const nav=e.target.closest('[data-nav]');if(nav){S.page=nav.dataset.nav;S.settingsSection='General';S.rowPage=0;S.drawer=null;render();window.scrollTo({top:0,behavior:'instant'});return}const sort=e.target.closest('[data-sort]');if(sort){let key=sort.dataset.sort;S.sort={key,dir:S.sort.key===key?-S.sort.dir:1};S.rowPage=0;render();return}const button=e.target.closest('[data-action]');if(button){if(button.classList.contains('drawer-shade')\u0026\u0026e.target!==button)return;handleAction(button.dataset.action)}});\ndocument.addEventListener('change',e=\u003e{const x=e.target;if(x.id==='range-select'){S.analyticsRange=x.value;render()}else if(x.id==='source-select'){S.analyticsSource=x.value;render()}else if(x.id==='portfolio-scope'){S.portfolioScope=x.value;render()}else if(x.id==='record-region'||x.id==='record-region-mobile'){S.region=x.value;S.rowPage=0;render()}else if(x.id==='record-status'||x.id==='record-status-mobile'){S.status=x.value;S.rowPage=0;render()}else if(x.id==='vendor-focus'){S.vendorFocus=Number(x.value);render()}else if(x.id==='preferred-vendor'){S.preferred=x.value}else if(x.dataset.setting){S.settings[x.dataset.setting]=x.type==='checkbox'?x.checked:x.value}});\ndocument.addEventListener('input',e=\u003e{const x=e.target;if(x.id==='record-search'){const pos=x.selectionStart;S.recordQuery=x.value;S.rowPage=0;render();const n=$('#record-search');if(n){n.focus();n.setSelectionRange(pos,pos)}}});\ndocument.addEventListener('submit',e=\u003e{if(e.target.id!=='record-form')return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());if(!d.name.trim()){toast('Name is required');return};const rec={...d,employees:Number(d.employees),date:'Nov 07'};if(d.recordId==='new'){rec.id=Math.max(...S.records.map(x=\u003ex.id),0)+1;S.records.push(rec)}else{rec.id=Number(d.recordId);let i=S.records.findIndex(x=\u003ex.id===rec.id);if(i\u003e=0)S.records[i]={...S.records[i],...rec}}S.drawer=null;toast('Preview record updated locally. No production data changed.');render()});\nif(location.hash.toLowerCase()==='#settings')S.page='Settings';render();\n})();\n\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e", "portfolio": "\u003c!doctype html\u003e\u003chtml lang=\"en\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\u003cmeta name=\"color-scheme\" content=\"light\"\u003e\u003ctitle\u003eProject Oversight \u2014 Review prototype\u003c/title\u003e\u003cstyle\u003e:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Arial,sans-serif;color:#223044;background:#f4f6fa;font-size:14px;line-height:1.5;--page:#f6f7fa;--paper:#fff;--text:#1f2d41;--muted:#68778a;--line:#e3e9f0;--accent:#5767b7;--soft:#eff1fb;--rail:#202c40;--success:#17785b;--danger:#b04d59;--warning:#a3762c;--shadow:0 4px 25px rgba(32,45,68,.035)}\n*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px}button,select,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:inherit;text-decoration:none}input,select,textarea{border:1px solid #dbe2eb;border-radius:9px;padding:10px 12px;color:var(--text);background:white;min-height:40px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid #9aa9ef;outline-offset:3px}button{border:none}p,h1,h2,h3,h4{marg iv\u003e\u003ch3\u003eEvidence and human approvals\u003c/h3\u003e\u003cp\u003eCompare candidate scores while keeping coverage, review state and decision authority explicit.\u003c/p\u003e\u003cdiv class=\"ranking-row\" style=\"grid-template-columns:25px 115px minmax(0,1fr) 35px\"\u003e\u003cspan\u003e01\u003c/span\u003e\u003cstrong\u003eNorthbridge\u003c/strong\u003e\u003cdiv class=\"progress\"\u003e\u003cspan style=\"width:89%\"\u003e\u003c/span\u003e\u003c/div\u003e\u003cb\u003e89\u003c/b\u003e\u003c/div\u003e\u003cdiv class=\"row-item\"\u003e\u003cspan\u003eDecision sign-off\u003c/span\u003e${status('Review')}\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e`}\nfunction render(){let variant=document.body.dataset.variant;let h=variant==='analytics'?analytics():variant==='portfolio'?portfolioRender():variant==='records'?records():variant==='decision'?decision():componentPage();const root=$('#app');if(root)root.innerHTML=h+(variant==='records'\u0026\u0026S.drawer?recordsDrawer():'');attachCharts();}\nfunction updateTooltip(svg,index){const wrap=svg.closest('.chart-wrap'),tip=wrap.querySelector('.chart-tooltip');if(!tip)return;let m=svg.dataset.chart,len=Number(S.analyticsRange),start=weeks.length-len;index=Math.max(0,Math.min(len-1,index));S.chartIndex[m]=index;const W=Number(svg.viewBox.baseVal.width),x=44+index*((W-56)/(len-1));const cross=svg.querySelector('.crosshair');if(cross){cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.style.display='block'};tip.hidden=false;tip.innerHTML=`\u003cb\u003e${weeks[start+index]}, 2026\u003c/b\u003e\u003cdiv\u003e${series.filter(s=\u003e!S.seriesHidden[s.key]).map(s=\u003e`\u003cdiv\u003e\u003cspan class=\"key\" style=\"--c:${s.color}\"\u003e\u003c/span\u003e${s.key}: \u003cstrong\u003e${fmt(valuesFor(s.key,m).slice(start)[index])}\u003c/strong\u003e\u003c/div\u003e`).join('')||'No series selected'}\u003c/div\u003e`;const rect=wrap.getBoundingClientRect(),fraction=x/W;tip.style.left=Math.max(8,Math.min stage:'Preclinical',signal:'Hiring',owner:'M. Patel',status:'Qualified',date:'Oct 24',employees:17}\n];\nconst portfolio=[\n {project:'Oncology Phase II',workstream:'Study activation',owner:'Sarah Lin',progress:72,health:'On track',due:'Dec 12',start:8,width:59},\n {project:'Rare disease program',workstream:'CMC readiness',owner:'Marco Silva',progress:41,health:'At risk',due:'Jan 21',start:26,width:48},\n {project:'Neurology Phase I',workstream:'Regulatory filing',owner:'Anna Weber',progress:87,health:'On track',due:'Nov 28',start:4,width:37},\n {project:'Portfolio operations',workstream:'Vendor onboarding',owner:'James Park',progress:55,health:'Attention',due:'Dec 19',start:22,width:43}\n];\nconst vendors=[{name:'Northbridge CRO',score:89,price:'\u20ac2.4m',delivery:'14 mo',risk:'Low',status:'Preferred',strength:'Strong EU oncology-site network',evidence:5},{name:'Meridian Clinical',score:82,price:'\u20ac2.2m',delivery:'15 mo',risk:'Medium',status:'Review',strength:'Competitive timeline',evidence:4},{name:'Caldera Research',score:77,price:'\u20ac2.6m',delivery:'13 mo',risk:'Medium',status:'Review',strength:'Global operational footprint',evidence:3},{name:'Pinewater Trials',score:69,price:'\u20ac2.1m',delivery:'18 mo',risk:'High',status:'Review',strength:'Low fixed cost',evidence:2}];\nconst S={page:'Overview',settingsSection:'General',records:baseRecords.map(r=\u003e({...r})),recordQuery:'',region:'All regions',status:'All statuses',filtersOpen:false,sort:{key:'name',dir:1},rowPage:0,analyticsRange:'8',analyticsSource:'All traffic',seriesHidden:{},chartIndex:{},settings:{density:'Comfortable',defaultPeriod:'8',showDelta:true,compactRows:false,homePage:'Overview'},draft:{},drawer:null,preferred:'Northbridge CRO',vendorFocus:0,portfolioScope:'All projects'};\nconst $=sel=\u003edocument.querySelector(sel); const esc=v=\u003eString(v??'').replace(/[\u0026\u003c\u003e\"']/g,c=\u003e({'\u0026':'\u0026amp;','\u003c':'\u0026lt;','\u003e':'\u0026gt;','\"':'\u0026quot;',\"'\":'\u0026#39;'}[c]));\nconst fmt=n=\u003eMath.round(n).toLocaleString('en-US');\nconst option=(arr,value)=\u003earr.map(x=\u003e`\u003coption value=\"${esc(x)}\" ${x===value?'selected':''}\u003e${esc(x)}\u003c/option\u003e`).join('');\nconst status=(v)=\u003e`\u003cspan class=\"badge ${['On track','Qualified','Approved','Preferred','Complete'].includes(v)?'good':['At risk','Attention','Researching','Review'].includes(v)?'warn':['Blocked','High'].includes(v)?'bad':'blue'}\"\u003e${esc(v)}\u003c/span\u003e`;\nconst btn=(text,action,cls='btn')=\u003e`\u003cbutton class=\"${cls}\" data-action=\"${action}\"\u003e${text}\u003c/button\u003e`;\nfunction toast(message){document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=message;document.body.appendChild(n);setTimeout(()=\u003en.remove(),2800)}\nfunction layout(variant,nav,title,subtitle,content){const side=['portfolio','decision'].includes(variant);const navHTML=nav.map(n=\u003e`\u003cbutton class=\"${S.page===n?'active':''}\" data-nav=\"${esc(n)}\" ${S.page===n?'aria-current=\"page\"':''}\u003e${n==='Settings'?'\u2699 \u0026nbsp;':''}${esc(n)}\u003c/button\u003e`).join('');return `\u003cdiv class=\"shell variant-${variant} ${side?'split-shell':''}\"\u003e${side?`\u003caside class=\"sidebar\"\u003e\u003cdiv class=\"sb-title\"\u003e\u003cstrong\u003e${esc(title)}\u003c/strong\u003e\u003csmall\u003e${esc(subtitle)}\u003c/small\u003e\u003c/div\u003e\u003cnav class=\"shell-nav\" aria-label=\"App navigation\"\u003e${navHTML}\u003c/nav\u003e\u003cdiv class=\"sb-footer\"\u003eLocal design preview \u00b7 example data\u003cbr\u003eNo external updates or saved records\u003c/div\u003e\u003c/aside\u003e`:''}\u003cmain class=\"shell-work\"\u003e\u003cheader class=\"shell-top\"\u003e${side?`\u003cdiv class=\"app-identity\"\u003e\u003cstrong\u003e${esc(title)}\u003c/strong\u003e\u003csmall\u003e${esc(subtitle)}\u003c/small\u003e\u003c/div\u003e`:`\u003cdiv class=\"app-identity\"\u003e\u003cstrong\u003e${esc(title)}\u003c/strong\u003e\u003csmall\u003e${esc(subtitle)}\u003c/small\u003e\u003c/div\u003e\u003cnav class=\"shell-nav\" aria-label=\"App navigation\"\u003e${navHTML}\u003c/nav\u003e`}\u003cdiv class=\"top-end\"\u003e\u003cspan class=\"badge blue\"\u003e\u25cf Preview\u003c/span\u003e\u003cspan class=\"micro\"\u003eUpdated Nov 6, 2026\u003c/span\u003e\u003c/div\u003e\u003c/header\u003e\u003cdiv class=\"app-content\"\u003e${content}\u003c/div\u003e\u003c/main\u003e\u003c/div\u003e`}\nfunction heading(title,subtitle,actions=''){return `\u003cdiv class=\"page-head\"\u003e\u003cdiv\u003e\u003ch1\u003e${title}\u003c/h1\u003e\u003cp\u003e${subtitle}\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"page-actions\"\u003e${actions}\u003c/div\u003e\u003c/div\u003e`}\nfunction kpi(name,value,change,foot){return `\u003cdiv class=\"card kpi\"\u003e\u003cdiv class=\"k-label\"\u003e${name}\u003c/div\u003e\u003cdiv class=\"k-value tabular\"\u003e${value}\u003c/div\u003e\u003cdiv\u003e\u003cspan class=\"delta\"\u003e${change}\u003c/span\u003e\u003cspan class=\"sub\"\u003e \u00b7 ${foot}\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e`}\nfunction valuesFor(key,metric){const s=series.find(x=\u003ex.key===key);return weeks.map((_,i)=\u003e{let v=s.base+s.trend*i+[3,-21,14,4,23,-15,8,4,-9,15,6,-5][i]*(key==='CTIS'?1.3:0.7);const factor={visits:1,google:.57,nongoogle:.43,unique:.66,repeat:.19,usage:2.6}[metric]||1; if(S.analyticsSource==='Google only')v*=.57; if(S.analyticsSource==='Non-Google only')v*=.43;return Math.round(Math.max(12,v*factor))})}\nfunction chartSVG(metric,width=550){let len=Number(S.analyticsRange),start=weeks.length-len;let vals=series.map(s=\u003evaluesFor(s.key,metric).slice(start));let visible=series.filter(s=\u003e!S.seriesHidden[s.key]);let all=series.flatMap((s,i)=\u003eS.seriesHidden[s.key]?[]:vals[i]);let max=Math.ceil((Math.max(50,...all)*1.12)/50)*50;const W=width,H=189,ml=44,mr=12,mt=12,mb=27,cw=W-ml-mr,ch=H-mt-mb, x=i=\u003eml+i*(cw/(len-1)),y=v=\u003emt+ch*(1-v/max);let svg=`\u003csvg class=\"chart\" data-chart=\"${metric}\" tabindex=\"0\" role=\"img\" aria-label=\"Interactive ${metric} line chart; use left and right arrow keys to inspect points\" viewBox=\"0 0 ${W} ${H}\" preserveAspectRatio=\"none\"\u003e`;for(let tick=0;tick\u003c=4;tick++){let v=Math.round(max*tick/4),yy=y(v);svg+=`\u003cline x1=\"${ml}\" x2=\"${W-mr}\" y1=\"${yy}\" y2=\"${yy}\" stroke=\"#e8edf3\" stroke-width=\"1\"/\u003e\u003ctext x=\"${ml-9}\" y=\"${yy+4}\" font-size=\"10\" text-anchor=\"end\" fill=\"#8492a4\"\u003e${fmt(v)}\u003c/text\u003e`}const tickIds=[0,Math.round((len-1)/2),len-1];tickIds.forEach(i=\u003e{svg+=`\u003ctext x=\"${x(i)}\" y=\"${H-7}\" font-size=\"10\" text-anchor=\"middle\" fill=\"#8a97a7\"\u003e${weeks[start+i]}\u003c/text\u003e`});series.forEach((s,index)=\u003e{if(S.seriesHidden[s.key])return;const pts=vals[index].map((v,i)=\u003e`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');svg+=`\u003cpolyline points=\"${pts}\" fill=\"none\" stroke=\"${s.color}\" stroke-width=\"2.6\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/\u003e`});svg+=`\u003cline class=\"crosshair\" x1=\"${x(0)}\" x2=\"${x(0)}\" y1=\"${mt}\" y2=\"${H-mb}\" stroke=\"#8492a4\" stroke-width=\"1\" stroke-dasharray=\"3 3\" style=\"display:none\"/\u003e\u003crect class=\"chart-hit\" x=\"${ml}\" y=\"${mt}\" width=\"${cw}\" height=\"${ch}\" fill=\"transparent\"/\u003e`+`\u003c/svg\u003e`;return svg}\nfunction chartCard(m){return `\u003cdiv class=\"card chart-card\" data-metric=\"${m.id}\"\u003e\u003cdiv class=\"card-head\"\u003e\u003cdiv\u003e\u003ch2\u003e${m.title}\u003c/h2\u003e\u003cp\u003e${m.unit} \u00b7 weekly \u00b7 sample data\u003c/p\u003e\u003c/div\u003e${btn('Inspect \u2197',`inspect-metric:${m.id}`,'btn sm ghost')}\u003c/div\u003e\u003cdiv class=\"mini-legend\"\u003e${series.map(s=\u003e`\u003cbutton data-action=\"series:${s.key}\" class=\"${S.seriesHidden[s.key]?'off':''}\" aria-pressed=\"${!S.seriesHidden[s.key]}\"\u003e\u003ci class=\"swatch\" style=\"--c:${s.color}\"\u003e\u003c/i\u003e${s.key}\u003c/button\u003e`).join('')}\u003c/div\u003e\u003cdiv class=\"chart-wrap\"\u003e${chartSVG(m.id,window.innerWidth\u003c620?355:550)}\u003cdiv class=\"chart-tooltip\" hidden\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"chart-foot\"\u003e\u003cspan\u003eHover or use \u2190 \u2192 to inspect values\u003c/span\u003e\u003cspan\u003eLast ${S.analyticsRange} weeks\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e`}\nfunction analyticFilters(){return `\u003cdiv class=\"insight-bar\"\u003e\u003cdiv class=\"metric-select\"\u003e\u003cspan class=\"label\"\u003ePeriod\u003c/span\u003e\u003cselect id=\"range-select\" aria-label=\"Time range\"\u003e${option(['4','8','12'],S.analyticsRange)}\u003c/select\u003e\u003c/div\u003e\u003cdiv class=\"metric-select\"\u003e\u003cspan class=\"label\"\u003eTraffic\u003c/span\u003e\u003cselect id=\"source-select\" aria-label=\"Traffic source\"\u003e${option(['All traffic','Google only','Non-Google only'],S.analyticsSource)}\u003c/select\u003e\u003c/div\u003e\u003cspan class=\"badge good\"\u003e\u2713 Exclude visitors with 10+ pages\u003c/span\u003e\u003cspan class=\"small-spacer\"\u003e\u003c/span\u003e\u003cspan class=\"micro\"\u003eFictional weekly figures \u00b7 Aug\u2013Nov 2026\u003c/span\u003e\u003c/div\u003e`}\nfunction analyticsTable(){const rows=[];series.forEach(s=\u003eweeks.forEach((w,i)=\u003erows.push({source:s.key,week:w,visits:valuesFor(s.key,'visits')[i],google:valuesFor(s.key,'google')[i],unique:valuesFor(s.key,'unique')[i],repeat:valuesFor(s.key,'repeat')[i]})));return `\u003cdiv class=\"card\"\u003e\u003cdiv class=\"card-head pad\" style=\"margin-bottom:0\"\u003e\u003cdiv\u003e\u003ch2\u003eUnderlying weekly series\u003c/h2\u003e\u003cp\u003eExample analytical records \u00b7 all four site sections\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"table-scroll\"\u003e\u003ctable class=\"table\"\u003e\u003cthead\u0 )}\u003c/div\u003e\u003cp class=\"hint\" style=\"margin-top:13px\"\u003eIn production, Save / Ignore must use the native versioned TrialAgents review and configuration path. This file does not persist preferences.\u003c/p\u003e`}\u003c/div\u003e\u003c/div\u003e`}\nfunction fieldHTML(f){if(f.type==='check')return `\u003cdiv class=\"toggle-row\"\u003e\u003cdiv\u003e\u003cstrong\u003e${f.label}\u003c/strong\u003e\u003csmall\u003e${f.hint||''}\u003c/small\u003e\u003c/div\u003e\u003cinput type=\"checkbox\" class=\"setting-check\" data-setting=\"${f.key}\" ${S.settings[f.key]?'checked':''}\u003e\u003c/div\u003e`;return `\u003cdiv class=\"field\" style=\"margin-bottom:17px\"\u003e\u003clabel for=\"setting-${f.key}\"\u003e${f.label}\u003c/label\u003e\u003cselect data-setting=\"${f.key}\" id=\"setting-${f.key}\" class=\"setting-select\"\u003e${option(f.options,S.settings[f.key])}\u003c/select\u003e${f.hint?`\u003cspan class=\"help\"\u003e${f.hint}\u003c/span\u003e`:''}\u003c/div\u003e`}\nfunction componentPage(){const metrics=metricDefs[0];return `\u003cdiv class=\"component-gallery\"\u003e\u003cdiv class=\"page-head\"\u003e\u003cdiv\u003e\u003cdiv class=\"caps\"\u003eShared patterns\u003c/div\u003e\u003ch1\u003eReusable component library\u003c/h1\u003e\u003cp\u003eCommon behaviors and interaction contracts; shells choose arrangement, density and visual voice.\u003c/p\u003e\u003c/div\u003e${btn('\u2190 Back to gallery','back-gallery','btn')}\u003c/div\u003e\u003cdiv class=\"notice\"\u003eThis is a local UI demonstration. Production components must respect TrialAgents' data bindings, reviewed saves, access policies, and trusted chart host.\u003c/div\u003e\u003cdiv class=\"components-grid\"\u003e\u003cdiv class=\"card component-demo\"\u003e\u003cdiv class=\"caps\"\u003e01 / Navigation\u003c/div\u003e\u003ch3\u003eCoherent main tabs with Settings\u003c/h3\u003e\u003cp\u003eSettings opens a full page on the same navigation level\u2014not a dropdown in an unrelated corner.\u003c/p\u003e\u003cdiv class=\"shell-nav\"\u003e${['Overview','Analysis','Data','\u2699 Settings'].map((x,i)=\u003e`\u003cbutton data-action=\"component-demo\" class=\"${i===1?'active':''}\"\u003e${x}\u003c/button\u003e`).join('')}\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"card component-demo\"\u003e\u003cdiv class=\"caps\"\u003e02 / State\u003c/div\u003e\u003ch3\u003eSemantic badges and feedback\u003c/h3\u003e\u003cp\u003eUse the same statuses across views; color supplements the label.\u003c/p\u003e\u003cdiv style=\"display:flex;gap:8px;flex-wrap:wrap\"\u003e${['On track','Review','Blocked','Qualified','Researching'].map(status).join('')}\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"card component-demo\"\u003e\u003cdiv class=\"caps\"\u003e03 / Controls\u003c/div\u003e\u003ch3\u003eFilter toolbar\u003c/h3\u003e\u003cp\u003eSearch, date/scope filters and primary action remain on one row until narrow layouts need Filters.\u003c/p\u003e${recordsToolbar().replace('record-search','component-search')}\u003c/div\u003e\u003cdiv class=\"card component-demo\"\u003e\u003cdiv class=\"caps\"\u003e04 / Settings\u003c/div\u003e\u003ch3\u003eVersioned settings destination\u003c/h3\u003e\u003cp\u003eFull structured page with General, Display and About. Live host owns persistence.\u003c/p\u003e\u003cdiv class=\"row-item\"\u003e\u003cspan\u003eDefault view\u003c/span\u003e\u003cspan class=\"badge blue\"\u003eOverview\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"row-item\"\u003e\u003cspan\u003eChart density\u003c/span\u003e\u003cspan\u003eComfortable\u003c/span\u003e\u003c/div\u003e${btn('See analytics settings \u2197','open-analytics-settings','btn primary')}\u003c/div\u003e\u003cdiv class=\"card component-demo\" style=\"grid-column:1/-1\"\u003e\u003cdiv class=\"caps\"\u003e05 / Analytical charts\u003c/div\u003e\u003ch3\u003eModern interactive chart contract\u003c/h3\u003e\u003cp\u003eClick legends to toggle series. Hover or focus the SVG and use arrow keys for precise point values, crosshair, and an aligned tooltip.\u003c/p\u003e\u003cdiv class=\"mini-legend\"\u003e${series.map(s=\u003e`\u003cbutton data-action=\"series:${s.key}\" class=\"${S.seriesHidden[s.key]?'off':''}\"\u003e\u003ci class=\"swatch\" style=\"--c:${s.color}\"\u003e\u003c/i\u003e${s.key}\u003c/button\u003e`).join('')}\u003c/div\u003e\u003cdiv class=\"chart-wrap\" style=\"max-width:860px\"\u003e${chartSVG(metrics.id,window.innerWidth\u003c620?355:window.innerWidth\u003c850?600:860)}\u003cdiv class=\"chart-tooltip\" hidden\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"card component-demo\"\u003e\u003cdiv class=\"caps\"\u003e06 / Record operations\u003c/div\u003e\u003ch3\u003eSearchable tables with safe actions\u003c/h3\u003e\u003cp\u003eFull dataset query \u2192 sort and filter \u2192 pagination; explicit View, Duplicate and Delete affordances.\u003c/p\u003e\u003cdiv class=\"row-item\"\u003e\u003cstrong\u003eCascadia Bio\u003c/strong\u003e${status('Qualified')}\u003c/div\u003e\u003cdiv class=\"row-item\"\u003e\u003cstrong\u003eOriole Therapeutics\u003c/strong\u003e${status('Researching')}\u003c/div\u003e${btn('Explore record shell \u2197','open-records','btn primary')}\u003c/div\u003e\u003cdiv class=\"card component-demo\"\u003e\u003cdiv class=\"caps\"\u003e07 / Decision integrity\u003c/div\u003e\u003ch3\u003eEvidence and human approvals\u003c/h3\u003e\u003cp\u003eCompare candidate scores while keeping coverage, review state and decision authority explicit.\u003c/p\u003e\u003cdiv class=\"ranking-row\" style=\"grid-template-columns:25px 115px minmax(0,1fr) 35px\"\u003e\u003cspan\u003e01\u003c/span\u003e\u003cstrong\u003eNorthbridge\u003c/strong\u003e\u003cdiv class=\"progress\"\u003e\u003cspan style=\"width:89%\"\u003e\u003c/span\u003e\u003c/div\u003e\u003cb\u003e89\u003c/b\u003e\u003c/div\u003e\u003cdiv class=\"row-item\"\u003e\u003cspan\u003eDecision sign-off\u003c/span\u003e${status('Review')}\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e`}\nfunction render(){let variant=document.body.dataset.variant;let h=variant==='analytics'?analytics():variant==='portfolio'?portfolioRender():variant==='records'?records():variant==='decision'?decision():componentPage();const root=$('#app');if(root)root.innerHTML=h+(variant==='records'\u0026\u0026S.drawer?recordsDrawer():'');attachCharts();}\nfunction updateTooltip(svg,index){const wrap=svg.closest('.chart-wrap'),tip=wrap.querySelector('.chart-tooltip');if(!tip)return;let m=svg.dataset.chart,len=Number(S.analyticsRange),start=weeks.length-len;index=Math.max(0,Math.min(len-1,index));S.chartIndex[m]=index;const W=Number(svg.viewBox.baseVal.width),x=44+index*((W-56)/(len-1));const cross=svg.querySelector('.crosshair');if(cross){cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.style.display='block'};tip.hidden=false;tip.innerHTML=`\u003cb\u003e${weeks[start+index]}, 2026\u003c/b\u003e\u003cdiv\u003e${series.filter(s=\u003e!S.seriesHidden[s.key]).map(s=\u003e`\u003cdiv\u003e\u003cspan class=\"key\" style=\"--c:${s.color}\"\u003e\u003c/span\u003e${s.key}: \u003cstrong\u003e${fmt(valuesFor(s.key,m).slice(start)[index])}\u003c/strong\u003e\u003c/div\u003e`).join('')||'No series selected'}\u003c/div\u003e`;const rect=wrap.getBoundingClientRect(),fraction=x/W;tip.style.left=Math.max(8,Math.min(rect.width-160,rect.width*fraction-70))+'px';tip.style.top='17px'}\nfunction attachCharts(){document.querySelectorAll('svg.chart').forEach(svg=\u003e{svg.addEventListener('mousemove',e=\u003e{const r=svg.getBoundingClientRect();const W=Number(svg.viewBox.baseVal.width),p=(e.clientX-r.left)/r.width*W;const len=Number(S.analyticsRange),i=Math.round((p-44)/(W-56)*(len-1));updateTooltip(svg,i)});svg.addEventListener('mouseleave',()=\u003e{svg.querySelector('.crosshair')?.setAttribute('style','display:none');const tip=svg.closest('.chart-wrap').querySelector('.chart-tooltip');if(tip)tip.hidden=true});svg.addEventListener('keydown',e=\u003e{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();updateTooltip(svg,(S.chartIndex[svg.dataset.chart]??0)+(e.key==='ArrowRight'?1:-1))}});svg.addEventListener('focus',()=\u003eupdateTooltip(svg,S.chartIndex[svg.dataset.chart]??Number(S.analyticsRange)-1))})}\nfunction handleAction(action){if(action==='prev'){S.rowPage=Math.max(0,S.rowPage-1);render();return}if(action==='next'){S.rowPage++;render();return}if(action==='toggle-filters'){S.filtersOpen=!S.filtersOpen;render();return}if(action==='add-row'){S.drawer='new';render();return}if(action==='close-drawer'){S.drawer=null;render();return}if(action==='save-settings'){toast('Preview settings updated in local state only. No TrialAgents save was made.');return}if(action==='ignore-settings'){S.settingsSection='General';toast('Preview changes ignored.');render();return}if(action==='preview-decision'){toast(`Local preview choice: ${S.preferred}. No approval or database write.`);return}if(action==='back-gallery'){window.location.href='index.html';return}if(action==='component-demo'){toast('Navigation component: use a shell preview for a working page.');return}if(action==='open-records'){window.location.href='records.html';return}if(action==='open-analytics-settings'){window.location.href='analytics.html#settings';return}if(action.startsWith('goto:')){S.page=action.split(':')[1];S.rowPage=0;render();window.scrollTo({top:0,behavior:'instant'});return}if(action.startsWith('settings-section:')){S.settingsSection=action.split(':')[1];render();return}if(action.startsWith('series:')){let key=action.slice(7);S.seriesHidden[key]=!S.seriesHidden[key];render();return}if(action.startsWith('inspect-metric:')){const m=metricDefs.find(x=\u003ex.id===action.split(':')[1]);toast(m.title+': hover the chart, use the keyboard, or open Data to inspect source records.');return}if(action.startsWith('open-row:')){S.drawer=Number(action.split(':')[1]);render();return}if(action.startsWith('record-menu:')){S.drawer=Number(action.split(':')[1]);render();return}if(action.startsWith('duplicate:')){let r=S.records.find(x=\u003ex.id===Number(action.split(':')[1]));if(r){S.records.push({...r,id:Math.max(...S.records.map(x=\u003ex.id))+1,name:r.name+' (copy)',status:'Researching'});S.drawer=null;toast('Record duplicated locally (preview only).');render()}return}if(action.startsWith('delete:')){S.records=S.records.filter(x=\u003ex.id!==Number(action.split(':')[1]));S.drawer=null;toast('Record deleted locally (preview only).');render();return}}\ndocument.addEventListener('click',e=\u003e{const nav=e.target.closest('[data-nav]');if(nav){S.page=nav.dataset.nav;S.settingsSection='General';S.rowPage=0;S.drawer=null;render();window.scrollTo({top:0,behavior:'instant'});return}const sort=e.target.closest('[data-sort]');if(sort){let key=sort.dataset.sort;S.sort={key,dir:S.sort.key===key?-S.sort.dir:1};S.rowPage=0;render();return}const button=e.target.closest('[data-action]');if(button){if(button.classList.contains('drawer-shade')\u0026\u0026e.target!==button)return;handleAction(button.dataset.action)}});\ndocument.addEventListener('change',e=\u003e{const x=e.target;if(x.id==='range-select'){S.analyticsRange=x.value;render()}else if(x.id==='source-select'){S.analyticsSource=x.value;render()}else if(x.id==='portfolio-scope'){S.portfolioScope=x.value;render()}else if(x.id==='record-region'||x.id==='record-region-mobile'){S.region=x.value;S.rowPage=0;render()}else if(x.id==='record-status'||x.id==='record-status-mobile'){S.status=x.value;S.rowPage=0;render()}else if(x.id==='vendor-focus'){S.vendorFocus=Number(x.value);render()}else if(x.id==='preferred-vendor'){S.preferred=x.value}else if(x.dataset.setting){S.settings[x.dataset.setting]=x.type==='checkbox'?x.checked:x.value}});\ndocument.addEventListener('input',e=\u003e{const x=e.target;if(x.id==='record-search'){const pos=x.selectionStart;S.recordQuery=x.value;S.rowPage=0;render();const n=$('#record-search');if(n){n.focus();n.setSelectionRange(pos,pos)}}});\ndocument.addEventListener('submi u003e\u003cp\u003eChoose a comfortable working density and how summary cards behave.\u003c/p\u003e${fields.filter(f=\u003ef.key==='density'||f.key==='compactRows'||f.key==='showDelta').map(fieldHTML).join('')}\u003cdiv class=\"settings-actions\"\u003e${btn('Save preview','save-settings','btn primary')}${btn('Ignore','ignore-settings','btn')}\u003c/div\u003e`:`\u003ch2\u003eGeneral preferences\u003c/h2\u003e\u003cp\u003eThese controls are an interactive local preview of the structured settings page.\u003c/p\u003e${fields.map(fieldHTML).join('')}\u003cdiv class=\"settings-actions\"\u003e${btn('Save preview','save-settings','btn primary')}${btn('Ignore','ignore-settings','btn')}\u003c/div\u003e\u003cp class=\"hint\" style=\"margin-top:13px\"\u003eIn production, Save / Ignore must use the native versioned TrialAgents review and configuration path. This file does not persist preferences.\u003c/p\u003e`}\u003c/div\u003e\u003c/div\u003e`}\nfunction fieldHTML(f){if(f.type==='check')return `\u003cdiv class=\"toggle-row\"\u003e\u003cdiv\u003e\u003cstrong\u003e${f.label}\u003c/strong\u003e\u003csmall\u003e${f.hint||''}\u003c/small\u003e\u003c/div\u003e\u003cinput type=\"checkbox\" class=\"setting-check\" data-setting=\"${f.key}\" ${S.settings[f.key]?'checked':''}\u003e\u003c/div\u003e`;return `\u003cdiv class=\"field\" style=\"margin-bottom:17px\"\u003e\u003clabel for=\"setting-${f.key}\"\u003e${f.label}\u003c/label\u003e\u003cselect data-setting=\"${f.key}\" id=\"setting-${f.key}\" class=\"setting-select\"\u003e${option(f.options,S.settings[f.key])}\u003c/select\u003e${f.hint?`\u003cspan class=\"help\"\u003e${f.hint}\u003c/span\u003e`:''}\u003c/div\u003e`}\nfunction componentPage(){const metrics=metricDefs[0];return `\u003cdiv class=\"component-gallery\"\u003e\u003cdiv class=\"page-head\"\u003e\u003cdiv\u003e\u003cdiv class=\"caps\"\u003eShared patterns\u003c/div\u003e\u003ch1\u003eReusable component library\u003c/h1\u003e\u003cp\u003eCommon behaviors and interaction contracts; shells choose arrangement, density and visual voice.\u003c/p\u003e\u003c/div\u003e${btn('\u2190 Back to gallery','back-gallery','btn')}\u003c/div\u003e\u003cdiv class=\"notice\"\u003eThis is a local UI demonstration. Production components must respect TrialAgents' data bindings, reviewed saves, access policies, and trusted chart host.\u003c/div\u003e\u003cdiv class=\"components-grid\"\u003e\u003cdiv class=\"card component-demo\"\u003e\u003cdiv class=\"caps\"\u003e01 / Navigation\u003c/div\u003e\u003ch3\u003eCoherent main tabs with Settings\u003c/h3\u003e\u003cp\u003eSettings opens a full page on the same navigation level\u2014not a dropdown in an unrelated corner.\u003c/p\u003e\u003cdiv class=\"shell-nav\"\u003e${['Overview','Analysis','Data','\u2699 Settings'].map((x,i)=\u003e`\u003cbutton data-action=\"component-demo\" class=\"${i===1?'active':''}\"\u003e${x}\u003c/button\u003e`).join('')}\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"card component-demo\"\u003e\u003cdiv class=\"caps\"\u003e02 / State\u003c/div\u003e\u003ch3\u003eSemantic badges and feedback\u003c/h3\u003e\u003cp\u003eUse the same statuses across views; color supplements the label.\u003c/p\u003e\u003cdiv style=\"display:flex;gap:8px;flex-wrap:wrap\"\u003e${['On track','Review','Blocked','Qualified','Researching'].map(status).join('')}\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"card component-demo\"\u003e\u003cdiv class=\"caps\"\u003e03 / Controls\u003c/div\u003e\u003ch3\u003eFilter toolbar\u003c/h3\u003e\u003cp\u003eSearch, date/scope filters and primary action remain on one row until narrow layouts need Filters.\u003c/p\u003e${recordsToolbar().replace('record-search','component-search')}\u003c/div\u003e\u003cdiv class=\"card component-demo\"\u003e\u003cdiv class=\"caps\"\u003e04 / Settings\u003c/div\u003e\u003ch3\u003eVersioned settings destination\u003c/h3\u003e\u003cp\u003eFull structured page with General, Display and About. Live host owns persistence.\u003c/p\u003e\u003cdiv class=\"row-item\"\u003e\u003cspan\u003eDefault view\u003c/span\u003e\u003cspan class=\"badge blue\"\u003eOverview\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"row-item\"\u003e\u003cspan\u003eChart density\u003c/span\u003e\u003cspan\u003eComfortable\u003c/span\u003e\u003c/div\u003e${btn('See analytics settings \u2197','open-analytics-settings','btn primary')}\u003c/div\u003e\u003cdiv class=\"card component-demo\" style=\"grid-column:1/-1\"\u003e\u003cdiv class=\"caps\"\u003e05 / Analytical charts\u003c/div\u003e\u003ch3\u003eModern interactive chart contract\u003c/h3\u003e\u003cp\u003eClick legends to toggle series. Hover or focus the SVG and use arrow keys for precise point values, crosshair, and an aligned tooltip.\u003c/p\u003e\u003cdiv class=\"mini-legend\"\u003e${series.map(s=\u003e`\u003cbutton data-action=\"series:${s.key}\" class=\"${S.seriesHidden[s.key]?'off':''}\"\u003e\u003ci class=\"swatch\" style=\"--c:${s.color}\"\u003e\u003c/i\u003e${s.key}\u003c/button\u003e`).join('')}\u003c/div\u003e\u003cdiv class=\"chart-wrap\" style=\"max-width:860px\"\u003e${chartSVG(metrics.id,window.innerWidth\u003c620?355:window.innerWidth\u003c850?600:860)}\u003cdiv class=\"chart-tooltip\" hidden\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"card component-demo\"\u003e\u003cdiv class=\"caps\"\u003e06 / Record operations\u003c/div\u003e\u003ch3\u003eSearchable tables with safe actions\u003c/h3\u003e\u003cp\u003eFull dataset query \u2192 sort and filter \u2192 pagination; explicit View, Duplicate and Delete affordances.\u003c/p\u003e\u003cdiv class=\"row-item\"\u003e\u003cstrong\u003eCascadia Bio\u003c/strong\u003e${status('Qualified')}\u003c/div\u003e\u003cdiv class=\"row-item\"\u003e\u003cstrong\u003eOriole Therapeutics\u003c/strong\u003e${status('Researching')}\u003c/div\u003e${btn('Explore record shell \u2197','open-records','btn primary')}\u003c/div\u003e\u003cdiv class=\"card component-demo\"\u003e\u003cdiv class=\"caps\"\u003e07 / Decision integrity\u003c/div\u003e\u003ch3\u003eEvidence and human approvals\u003c/h3\u003e\u003cp\u003eCompare candidate scores while keeping coverage, review state and decision authority explicit.\u003c/p\u003e\u003cdiv class=\"ranking-row\" style=\"grid-template-columns:25px 115px minmax(0,1fr) 35px\"\u003e\u003cspan\u003e01\u003c/span\u003e\u003cstrong\u003eNorthbridge\u003c/strong\u003e\u003cdiv class=\"progress\"\u003e\u003cspan style=\"width:89%\"\u003e\u003c/span\u003e\u003c/div\u003e\u003cb\u003e89\u003c/b\u003e\u003c/div\u003e\u003cdiv class=\"row-item\"\u003e\u003cspan\u003eDecision sign-off\u003c/span\u003e${status('Review')}\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e`}\nfunction render(){let variant=document.body.dataset.variant;let h=variant==='analytics'?analytics():variant==='portfolio'?portfolioRender():variant==='records'?records():variant==='decision'?decision():componentPage();const root=$('#app');if(root)root.innerHTML=h+(variant==='records'\u0026\u0026S.drawer?recordsDrawer():'');attachCharts();}\nfunction updateTooltip(svg,index){const wrap=svg.closest('.chart-wrap'),tip=wrap.querySelector('.chart-tooltip');if(!tip)return;let m=svg.dataset.chart,len=Number(S.analyticsRange),start=weeks.length-len;index=Math.max(0,Math.min(len-1,index));S.chartIndex[m]=index;const W=Number(svg.viewBox.baseVal.width),x=44+index*((W-56)/(len-1));const cross=svg.querySelector('.crosshair');if(cross){cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.style.display='block'};tip.hidden=false;tip.innerHTML=`\u003cb\u003e${weeks[start+index]}, 2026\u003c/b\u003e\u003cdiv\u003e${series.filter(s=\u003e!S.seriesHidden[s.key]).map(s=\u003e`\u003cdiv\u003e\u003cspan class=\"key\" style=\"--c:${s.color}\"\u003e\u003c/span\u003e${s.key}: \u003cstrong\u003e${fmt(valuesFor(s.key,m).slice(start)[index])}\u003c/strong\u003e\u003c/div\u003e`).join('')||'No series selected'}\u003c/div\u003e`;const rect=wrap.getBoundingClientRect(),fraction=x/W;tip.style.left=Math.max(8,Math.min(rect.width-160,rect.width*fraction-70))+'px';tip.style.top='17px'}\nfunction attachCharts(){document.querySelectorAll('svg.chart').forEach(svg=\u003e{svg.addEventListener('mousemove',e=\u003e{const r=svg.getBoundingClientRect();const W=Number(svg.viewBox.baseVal.width),p=(e.clientX-r.left)/r.width*W;const len=Number(S.analyticsRange),i=Math.round((p-44)/(W-56)*(len-1));updateTooltip(svg,i)});svg.addEventListener('mouseleave',()=\u003e{svg.querySelector('.crosshair')?.setAttribute('style','display:none');const tip=svg.closest('.chart-wrap').querySelector('.chart-tooltip');if(tip)tip.hidden=true});svg.addEventListener('keydown',e=\u003e{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();updateTooltip(svg,(S.chartIndex[svg.dataset.chart]??0)+(e.key==='ArrowRight'?1:-1))}});svg.addEventListener('focus',()=\u003eupdateTooltip(svg,S.chartIndex[svg.dataset.chart]??Number(S.analyticsRange)-1))})}\nfunction handleAction(action){if(action==='prev'){S.rowPage=Math.max(0,S.rowPage-1);render();return}if(action==='next'){S.rowPage++;render();return}if(action==='toggle-filters'){S.filtersOpen=!S.filtersOpen;render();return}if(action==='add-row'){S.drawer='new';render();return}if(action==='close-drawer'){S.drawer=null;render();return}if(action==='save-settings'){toast('Preview settings updated in local state only. No TrialAgents save was made.');return}if(action==='ignore-settings'){S.settingsSection='General';toast('Preview changes ignored.');render();return}if(action==='preview-decision'){toast(`Local preview choice: ${S.preferred}. No approval or database write.`);return}if(action==='back-gallery'){window.location.href='index.html';return}if(action==='component-demo'){toast('Navigation component: use a shell preview for a working page.');return}if(action==='open-records'){window.location.href='records.html';return}if(action==='open-analytics-settings'){window.location.href='analytics.html#settings';return}if(action.startsWith('goto:')){S.page=action.split(':')[1];S.rowPage=0;render();window.scrollTo({top:0,behavior:'instant'});return}if(action.startsWith('settings-section:')){S.settingsSection=action.split(':')[1];render();return}if(action.startsWith('series:')){let key=action.slice(7);S.seriesHidden[key]=!S.seriesHidden[key];render();return}if(action.startsWith('inspect-metric:')){const m=metricDefs.find(x=\u003ex.id===action.split(':')[1]);toast(m.title+': hover the chart, use the keyboard, or open Data to inspect source records.');return}if(action.startsWith('open-row:')){S.drawer=Number(action.split(':')[1]);render();return}if(action.startsWith('record-menu:')){S.drawer=Number(action.split(':')[1]);render();return}if(action.startsWith('duplicate:')){let r=S.records.find(x=\u003ex.id===Number(action.split(':')[1]));if(r){S.records.push({...r,id:Math.max(...S.records.map(x=\u003ex.id))+1,name:r.name+' (copy)',status:'Researching'});S.drawer=null;toast('Record duplicated locally (preview only).');render()}return}if(action.startsWith('delete:')){S.records=S.records.filter(x=\u003ex.id!==Number(action.split(':')[1]));S.drawer=null;toast('Record deleted locally (preview only).');render();return}}\ndocument.addEventListener('click',e=\u003e{const nav=e.target.closest('[data-nav]');if(nav){S.page=nav.dataset.nav;S.settingsSection='General';S.rowPage=0;S.drawer=null;render();window.scrollTo({top:0,behavior:'instant'});return}const sort=e.target.closest('[data-sort]');if(sort){let key=sort.dataset.sort;S.sort={key,dir:S.sort.key===key?-S.sort.dir:1};S.rowPage=0;render();return}const button=e.target.closest('[data-action]');if(button){if(button.classList.contains('drawer-shade')\u0026\u0026e.target!==button)return;handleAction(button.dataset.action)}});\ndocument.addEventListener('change',e=\u003e{const x=e.target;if(x.id==='range-select'){S.analyticsRange=x.value;render()}else if(x.id==='source-select'){S.analyticsSource=x.value;render()}else if(x.id==='portfolio-scope'){S.portfolioScope=x.value;render()}else if(x.id==='record-region'||x.id==='record-region-mobile'){S.region=x.value;S.rowPage=0;render()}else if(x.id==='record-status'||x.id==='record-status-mobile'){S.status=x.value;S.rowPage=0;render()}else if(x.id==='vendor-focus'){S.vendorFocus=Number(x.value);render()}else if(x.id==='preferred-vendor'){S.preferred=x.value}else if(x.dataset.setting){S.settings[x.dataset.setting]=x.type==='checkbox'?x.checked:x.value}});\ndocument.addEventListener('input',e=\u003e{const x=e.target;if(x.id==='record-search'){const pos=x.selectionStart;S.recordQuery=x.value;S.rowPage=0;render();const n=$('#record-search');if(n){n.focus();n.setSelectionRange(pos,pos)}}});\ndocument.addEventListener('submit',e=\u003e{if(e.target.id!=='record-form')return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());if(!d.name.trim()){toast('Name is required');return};const rec={...d,employees:Number(d.employees),date:'Nov 07'};if(d.recordId==='new'){rec.id=Math.max(...S.records.map(x=\u003ex.id),0)+1;S.records.push(rec)}else{rec.id=Number(d.recordId);let i=S.records.findIndex(x=\u003ex.id===rec.id);if(i\u003e=0)S.records[i]={...S.records[i],...rec}}S.drawer=null;toast('Preview record updated locally. No production data changed.');render()});\nif(location.hash.toLowerCase()==='#settings')S.page='Settings';render();\n})();\n\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e"};
const tips={analytics:'Analytics: trends, KPIs, acquisition reporting.',portfolio:'Portfolio: program oversight, milestones and delivery risk.',records:'Records: biotech outreach, CRM and daily operational tables.',decision:'Decision: CRO shortlists, scorecards and evidence review.',components:'Shared: settings, navigation, charts, tables and status patterns.'};
function setShell(v){document.getElementById('review-frame').srcdoc=pages[v];document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.shell===v)));document.getElementById('usage').textContent=tips[v]}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>setShell(b.dataset.shell)));setShell('analytics');
</script></body></html>
