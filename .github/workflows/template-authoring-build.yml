name: Template authoring build
on:
  push:
    branches: ['templates/life-science-suite-2026-10-31']
    paths:
      - '.github/workflows/template-authoring-build.yml'
      - 'templates/life-science/**'
      - 'scripts/repair-life-science-authoring.py'
permissions:
  contents: write
concurrency:
  group: template-authoring-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/templates/life-science-suite-2026-10-31'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python3 scripts/repair-life-science-authoring.py
      - run: node scripts/build-life-science-templates.mjs
      - name: Synchronize first-release authoring sources on the isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/life-science templates/standalone templates/apps
          if ! git diff --cached --quiet; then
            git commit -m 'Pass authoring typography contrast and accessible table checks'
            git push origin HEAD:refs/heads/templates/life-science-suite-2026-10-31
          fi
      - run: npm ci
      - run: npm run build
      - name: Real catalog and database tests
        run: APP_DESIGN_CHECKS=off node --import tsx --test --test-concurrency=1 tests/life-science-templates.test.ts tests/app-templates.test.ts
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Official design quality checks across all 143 screens
        run: node --import tsx tests/life-science-design.check.mjs
      - name: Actual trusted-frame navigation and record editing
        run: node --import tsx tests/life-science-frame.check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-template-validation
          path: |
            /tmp/life-science-design-qa.json
            /tmp/life-science-frame-qa/result.json
            templates/life-science/BUILD_MANIFEST.json
          retention-days: 7
