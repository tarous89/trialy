name: Template authoring build
on:
  push:
    branches: ['templates/life-science-suite-2026-10-31']
    paths:
      - '.github/workflows/template-authoring-build.yml'
      - 'templates/life-science/**'
      - 'scripts/build-life-science-templates.mjs'
      - 'tests/life-science-templates.test.ts'
permissions:
  contents: write
concurrency:
  group: template-authoring-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/templates/life-science-suite-2026-10-31'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply reproducible pre-release input-focus correction
        run: python3 scripts/repair-life-science-authoring.py
      - name: Generate all 23 catalog entries and standalone interfaces
        run: node scripts/build-life-science-templates.mjs
      - name: Retain corrected source and generated files on authoring branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/life-science templates/standalone templates/apps scripts/build-life-science-templates.mjs tests/life-science-templates.test.ts tests/app-templates.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Retain field focus and unapplied calculation inputs through trusted frame renders'
            git push origin HEAD:refs/heads/templates/life-science-suite-2026-10-31
          fi
      - run: npm ci
      - name: Production build and type checks
        run: npm run build
      - name: Domain templates and real database save/access regressions
        run: |
          set -o pipefail
          APP_DESIGN_CHECKS=off node --import tsx --test --test-concurrency=1 tests/life-science-templates.test.ts tests/app-templates.test.ts 2>&1 | tee /tmp/template-tests.log
      - name: Install browser for unchanged trusted bridge
        run: npx playwright install --with-deps chromium --only-shell
      - name: All 143 screens and edits through the shipped sandbox frame
        run: node --import tsx tests/life-science-frame.check.mjs
      - name: Export standalone HTML deliverables
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('trialagents-23-templates.zip', 'w', ZIP_DEFLATED) as z:
              for p in Path('templates/standalone').glob('*'):
                  if p.is_file(): z.write(p, p.name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: template-html-and-validation
          path: |
            trialagents-23-templates.zip
            /tmp/template-tests.log
            /tmp/life-science-frame-qa/result.json
            templates/life-science/BUILD_MANIFEST.json
          retention-days: 7
