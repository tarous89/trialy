name: Template authoring build
on:
  push:
    branches: ['templates/life-science-suite-2026-10-31']
    paths:
      - '.github/workflows/template-authoring-build.yml'
      - 'templates/life-science/**'
      - 'scripts/build-life-science-templates.mjs'
      - 'tests/life-science-templates.test.ts'
permissions:
  contents: write
concurrency:
  group: template-authoring-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/templates/life-science-suite-2026-10-31'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Expand checksum-verified source transfer
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          parts = sorted(Path('.authoring').glob('part-*.b64'))
          if not parts:
              print('Source already expanded')
              raise SystemExit(0)
          assert len(parts) == 11
          encoded = ''.join(p.read_text() for p in parts)
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '5ef70f45269f2b1f58b8102ab9151dfb34eb08901d5c1aa9796cb90ed59e461f'
          sources = json.loads(raw)
          allowed = {'templates/life-science/definitions.mjs', 'templates/life-science/renderer.js', 'templates/life-science/theme.css', 'templates/life-science/standalone-host.js', 'templates/life-science/README.md', 'scripts/build-life-science-templates.mjs', 'tests/life-science-templates.test.ts', 'tests/app-templates.test.ts'}
          assert set(sources) == allowed
          for name, content in sources.items():
              destination = Path(name)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(content, encoding='utf-8')
          for p in parts:
              p.unlink()
          Path('.authoring').rmdir()
          print('Expanded 8 verified source files')
          PY
      - name: Generate all 23 immutable catalog entries and standalone interfaces
        run: node scripts/build-life-science-templates.mjs
      - name: Retain readable source and generated files on authoring branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .authoring templates/life-science templates/standalone templates/apps scripts/build-life-science-templates.mjs tests/life-science-templates.test.ts tests/app-templates.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Build 23 source-bound life-science templates and standalone HTML interfaces'
            git push origin HEAD:refs/heads/templates/life-science-suite-2026-10-31
          fi
      - run: npm ci
      - name: Production build and type checks
        run: npm run build
      - name: Domain templates and real database save/access regressions
        run: |
          set -o pipefail
          APP_DESIGN_CHECKS=off node --import tsx --test --test-concurrency=1 tests/life-science-templates.test.ts tests/app-templates.test.ts 2>&1 | tee /tmp/template-tests.log
      - name: Export standalone HTML deliverables
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('trialagents-23-templates.zip', 'w', ZIP_DEFLATED) as z:
              for p in Path('templates/standalone').glob('*'):
                  if p.is_file(): z.write(p, p.name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: template-html-and-validation
          path: |
            trialagents-23-templates.zip
            /tmp/template-tests.log
            templates/life-science/BUILD_MANIFEST.json
          retention-days: 7
