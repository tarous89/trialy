# TEMPORARY: renders connector-access-linux.png in the CI environment so the
# reference image can be regenerated there. Remove before merging.
name: Temporary connector snapshot render
on:
  push:
    branches: [fix/connector-access-snapshot]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: npx playwright test tests/visual/apps.spec.cjs -g "Connectors match existing controls" --update-snapshots
      - name: Print rendered image
        run: |
          f=tests/visual/apps.spec.cjs-snapshots/connector-access-linux.png
          sha256sum "$f"
          echo "PNG_BASE64_BEGIN"; base64 -w0 "$f"; echo; echo "PNG_BASE64_END"
      - name: Confirm the new image passes without updating
        run: npx playwright test tests/visual/apps.spec.cjs -g "Connectors match existing controls"
