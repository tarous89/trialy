name: Basic checks
# Pull requests, plus pushes to main. Other branch pushes are checked through their pull request,
# so each change runs once instead of twice. Documentation-only changes are not built or tested.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']
  workflow_dispatch:
# A newer push to the same pull request cancels the outdated run. Runs on main are never
# cancelled, so every main commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  core:
    name: core (unit and integration tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Exact version from .nvmrc, shared with the Dockerfile. Upgrade deliberately.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      # The extraction worker reads PDFs with poppler's pdftotext, as in the production image (Dockerfile).
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # Keep the full test output; the job log is long and hard to search.
      # shell: bash adds pipefail, so a test failure still fails the step through tee.
      - run: npm test 2>&1 | tee node-test-output.log
        shell: bash
      - run: npm prune --omit=dev
      - name: Verify production browser package
        run: |
          node node_modules/playwright/cli.js --version
          node --import tsx --input-type=module -e "import {inspectAppDesign} from './src/workspace/design-quality.ts'; const r=await inspectAppDesign([{name:'Production check',html:'<main><h1>App preview</h1><p>Readable content.</p></main>',css:''}]); if(r.status!=='passed')throw Error(JSON.stringify(r));"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: node-test-output
          path: node-test-output.log
          retention-days: 7
  visual:
    name: visual (screenshot and browser tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-test-results
          path: test-results/
          retention-days: 7
