  "id": "life.pipeline",
  "version": "1.0.0",
  "name": "Pipeline",
  "description": "Portfolio planner for a biotech team: programs, milestones, activities and decisions connected with their deliverables, risks and changes. An overview of every program (asset, disease, stage, next milestone, time to deadline, spend against forecast budget, health), program cards with expandable milestones, a shared timeline, deliverable, risk and change registers, completion review by the item owner, and weekly or monthly digests built from the records. Risks flag the items they affect, the work that depends on them and their programs; changes revise forecast dates and budgets item by item; dependencies gate when an item can start or complete.",
  "tags": [
    "biotech",
    "portfolio",
    "pipeline",
    "programs",
    "milestones",
    "decisions",
    "risks",
    "deliverables",
    "timeline",
    "planning"
  ],
  "whenToUse": "A biotech team plans its development portfolio as programs with milestones, activities and decisions, wants to see the next milestone, deadline, budget and risk exposure per program, log deliverables, risks and changes against the plan, gate work on dependencies and decision outcomes, have the owner approve completion when evidence is in, and read a weekly or monthly digest.",
  "whenNotToUse": "Competitor assets (Pipeline Radar), cash forecasts and runway (Runway), the full program office with function lanes, critical path, RAID scoring, monthly updates and leadership reports (Programs), resource or capacity planning, timesheets, task boards for day-to-day work, regulatory submissions, and sending email or notifications.",
  "engine": "frontend-js",
  "defaults": {
    "tableMap": "{}",
    "readOnly": false,
    "asOfOverride": ""
  },

    "tableMap": {
      "type": "string",

      "default": "{}"
    },
    "readOnly": {
      "type": "boolean",
      "description": "When true, the app saves no records even for users who may edit.",
      "default": false
    },
    "asOfOverride": {
      "type": "string",
      "description": "Optional fixed as-of date (YYYY-MM-DD) for previews and tests only. Leave empty: the app uses today’s date from the app runtime.",
      "default": ""
    }
  },
  "instructions": "Pipeline 1.0.0 is a frontend-js portfolio planner on the v2 app contract and the kit (it declares 'use trialagents v2'). It is the platform version of the standalone Pipeline prototype: the same screens, records and rules, with records in TrialAgents tables, files as TrialAgents documents, completion approval through the platform account, and only app settings. Install it with prepare_app_from_template (pin life.pipeline 1.0.0 and its digest, one requestKey); the installation popup creates or connects organizations (core v1), optionally people, and creates pipeline.items, pipeline.events, pipeline.digests and pipeline.settings. Never add sample records: the app starts empty and every empty screen offers the first action. Plan items: item_type Program, Milestone, Activity or Decision; a milestone’s parent_id is a program, an activity’s or decision’s a program or a milestone; programs have no parent. parent_rule start or finish makes the item a mandatory prerequisite of its parent (parent_outcome is the decision outcome the parent needs). Status values Planned, In progress, Pending, On hold, Completed and Cancelled; Completed needs approved_on and approved_owner equal to owner, set only by the app’s Approve completion action, never by an assistant. Events: event_type Deliverable, Risk or Change; item_ids lists affected plan item IDs separated by commas; a change’s forecasts JSON revises dates and budgets per affected item. Read the plan with the app commands overview.read, plan.read, events.read and digest.read. Record changes are made in the app by a person, or by the user’s assistant through the Database with the same rules.",
  "documentation": {
    "quickStart": [
      "Read the guide, the reference and this template’s documentation; pin life.pipeline 1.0.0 and its digest with one requestKey.",
      "Overview → Add program, then Add record → Milestone, Activity or Decision under it (Linked items → Belongs to). Pick a dependency (Required to start or Required to complete) where the child gates its parent.",
      "Log deliverables, risks and changes from Add record, a register, or the plan item’s own form. A change revises forecast dates and budgets item by item.",
      "When a deliverable is attached to an item whose prerequisites are met, it appears under Overview → Awaiting owner approval; open it and choose Approve completion, then Save.",
      "Owners may set the budget currency and date format in Settings."
    ],
    "dataContract": "Stable role keys. Core data contract v1: organizations (name text*, org_type, country, website, archived) and people (optional: name text*, organization_id text record ID of organizations, title, email, archived), used as the organizations on plan items and events and their contact persons. App contract pipeline.v1: pipeline.items (name text*, item_type select Program/Milestone/Activity/Decision*, parent_id text record ID of the parent item, parent_rule select start/finish, parent_outcome select Approved/Conditional/No-go, description, asset, disease, stage select Discovery/Preclinical/Phase 1/Phase 2/Phase 3, start_date, end_date (target date for milestones and decisions), earliest_date, latest_date, owner text, status select Planned/In progress/Pending/On hold/Completed/Cancelled*, decision_outcome select, budget, spend, reserve numbers, team text (names separated by commas), organization_ids text (record IDs separated by commas), files text (JSON list of {v: document version ID, n: file name}), approved_on date, approved_owner text, client_ref text, archived); pipeline.events (name text*, event_type select Deliverable/Risk/Change*, item_ids text (plan item IDs separated by commas), description, event_date, owner, team, organization_ids, signoff, format select Decision/Document/Information/Email/Other, severity select Low/Medium/High, risk_status select Open/Closed, place, forecasts text (JSON {<item ID>:{end, budget}}), files, client_ref, archived); pipeline.digests (title*, kind select Weekly/Monthly*, period_start, period_end, program_id, contents JSON, saved_on, archived); pipeline.settings (one row: currency select EUR/USD/GBP/CHF/CAD/AUD/JPY, date_format select D MMM/DD/MM/YYYY/MM/DD/YYYY/YYYY-MM-DD). Derived, never stored: forecast dates and budgets (baseline plus dated changes in order, later values superseding earlier ones field by field), risk exposure (the highest open severity over affected items, downstream prerequisite chains and ancestors), event counts and the approval queue.",

 if(saves.length){try{apply(saves);}catch(e){document.getElementById('message').textContent=e.message;}return dispatch({kind:'refresh',action:''});}
 document.getElementById('surface').innerHTML=out.html;}
function eventFor(kind,target){const trigger=target.closest('[data-action]');if(!trigger)return;const form=trigger.closest('form');dispatch({kind,action:trigger.dataset.action,value:target.type==='checkbox'?target.checked:target.value??null,form:form?Object.fromEntries(new FormData(form)):{}});}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.type==='submit'){e.preventDefault();eventFor('submit',b);return;}if(b.closest('[data-action]'))eventFor('click',b);});
document.addEventListener('submit',e=>{e.preventDefault();eventFor('submit',e.target);});
document.addEventListener('change',e=>{if(!e.target.matches('input[data-ui-state]:not([type=date]),textarea[data-ui-state]'))eventFor('change',e.target);});
document.addEventListener('input',e=>{if(e.target.matches('input[data-ui-state]:not([type=date]),textarea[data-ui-state]')){const n=e.target.name,pos=e.target.selectionStart;eventFor('change',e.target);const again=n?document.querySelector('[name="'+n+'"]'):document.querySelector('[data-action="'+e.target.dataset.action+'"]');if(again){again.focus();try{again.setSelectionRange(pos,pos);}catch(x){}}}});
dispatch({kind:'open',action:''});
</script></body></html>
