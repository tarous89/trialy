/* PI Network Management — CRO research-network atlas / warm documentary visual identity. */

.pn-person-tile strong{font-size:12px}.pn-person-tile small{font-size:12px;color:#4d6355}

  "instructions": "Create an internal TrialAgents CR-03 PI Network Management app from the bundled source, aligned with authoring and usage guidance 1.3.9. Reference Citeline Sitetrove+ ONLY for professional investigator/site search, identity, affiliations, sourced trial history and comparison layout; NO Citeline license, proprietary datasets, tiering, recruitment forecasts or patient access. This is a CRO network workspace distinct from sponsor CO04 Investigator CRM.\n\nCritical setup: no app-level auth/accounts, signup, passwords, email sender, logo, imaginary permissions, patient data, or unsolicited contact. TrialAgents supplies its own official linked watermark (https://platform.trialagents.com), backend access enforcement, versioned database records, reviewed mutation and all optional automations. Sidebar must show full name with NO logo. Each screen has only one title and concise subline; no fictional-data banner.\n\nRead all catalog documentation before preparing. First reuse compatible authorized tables or create missing scalar tables via reviewed host operations. Follow real schema, including snake_case keys, multiple:false on ALL fields, kinds, options, nullable references, required fields and table access; do not create app-local users. Set tableMap option to JSON mapping each role to actual approved typeId UUID, fields map logical camelCase to real snake_case physical field, and writableFields array. Read table metadata and construct templateBindings with actual typeId, field allowlist and a valid manifest. Use only approved saved IDs for child references. Creation order: people, institutions and requests first; affiliations, sourced experience, engagements, collaborations and research findings next; actions and PI ratings after parent IDs. Records may be incomplete or denied: never show missing data as zero or claim verified comparison.\n\nRecord evidence safeguards: professional name collisions require public identifier / dated affiliation review. Trial experience needs a sourced registry ID, exact investigator role and verified date. Dated affiliations cannot be rewritten to another PI, and duplicate (person,site,start) and (person,registryId,role) are rejected. Engagement logs never send email. Do not archive a PI/site/request with live children or unreadable dependency sources. Every update/archive uses record version captured on editor/confirmation open; missing/stale versions are conflicts, not creation. Copies clear approval/identity/protected fields.\n\nMatching logic: request has three explicit weights (expertise, clinical trial experience, geography) summing to 100%. PI assessment scores must be integers 1-5, require a reviewed state, reviewer, exact criteria version, date, evidence URL and rationale. Score percentage = sum(score_factor * weight_percent) / 5. No reviewed score until complete authorized people, affiliations, public trial evidence, request and ratings reads; zero is NOT an unknown. Edits to reviewed criteria or ratings require a new revision. Results are human-entered professional fit assessments, never proprietary rankings, inferred patient access, PI availability or recruitment forecast. No automatic outreach.\n\nUI: network pulse, PI dossier, site connections, sourced trial evidence, engagement history, PI matching. Native settings gear action tracker:layout with templateLayoutSchema and host-saved layoutProfile; hidden list columns use saved visible/order without removing required form controls. Each transient input/select/textarea has data-ui-state and stable data-action plus name. Use actual input.event.kind/action/form, preserve changed drafts even on failed proposals. Pagination on all registers; labels indicate partial authorized coverage. Preview uses same source in Browser with injected config/bindings but no app account.\n\nAutomation setup: zero automations is valid. Only after app saved and user approval, inspect live read_app_automation_guide and automation setup. Optional ChatGPT public professional-source refresh with scope, cadence, timezone, expiry, dedup (person/public ID/site, source URL), coverage report and explicit review-only output; partial findings must be reported, no automatic write or contact. Optional TrialAgents team email reminders only through approved platform email executor with fixed text, existing authorized recipients, consent, expiry and source-state revalidation; never invent interpolated placeholders. No tasks activate from this catalog; a disabled/failed task never blocks app access or draft retention.\n\nRelease QA: inspect catalog full schema, source length, native layout declaration, output metadata. Complete architect preflight 1.3.9 locally; live host catalog discovery, prepared QuickJS, manifest sandbox, reviewed DB schema/receipt and automations require independent acceptance. Do not claim publication or deployment because ZIP exists.\n\nComplete host scalar schema (logical names mapped to snake_case physical fields, ! required, ? optional):\npeople => name:text!, professional_id:text?, specialty:select![Oncology|Neurology|Rare diseases|Immunology|Cardiology|Other], title:text?, country:text?, status:select![Prospect|Introduced|Engaged|Collaborating|Inactive], priority:select?[High|Medium|Low], interest:select?[Unconfirmed|Interested|Not currently interested|Declined], source_url:text!, verified_at:date!, opt_out:boolean?, preferred_channel:select?[Unknown|Through institution|Professional introduction|Conference|Opt out], notes:text?, archived:boolean?\ninstitutions => name:text!, city:text?, country:text!, kind:select?[University hospital|Academic center|Research institute|Clinic|Other], capabilities:text?, source_url:text!, verified_at:date!, archived:boolean?\naffiliations => name:text!, person_id:text!, institution_id:text!, role:text!, start_at:date!, end_at:date?, source_url:text!, verified_at:date!, archived:boolean?\nexperience => name:text!, person_id:text!, institution_id:text?, registry_id:text!, trial_role:text!, phase:select?[Phase 1|Phase 2|Phase 3|Phase 4|Not reported], indication:text?, specialty:text?, source_url:text!, verified_at:date!, archived:boolean?\nengagements => name:text!, person_id:text!, institution_id:text?, project_ref:text?, channel:select![Meeting|Call|Conference|Feasibility discussion|Correspondence|Other], occurred_at:date!, owner:text!, purpose:text!, outcome:text!, next_step:text?, notes:text?, archived:boolean?\ncollaborations => name:text!, person_id:text!, institution_id:text?, project_ref:text!, status:select![Considering|Invited|Discussing|Confirmed|Closed|Declined], invited_at:date?, responded_at:date?, owner:text!, notes:text?, archived:boolean?\nactions => name:text!, person_id:text!, engagement_id:text?, owner:text!, due_at:date!, status:select![Open|In progress|Done|Cancelled], completed_at:date?, detail:text?, archived:boolean?\nfindings => name:text!, person_id:text?, source_url:text!, source_type:select![Registry|Publication|Institution profile|Other public source], topic:text!, verified_at:date!, reviewer:text?, reviewed_at:date?, status:select![Candidate|Draft|Reviewed|Rejected], rationale:text?, archived:boolean?\nrequests => name:text!, study_code:text!, indication:text!, country:text!, phase:select![Phase 1|Phase 2|Phase 3|Phase 4|Other], owner:text!, weight_expertise:number!, weight_experience:number!, weight_geography:number!, criteria_version:text!, status:select![Draft|Active|Closed], description:text?, archived:boolean?\nratings => name:text!, request_id:text!, person_id:text!, expertise_score:number?, experience_score:number?, geography_score:number?, criteria_version:text!, assessor:text!, assessed_at:date!, evidence_url:text!, rationale:text!, status:select![Draft|Reviewed|Rejected], archived:boolean?\n\nHost app behavior: create, edit, duplicate, soft archive under approved proposals. Optional source URLs stored as text. No direct external email, API credentials or proprietary data. Always check authorized record completeness.\nHost release rules: forms submit data-action=save; output html/css/state separately; host injects templateConfiguration and templateBindings once. Edits/archives send recordId and editor-open expectedVersion, including zero. Proposals are not commits; preserve drafts on ignore/failure, reconcile receipts and reopen after confirmation. Optional empty date/ref/number/select values are null. All mapped fields including optional ones must be authorized and present, archived/optOut explicit booleans; missing access never means false. Reads are 80 rows x 9 pages/role, 720 rows per role, 90 reads across ten roles plus proposal. Known stable totals, scalar values and complete reads are required. New rows require all mapped write fields; changed fields cannot be silently dropped outside grants. Ratings require study request status write scope for an atomic same-status parent version guard. Concurrent criteria/rating edits conflict. Reviewed findings/ratings cannot be downgraded or archived. Close an active study brief and create a new criteria revision before changing evidence used in active reviewed matching. Opt-out remains editable and immediately withholds matching. Independent Database edits need reconciliation; guards are app-level, not database-wide constraints. Hidden/unlisted fields are reachable through Additional fields, revealed automatically on errors. Native screen/field visibility is presentation, not access control. Each child proposal atomically pins every populated direct parent at its editor-open version; it requires parent status write scope for people/requests and name write scope for other parent roles. Re-read and reopen after a conflict. These same-value guard updates advance host versions; never claim they represent changed business facts. Creating or editing an assessment and changing its source evidence cannot both commit from the same stale parent snapshot. No source queries or notifications run in the browser.",
