  "id": "life.cro-selection",
  "version": "2.0.0",
  "name": "CRO Selection",
  "description": "Choose CROs, CDMOs and labs, from the need to a signed award and a clean handover. Quick quote or full selection: longlist, optional RFI, RFP through private supplier links (no supplier accounts), questions and clarifications, a normalised bid grid with deviations, blind weighted scoring, qualification, bid defence, a recorded decision with notices to every supplier, onboarding and an award that other apps can read.",

  "whenToUse": "A small biotech chooses a CRO, CDMO or lab: define the need, invite suppliers, answer questions, compare proposals, score, decide, notify and hand over. Use it for quick quotes (many small preclinical or CMC requests, 2 to 5 suppliers) and for full selections (a few large clinical selections with RFI, RFP, bid defence and onboarding).",
  "whenNotToUse": "Purchasing and payments (purchase orders, invoices), contract drafting or e-signature (use Contracts for the register), vendor performance during studies (CRO Oversight), supplier marketplaces or supplier portals with accounts, auctions, negotiation workflows, or responding to RFPs as a CRO (CRO RFP Management).",

  "instructions": "CRO Selection 2.0.0 is a custom frontend-js app for choosing CROs, CDMOs and labs. It replaces CRO Selection 1.0.1 and Sponsor RFP Management 1.0.1. Read read_app_template_guidance (usage, authoring and contracts, every nextOffset; guidance 1.3.23 or later, especially \"External exchange from apps\" and \"Platform documents inside apps\") before preparing it. Pin life.cro-selection 2.0.0 with its digest. Do not add login, accounts, a supplier portal, email sending code or file storage: suppliers answer through the platform exchange only.\nINSTALL. Check list_archived_items (kind apps, templateId life.cro-selection) and offer to restore an archived app first. Use installs the app with empty tables. The Use existing data? dialog connects an existing organizations, people, programs, studies or agreements table by default (core.v1; reuse, never copy); everything else gets new croselection.* tables. Assistants may propose choices with prepare_data_access and never confirm them. No records are seeded. Questions, cost categories, criteria and checklists start from built-in fictional defaults per service type; questions and cost categories are copied onto each request, where people edit them.\nJOURNEY. Stages: need, longlist, rfi (full selection only, optional), rfp, questions, proposals, evaluation, bid_defence (full selection only), decision, onboarding, closed. Quick quote: scope, assumptions and a few questions, 2 to 5 suppliers, compare, decide, notify. Full selection: optional RFI round, shortlist, RFP round with request pack and CDA, questions, proposals, blind scoring and qualification, bid defence with 2 to 3 finalists, decision, notices, onboarding, handoff. Stage moves are reviewed record writes.\nEXCHANGE (all supplier communication; guidance 1.3.23: one confirmation when something goes out). The app calls tools.call('exchange.*'), one per click or submit. One exchange group per round (exchange.createGroup with appRef request:<request id>:rfi|rfp): RFI and RFP are separate groups, each with its brief (scope, assumptions, bid-grid categories, numbered questions), request pack (exchange.shareDocuments with platform documents), response form on croselection.proposals, confidentiality gate and the invitation text of its request kind (rfi, rfp or quick_quote); other email types use the platform defaults. One exchange per supplier, bound to its croselection.invitations record (exchange.invite with recordId). Creating the round and the links, and sharing documents before anyone outside has seen the round, are applied on the person's click with no separate review. One review then sends the invitation (exchange.prepareEmail shown exactly as returned, exchange.sendEmail) and marks the suppliers invited in the same transaction. Signed CDA: slot signed_cda; gate signed_document when the request has the CDA gate on; accepting the signed CDA (exchange.acceptFile) marks it signed in the same review. Submissions: only the latest version per supplier is shown; exchange.acceptSubmission with target new creates the croselection.proposals record and marks the supplier submitted in one review. Messages: exchange.reply (private) and exchange.publishClarification (anonymised). Decision notices: exchange.replyAll, one private message per supplier with the winner text or the text for the others (with the debrief offer), in the same review as the decision when the person keeps Notify all ticked. Status per supplier comes from exchange.list and exchange.status; no exchange IDs are stored in records. Deadline: exchange expiry = response deadline; exchange.extend; exchange.revoke stops a link and keeps what was received.\nASSISTANTS (Claude and ChatGPT, each through its own connection). You may read accepted proposals, messages and clarifications the user can read (list_exchanges, list_exchange_submissions, list_exchange_messages, read_exchange_email_default, list_exchange_emails). You never read unaccepted uploads or their values, and you never handle, repeat or ask for recipient links. You may draft: the request from a protocol synopsis or notes; a longlist with sources when asked (propose organizations and croselection.invitations with status longlist); questions; email texts and per-supplier personalisation (prepare_exchange_email with overrides; the person confirms the send); replies and clarifications (prepare_workspace_change reply_exchange or publish_exchange_clarification; a person confirms); the mapping of an accepted, AI-readable bid file into croselection.proposal_lines (category from the request's bid grid, amount, currency, deviation text such as \"assumes 40% fewer monitoring visits\") with prepare_change for the person's review; decision notes; onboarding checklists. You never send, publish, accept, choose the winner or give legal advice. Never write croselection.awards on your own initiative: the decision is recorded by a person in the app. Do not write status selected on an invitation.\nHANDOFF. Prepare the handoff in the app (Decision & onboarding). It writes a draft agreement into the shared agreements table (core fields only; complete it in Contracts) and stores the prepared spend lines and milestones as JSON in croselection.awards.handoff_status. CRO Selection never writes another app's own tables. When Runway or Programs are in the workspace and the user asks, propose the prepared items in the owning app's tables with prepare_change for the user's review: Runway plan lines (runway.plan_lines: name, direction spend, driver spread or one_off, amount, currency, start_month, end_month, status committed, counterparty_id) and Programs plan items (programs.plan_items: milestones with name, program_id, item_type milestone, end_date, status planned, is_key). With none of these apps the award simply stays; nothing errors.\nCALCULATIONS. Proposal total = sum of its lines in one currency, or the stated total without lines; other currencies are listed, never converted. Deviation per category = proposal amount minus sponsor baseline, and percent of the baseline. Weighted score = sum(mean reviewer score x weight) / 100 on a 1 to 5 scale; a mandatory criterion with a mean below 3 fails; spread = max minus min per criterion; no score is inferred for an unscored criterion. Blind scoring hides prices in Evaluation until every reviewer has scored every scored supplier on every criterion, or a person reveals them for the session. Latest proposal = highest accepted version per invitation and round. A qualification issue blocks the decision unless an override reason is given.\nCUSTOMIZE. Screens (rename, reorder, hide) through the layout gear (tracker:layout, presentation only). Templates, email texts, confidentiality text, decision texts, blind scoring, question-deadline default and currency in Settings (reviewed writes); a workspace email default is saved in the platform exchange (exchange.saveDefaultEmail) and replaces the app text for that email type. New fields or source changes are reviewed schema and app revisions (begin_app_update, finalize_app_preview once). Access on the Access page; sending needs \"Send to people outside the workspace\". Automations are optional and live in TrialAgents Automations; the app never reads automation status.",
  "documentation": {
    "quickStart": [

      "Evaluation: apply criteria, score blind per reviewer, complete qualification and the bid defence. Decision & onboarding: record the decision and notify every supplier in one review, complete onboarding, prepare the handoff and close the request."

    "dataContract": "Stable role keys; every field scalar (multiple false), lowercase snake_case, relationships by record ID in text fields. Core data contract v1: organizations (name*, org_type cro/cdmo/other for vendors, country, website, archived), people (optional: name*, organization_id, title, email, archived), programs (optional), studies (optional), agreements (optional; core fields only: name*, counterparty_id, agreement_type, status, effective_date, expiry_date, archived; Contracts-owned fields are not bound). App tables, contract croselection.v1: croselection.settings (one row: default_currency, blind_scoring default false, question_deadline_days default 7, confidentiality_text, decision_texts JSON {winner, others}, invitation_texts JSON {rfi|rfp|quick_quote:{subject, body}}); croselection.requests (name*, mode* quick_quote/full_selection, service_type*, program_id, study_id, scope*, assumptions JSON {notes, baseline:[{category, amount}]}, budget_estimate money, currency*, stage*, cda_option* send_pdf/contracts/skip/none, cda_gate, question_deadline, response_deadline*, decision_due, owner, rfi_questions, questions, cost_categories (one per line), archived); croselection.invitations (request_id*, organization_id*, contact_ids, recipient_emails*, status* longlist/rfi_invited/shortlisted/rfp_invited/declined/submitted/finalist/not_selected/selected, cda_status not_needed/sent/signed/in_place_elsewhere, cda_in_place_on, cda_agreement_id, notes); croselection.proposals (invitation_id, round rfi/rfp/quote, version, submitted_on, source exchange/manual/assistant_mapped, total money, pass_through money, currency, start_weeks, duration_months, answers, assumptions_delta, document_ids, accepted_on, notes); croselection.proposal_lines (proposal_id*, category*, description, units, unit_cost money, amount* money, currency*, deviation); croselection.criteria (request_id*, name*, category, weight*, mandatory); croselection.scores (request_id*, invitation_id*, criterion_id*, reviewer*, score* 1 to 5, evidence); croselection.checklist_items (request_id*, invitation_id, scope* qualification/bid_defence/onboarding, item*, owner, due, status* open/done/not_applicable/issue, evidence_document_id, notes); croselection.awards (published output, writer life.cro-selection: request_id*, organization_id*, service_type*, program_id, study_id, total money, currency*, start_date, duration_months, rationale*, approver*, decided_on*, delivery_team, agreement_id, onboarding_status in_progress/complete, handoff_status JSON). * = required. croselection.proposals is also the response table of every exchange group; because the platform requires each database-required field of a response table to be a question for the supplier, invitation_id, round, version, submitted_on, source and currency are set and checked by the app at acceptance instead of being database-required. Rounds, links, messages, clarifications, shared and returned documents, email batches and access events stay in the platform exchange: rounds are found by appRef, links by the invitation they are bound to; no exchange IDs or links are stored in records. Money is stored with an explicit currency and never converted. No patient data. No seed data.",
    "interactionContract": "Eight screens with stable IDs for the native layout gear: overview, requests, vendors, messages, proposals, evaluation, decision, settings; column group requests. A request picker selects the request on every screen; full selections switch between the RFI and RFP round. Overview: requests by stage with responses received / invited, waiting on us (unread messages, unanswered questions, submissions and files to accept), decisions and onboarding items due, recent awards. Requests: new quick quote or full selection, journey stepper with the next action and reviewed stage moves, documents out (request pack shared from platform documents; upload through the platform upload review), summary for leadership. Vendors: directory with history, longlist and shortlist with live status per supplier (opened, verified, CDA, downloads, draft, submitted version, unread), create links (applied on click), one send review shown exactly as returned (batch text, per-supplier personalisation, display name, optional scheduled reminder) that also marks the suppliers invited, email log, supplier details with extend, stop link and CDA options (send PDF, use Contracts, in place elsewhere). Messages: private threads, clarifications and addenda, reply privately or publish as clarification, question deadline with the unanswered list. Proposals: sponsor baseline, bid grid of the latest accepted proposals with deviations, other currencies listed, realism check, Ask from a cell (opens a private message), the latest submission per supplier and files to accept, manual proposals and lines. Evaluation: weighted criteria, reviewer scorecards (prices hidden only when blind scoring is on), qualification for any supplier at any stage with evidence documents, bid defence. Decision & onboarding: decision form (supplier, rationale, approver, date; override reason when a qualification issue is open; Notify all in the same review), Notify all, onboarding checklist with the award agreement's status, handoff. Settings: invitation text per request kind, workspace invitation default, decision notices, confidentiality text, blind scoring, question-deadline default, currency. Every input carries data-ui-state and a stable data-action; drafts survive failed proposals; record versions are captured when a form or panel opens. Manage automations in TrialAgents Automations; there is no automation screen in the app.",
    "lifecycle": "A new preview shows empty or fictional data, never writes and never contacts anyone; exchange and document capabilities need the saved app. Saved apps re-read their tables and configuration on every render. Record writes are records.propose batches (at most 50 per review) confirmed in the TrialAgents review; a stale version is rejected with the draft kept. Exchange writes are one per click: preparation nobody outside has seen is applied on the person's click; sends, notices, replies, clarifications, acceptances and revocations are one review that also carries the app's record changes (status, stage, award) and commits them in the same transaction. Layout changes are reviewed presentation-only revisions. Archive first: deleting the app archives it, which stops every supplier link; restoring it re-enables the links that have not expired and brings automations back switched off. Removing a tab unbinds; fields and tables are archived, never removed. Template updates never migrate saved apps: 1.0.1 apps keep working; 2.0.0 is a new install with its own tables.",
    "limitations": [
      "No supplier accounts or portal, no purchasing, purchase orders, invoices or payments, no e-signature (a signed PDF is uploaded back), no auctions or negotiation workflow, and no automatic award decision.",
      "Supplier pages, emails, messages and files are the platform exchange; this app cannot change their design, send attachments or track opens of emails. Deadlines are 1 to 90 days; up to 10 files of 25 MB per submission.",
      "Questions are sent as a numbered list in the brief and answered in one Answers field; prices are entered as total, pass-through, currency, start and duration. Line items per cost category come from mapping the bid file (by the person or as an assistant proposal).",
      "One exchange call per click: creating the round and the links are separate clicks (applied without a review); sending is one review.",
      "Currencies are never converted: bids in another currency are listed but not compared with the baseline.",
      "The price reveal in Evaluation is a per-session view choice, not a saved permission. Proposals and prices are otherwise protected by app and table access only.",
      "The app detects Contracts only through the shared agreements table. Runway and Programs items are prepared on the award and proposed in those apps by the user's assistant or entered there by hand.",
      "A proposal line, criterion, score or checklist item cannot be deleted from the app; set an amount or weight to 0, or mark an item not applicable. Built-in defaults are not a template library: edit questions and cost categories on each request.",
      "The vendor directory lists organizations of type cro, cdmo and other (labs), because the core contract has no lab type.",
      "Not legal or purchasing advice. No patient data."
    ],
    "examples": [
      {
        "prompt": "We need a quote for a 28-day GLP tox study in rats. Set up a quick quote for three labs, due in two weeks.",
        "expectedBehavior": "Proposes one croselection.requests record (mode quick_quote, service preclinical_study, scope, assumptions with a baseline per cost category, response deadline) and, when asked, croselection.invitations for the named vendors with status longlist. Explains that the round, links and invitation email are created and confirmed by the user in Vendors. Sends nothing."
      },
      {
        "prompt": "Personalise the RFP invitation for Helix: mention our call last week.",
        "expectedBehavior": "Reads the default with read_exchange_email_default, prepares the batch with prepare_exchange_email and an override for that supplier's exchange, shows the text for review and tells the user to confirm the send in the app or the TrialAgents review. Never sends and never shows a link."
      },
      {
        "prompt": "Map the accepted Northlake proposal file into the bid grid and tell me what differs from our assumptions.",
        "expectedBehavior": "Confirms the file was accepted as an AI-readable document, reads it with read_document_text, and proposes croselection.proposal_lines for the proposal (grid categories, amounts, currency, deviation text) with prepare_change for the user's review; summarises deviations such as fewer monitoring visits. Does not read unaccepted uploads."
      },
      {
        "prompt": "Draft an answer to Ben's question about the central laboratory and make it a clarification for everyone.",
        "expectedBehavior": "Reads the thread with list_exchange_messages, drafts the anonymised question and the answer, and prepares publish_exchange_clarification for the user's confirmation. A person publishes."
      },
      {
        "prompt": "Which CRO should we pick?",
        "expectedBehavior": "Summarises accepted proposals, weighted scores, mandatory failures, deviations and qualification status with their sources and gaps, and may draft decision notes. Does not choose the winner, does not write the award and does not notify suppliers."
      }
    ],
    "tasks": {
      "mode": "optional",
      "whenUseful": "Three optional automations; no automation is a fully supported path and the app never waits for one. (1) Deadline reminders: when sending the invitation, the owner can schedule and pre-approve a reminder in the send review (platform scheduled reminders with the saved text, sent to suppliers whose link is still open); otherwise reminders are prepared for confirmation. (2) Request digest: a TrialAgents email action, daily on a calendar schedule at 08:00 in the owner's timezone while a request is open, to the owner (and only explicitly approved registered members with access); fixed text that points to the Overview; one email per recipient per day. (3) Proposal mapping: research on the user's Claude or ChatGPT runner, triggered by a database change on croselection.proposals (new accepted proposal with document_ids); it proposes croselection.proposal_lines and deviations for review and never accepts, sends or decides.",
      "readRequirements": "croselection.requests, croselection.invitations, croselection.proposals, croselection.proposal_lines and the request's bid-grid template; accepted, AI-readable proposal documents only.",
      "outputContract": "Reviewed croselection.proposal_lines (dedup key: proposal_id + category + description) with deviation text; no other table. No output when nothing new was accepted (no_update).",
      "promptExample": "For each accepted proposal in CRO Selection that has document_ids and no proposal lines, read the accepted AI-readable file, map its prices to the cost categories of the request's bid grid in the proposal's currency, note every deviation from the sponsor assumptions in the deviation field, and propose the lines for review. Skip files that are not AI-readable and report them. Do not accept, send, publish or decide anything. Without an automation, ask the assistant the same in chat, or enter lines by hand in Proposals."
    }
  }

 if(proposal){const changes=proposal;proposal=null;if(confirm('FICTIONAL LOCAL REVIEW ONLY\n'+JSON.stringify(changes,null,2).slice(0,3000))){if(changes.some(c=>c.kind==='update_record'&&!rows.some(r=>r.id===c.recordId&&r.version===c.expectedVersion))){alert('Stale review: a record changed since the form opened.');return;}for(const c of changes){if(c.kind==='create_record')rows.push({role:c.typeId,id:'00000000-0000-4000-9000-'+String(next++).padStart(12,'0'),version:0,data:c.data});else{const r=rows.find(r=>r.id===c.recordId);r.data={...r.data,...c.data};r.version++;}}dispatch({kind:'open',action:''});}}
}
function eventFor(kind,target){const trigger=target.closest('[data-action]');if(!trigger)return;const form=trigger.closest('form');dispatch({kind,action:trigger.dataset.action,value:target.type==='checkbox'?target.checked:target.value??null,form:form?Object.fromEntries(new FormData(form)):{}});}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled&&b.type!=='submit'&&!b.dataset.trialyDocument)eventFor('click',b);});
document.addEventListener('submit',e=>{e.preventDefault();eventFor('submit',e.target);});
document.addEventListener('change',e=>eventFor('change',e.target));
dispatch({kind:'open',action:''});
</script></body></html>
