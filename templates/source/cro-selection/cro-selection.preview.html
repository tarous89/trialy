rsor:default}.k-nav{display:flex;gap:4px;border-bottom:1px solid var(--k-line);overflow-x:auto;scrollbar-width:thin;margin:0 0 16px}.k-nav button{border:0;background:none;min-height:44px;padding:0 12px;white-space:nowrap;color:var(--k-muted);font-weight:650;border-bottom:3px solid transparent;cursor:pointer}.k-nav button[aria-current=page]{color:var(--k-accent);border-bottom-color:var(--k-accent)}.k-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px}.k-layout>div{min-width:0}.k-layout>.k-nav{flex-direction:column;border:0;margin:0}.k-layout>.k-nav button{text-align:left;border-bottom:0;border-left:3px solid transparent}.k-layout>.k-nav button[aria-current=page]{border-left-color:var(--k-accent)}.k-table-wrap{overflow-x:auto;background:var(--k-paper);border:1px solid var(--k-line);border-radius:var(--k-radius)}.k-table{border-collapse:collapse;width:100%}.k-table th{font-size:12px;color:var(--k-muted);text-align:left;font-weight:650;padding:10px 12px;border-bottom:1px solid var(--k-line);background:#fbfcfb}.k-table td{padding:10px 12px;border-bottom:1px solid var(--k-line);vertical-align:top;overflow-wrap:anywhere}.k-table tr:last-child td{border-bottom:0}.k-cell{width:100%;min-width:90px;min-height:36px;border:1px solid transparent;border-radius:6px;background:transparent;padding:4px 6px}.k-cell:focus{border-color:var(--k-line);background:var(--k-paper)}.k-cell[data-trialy-saving]{background:var(--k-soft)}.k-cell[aria-invalid=true]{background:var(--k-danger-soft);border-color:var(--k-danger)}.k-pill{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--k-soft);font-size:12px;font-weight:650}.k-empty{text-align:center;padding:36px 16px;background:var(--k-paper);border:1px dashed var(--k-line);border-radius:var(--k-radius)}.k-empty h3{margin:0 0 6px}.k-pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:13px;color:var(--k-muted)}.k-panel{position:fixed;inset:0 0 0 auto;width:min(440px lumns:minmax(90px,40%) 1fr;gap:8px;border:0;padding:6px 12px}.k-table td::before{content:attr(data-label);font-size:12px;color:var(--k-muted);font-weight:650} .k-panel{width:100%;border-left:0} .k-board{grid-auto-flow:row;grid-auto-columns:auto}}}/* CRO Selection 3.0.0: only what the kit does not cover (G10). Every colour is a kit token. */

const source="const kit=(()=>{'use strict';\n const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'})[c]);\n const attr=(k,v)=>v==null||v===false?'':v===true?' '+k:' '+k+'=\"'+esc(v)+'\"';\n const button=(label,action,o={})=>'<button type=\"button\" class=\"k-button'+(o.primary?' k-button--primary':'')+'\"'+attr('data-action',action)+attr('disabled',!!o.disabled)+attr('aria-label',o.ariaLabel)+'>'+esc(label)+'</button>';\n /** Screens: tabs on top, or a side list with side:true; both fold into a scrolling row on narrow screens. */\n const nav=(items,current,o={})=>'<nav class=\"k-nav\" aria-label=\"'+esc(o.label||'Screens')+'\">'+items.map(i=>'<button type=\"button\"'+attr('data-action',(o.prefix||'nav:')+i.id)+(i.id===current?' aria-current=\"page\"':'')+'>'+esc(i.label)+'</button>').join('')+'</nav>';\n const layout=(navHtml,body,o={})=>o.side?'<div class=\"k-layout\">'+navHtml+'<div>'+body+'</div></div>':navHtml+body;\n const page=body=>'<div class=\"k-app\"><main class=\"k-main\">'+body+'</main></div>';\n /** One editable value. Saving is the app's: handle the change event whose action starts with \"edit:\". */\n const cell=(c)=>{const action='edit:'+c.recordId+':'+c.field+(c.version!=null?':'+c.version:''),label=c.label||c.field,v=c.value;\n  if(c.readOnly)return '<span>'+esc(Array.isArray(v)?v.join(', '):v??'—')+'</span>';\n  if(c.kind==='select')return '<select class=\"k-cell\"'+attr('data-action',action)+attr('aria-label',label)+'><option value=\"\">—</option>'+(c.options||[]).map(o=>'<option'+attr('selected',o===v)+'>'+esc(o)+'</option>').join('')+'</select>';\n  if(c.kind==='boolean')return '<input type=\"checkbox\" class=\"k-cell\"'+attr('data-action',action)+attr('aria-label',label)+attr('checked',v===true)+'>';\n  const type=c.kind==='number'||c.kind==='money'?'number':c.kind==='date'?'date':'text';\n  return '<input class=\"k-cell\" type=\"'+type+'\"'+(type==='number'?' step=\"any\"':'')+attr('value',v??'')+attr('data-action',action)+attr('aria-label',label)+'>';};\n /** Reads an \"edit:\" event back: the record, field, version and typed value. */\n const edit=(event,kinds={})=>{const m=/^edit:([^:]+):([a-z][a-z0-9_]*)(?::(\\d+))?$/.exec(event&&event.action||'');if(!m)return null;let value=event.value;const kind=kinds[m[2]];\n  if(kind==='number'||kind==='money')value=value===''||value==null?null:Number(value);if(kind==='boolean')value=value===true||value==='true';if(value==='')value=null;\n  return {recordId:m[1],field:m[2],version:m[3]==null?null:Number(m[3]),value};};\n /** A table that becomes cards on narrow screens. Column render(row) returns HTML; edit:{kind,options} makes it an inline cell. */\n const table=(o)=>{if(!o.rows.length)return o.empty||empty({title:'Nothing here yet'});\n  return '<div class=\"k-table-wrap\"><table class=\"k-table\"><thead><tr>'+o.columns.map(c=>'<th scope=\"col\">'+esc(c.label)+'</th>').join('')+'</tr></thead><tbody>'+o.rows.map(r=>'<tr>'+o.columns.map(c=>'<td'+attr('data-label',c.label)+'>'+(c.render?c.render(r):c.edit?cell({recordId:r.id,version:r.version,field:c.key,label:c.label,value:r.data?r.data[c.key]:r[c.key],...c.edit}):esc((r.data?r.data[c.key]:r[c.key])??'—'))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';};\n const empty=(o)=>'<div class=\"k-empty\"><h3>'+esc(o.title)+'</h3>'+(o.text?'<p class=\"k-muted\">'+esc(o.text)+'</p>':'')+(o.action?button(o.action.label,o.action.action,{primary:true}):'')+'</div>';\n const pager=(o)=>{const from=o.total?o.offset+1:0,to=Math.min(o.offset+o.limit,o.total??o.offset+o.limit);return '<div class=\"k-pager\"><span>'+from+'–'+to+(o.total!=null?' of '+o.total:'')+'</span>'+button('Previous',(o.action||'page')+':'+Math.max(0,o.offset-o.limit),{disabled:o.offset<=0})+button('Next',(o.action||'page')+':'+(o.offset+o.limit),{disabled:o.total!=null&&o.offset+o.limit>=o.total})+'</div>';};\n /** A side panel for creating a record or editing many fields; it fills t ;const metadata={
  "id": "life.cro-selection",
  "version": "3.0.0",
  "name": "CRO Selection",
  "description": "Choose CROs, CDMOs and labs, from the need to a signed award and a clean handover. Quick quote or full selection: longlist, optional RFI, RFP through private supplier links (no supplier accounts), questions and clarifications, a normalised bid grid with deviations, blind weighted scoring, qualification, bid defence, a recorded decision with notices to every supplier, onboarding and an award that other apps can read.",
  "tags": [
    "biotech",
    "cro",
    "cdmo",
    "vendor selection",
    "rfp",
    "rfi",
    "quote",
    "outsourcing",
    "procurement"
  ],
  "whenToUse": "A small biotech chooses a CRO, CDMO or lab: define the need, invite suppliers, answer questions, compare proposals, score, decide, notify and hand over. Use it for quick quotes (many small preclinical or CMC requests, 2 to 5 suppliers) and for full selections (a few large clinical selections with RFI, RFP, bid defence and onboarding).",
  "whenNotToUse": "Purchasing and payments (purchase orders, invoices), contract drafting or e-signature (use Contracts for the register), vendor performance during studies (CRO Oversight), supplier marketplaces or supplier portals with accounts, auctions, negotiation workflows, or responding to RFPs as a CRO (CRO RFP Management).",
  "engine": "frontend-js",
  "upgradeFrom": [
    "2.1.0",
    "2.1.1"
  ],
  "defaults": {
    "tableMap": "{}",
    "pageSize": 25,
    "layoutProfile": "{}",
    "readOnly": false,
    "asOfOverride": ""
  },
  "options": {
    "tableMap": {
      "type": "string",
      "description": "JSON object keyed by stable role key: core data contract v1 roles organizations (required) and people, programs, studies, agreements (optional; agreements binds the core fields only); app roles croselection.settings, croselection.requests, croselection.invitations, croselection.proposals, croselection.proposal_lines, croselection.criteria, croselection.scores, croselection.checklist_items and the published output croselection.awards (contract croselection.v1). Each value is {typeId:<authorized table UUID>, fields:{<logical key>:<real field key>}, writableFields:[<logical keys>]}. Real keys are lowercase snake_case. The installer writes it; never invent table IDs.",
      "default": "{}"
    },
    "pageSize": {
      "type": "number",
      "description": "Rows per page in the requests and vendor tables (10 to 50).",
      "default": 25
    },
    "layoutProfile": {
      "type": "string",
      "description": "Stringified layout profile (screens, columns of the requests and vendors tables, form field order, hidden fields, labels and defaults) written by an approved layout.save change. Do not edit by hand.",
      "default": "{}"
    },
    "readOnly": {
      "type": "boolean",
      "description": "Disable every write control in this copy.",
      "default": false
    },
    "asOfOverride": {
      "type": "string",
      "description": "Pinned as-of date YYYY-MM-DD for previews and tests. Leave empty in real apps: the app uses today's date.",
      "default": ""
    }
  },
  "instructions": "CRO Selection 3.0.0 is a frontend-js app on the v2 app contract and the TrialAgents kit for choosing CROs, CDMOs and labs, from the need to a signed award and a clean handover. It is a new major version of 2.1.1 with the same tables, fields, app commands and output contract, so an installed 2.1.0 or 2.1.1 copy can be upgraded by its owner without losing data (upgradeFrom). Read read_app_template_guidance (guide and reference, every nextOffset) before preparing it, and pin life.cro-selection 3.0.0 with its digest. Do not add a login, accounts, a supplier portal, email sending code or file storage: suppliers answer through the platform exchange only.\nINSTALL. Check list_archived_items (kind apps, templateId life.cro-selection) and offer to restore an archived app first. Use installs the app with empty tables. The Use existing data? dialog connects an existing organizations, people, programs, studies or agreements table by default (core.v1; reuse, never copy); everything else gets new croselection.* tables. Assistants may propose choices with prepare_data_access and never confirm them. No records are seeded: every empty screen offers its first action (a new quick quote or full selection, the first vendor, the round, the criteria set). Questions, cost categories, criteria and checklists start from built-in defaults per service type; questions and cost categories are copied onto each request, where people edit them.\nSCREENS. A side navigation (tabs on narrow screens) under the platform header: Overview (what is waiting on us, what is due, requests by stage on a drag-and-drop board, recent awards), Requests (all requests, the request journey with its next step, values edited in place, request pack and leadership summary), Vendors (directory edited in place, longlist and shortlist with live supplier status, links and the invitation send), Messages (private threads and clarifications), Proposals (baseline, bid grid of the latest accepted proposals with deviations, submissions and files to accept), Evaluation (criteria with weights edited in place, reviewer scorecards, qualification and bid defence checklists with status edited in place), Decision (the award, notices to every supplier, onboarding, handoff), Emails (invitation text per request kind, workspace invitation default, decision notice texts) and Settings (owners only: default currency, question-deadline default, confidentiality text, blind scoring). The request a person works on is their working context: it is kept across screens and visits. Messages come from the platform (one at a time); after a save the app offers Undo for the person's last action. Data still loading shows as loading; partial reads disable totals, scores and \"nothing waiting\" answers and say so.\nSAVING. Record edits save directly (records.save) from the person's own click, edit or form, with the record version captured when editing started; a value edited where it is shown saves at once and comes back with a message if someone changed it first. Side panels are used only to add a record or edit many fields. Moving a request card on the Overview board changes its stage with the same rules as the stage buttons. Archive (requests, vendors and other records) archives the record; nothing is removed. Nothing is written while the app opens.\nEXCHANGE (all supplier communication; the one confirmation when something goes out stays). The app calls tools.call('exchange.*'), one per click or submit. One exchange group per round (exchange.createGroup with appRef request:<request id>:rfi|rfp): RFI and RFP are separate groups, each with its brief (scope, assumptions, bid-grid categories, numbered questions), request pack (exchange.shareDocuments with platform documents), response form on croselection.proposals, confidentiality gate and the invitation text of its request kind (rfi, rfp or quick_quote); other email types use the platform defaults. One exchange per supplier, bound to its croselection.invitations record (exchange.invite with recordId). Creating the round and the links, and sharing documents before anyone outside has seen the round, are applied on the person's click. The invitation is shown exactly as it will be sent (exchange.prepareEmail) and one confirmation sends it (exchange.sendEmail) and marks the suppliers invited in the same transaction. Signed CDA: slot signed_cda; gate signed_document when the request has the CDA gate on; accepting the signed CDA (exchange.acceptFile) marks it signed with the same confirmation. Submissions: only the latest version per supplier is shown; exchange.acceptSubmission with target new creates the croselection.proposals record and marks the supplier submitted with one confirmation. Messages: exchange.reply (private) and exchange.publishClarification (anonymised). Decision notices: exchange.replyAll, one private message per supplier with the winner text or the text for the others (with the debrief offer), confirmed together with the decision when the person keeps the notices ticked. Status per supplier comes from exchange.list and exchange.status; no exchange IDs or links are stored in records. Deadline: exchange expiry = response deadline; exchange.extend; exchange.revoke stops a link and keeps what was received.\nASSISTANTS (Claude and ChatGPT, each through its own connection, limited by the user's access and the access given to that assistant). Use list_app_commands and run_app_command: every record action a person can click is an app command that runs the app's own handler with the same checks; with Data level Edit its record changes save directly (saved.rows), with View only they are refused. Read commands return the app's own figures (overview.read, request.read, grid.read, evaluation.read, decision.read): report them, do not recompute totals, deviations or scores. Start with schema.describe for forms, fields (including additional fields), options, stages, settings and layout keys. Commands: record.save (add or edit a request, vendor, contact, invitation, proposal received another way, line, criterion or checklist item; same form validation), record.archive, request.stage, longlist.add, invitation.status (shortlist, finalist, declined, not selected), cda.record_elsewhere, cda.file_agreement, lines.save (map an accepted, AI-readable bid into the grid), criteria.apply_defaults, checklist.apply_defaults, checklist.set_status, scores.save (only scores the named reviewer gave), decision.record, award.save, onboarding.update, handoff.prepare, award.link_agreement, settings.save, invitation_text.save, invitation_text.reset, layout.save (an app change the owner approves). Use a stable requestKey per command. AWARD. Awarding a CRO is initiated by the user: on the Decision screen (Record the decision), or by asking their assistant, which then runs decision.record with the supplier, rationale, approver and date the user gives (and an override reason when qualification has an open issue). It creates the croselection.awards record, marks that supplier selected and the others not selected and moves the stage. Never award on your own initiative or pick the winner yourself; you may summarise the evidence and draft the rationale. ONLY A PERSON, IN THE APP: everything that reaches suppliers or comes in from them — creating rounds and links, sharing documents, sending invitation and reminder emails, private replies, clarifications, accepting submissions and files, extending or stopping links, and the decision notices (Notify all). Commands refuse these. You may prepare drafts: email personalisation with prepare_exchange_email (the person confirms the send), replies and clarifications with prepare_workspace_change reply_exchange or publish_exchange_clarification (a person confirms). You may read accepted proposals, messages and clarifications the user can read (list_exchanges, list_exchange_submissions, list_exchange_messages, read_exchange_email_default, list_exchange_emails). You never read unaccepted uploads or their values, and you never handle, repeat or ask for recipient links. No legal or purchasing advice.\nHANDOFF. handoff.prepare (or Prepare the handoff in the app) writes a draft agreement into the shared agreements table (core fields only; complete it in Contracts) and stores the prepared Programs milestones as JSON in croselection.awards.handoff_status. CRO Selection never writes another app's own tables. Runway reads croselection.awards itself (Plan → From other sources → Add to plan, with source tracking): never add Runway plan lines from an award, because they would bypass that tracking and could count the cost twice. When Programs is in the workspace and the user asks, add the prepared milestones in programs.plan_items (name, program_id, item_type milestone, end_date, status planned, is_key). With none of these apps the award simply stays; nothing errors.\nCALCULATIONS. Proposal total = sum of its lines in one currency, or the stated total without lines; other currencies are listed, never converted. Deviation per category = proposal amount minus sponsor baseline, and percent of the baseline. Weighted score = sum(mean reviewer score x weight) / 100 on a 1 to 5 scale; a mandatory criterion with a mean below 3 fails; spread = max minus min per criterion; no score is inferred for an unscored criterion. Blind scoring hides prices in Evaluation until every reviewer has scored every scored supplier on every criterion, or a person reveals them for the session. Latest proposal = highest accepted version per invitation and round. A qualification issue blocks the decision unless an override reason is given.\nCUSTOMIZE (everything within the app's scope; IDs, bindings, access and records are kept). Layout (layout.save, an app change the owner approves): screen order and visibility, the columns of the requests and vendors tables, and every form (groups request_form, vendor_form, contact_form, invitation_form, proposal_form, line_form, criterion_form, checklist_form): field order, hidden fields, labels and defaults; required fields cannot be hidden and defaults are validated like typed input. Screens keep their names. Settings (settings.save, owners): default currency, blind scoring, question-deadline default, confidentiality text and decision notice texts; stage names saved earlier keep showing. Invitation texts per request kind: invitation_text.save. A workspace email default is saved in the platform exchange by a person (exchange.saveDefaultEmail) and replaces the app text for that email type. New fields on request: add the field to the table with a reviewed schema change, then in one app revision (begin_app_update, finalize_app_preview once) add it to this app's table map entry for that role as extraFields [{key, label, kind text|longtext|number|money|date|select|boolean, options}] and writableExtra [key], and to the bindings and manifest fields. It then appears in that form and in details and record.save accepts it. Additional fields are never used in calculations. Code changes keep the v2 contract ('use trialagents v2' on the first line, the kit, records.save, no own header or banners), role keys, the croselection.awards output contract croselection.v1 and its writer, the calculation rules, the exchange rules (one exchange call per click, no links in records), every command id with its handler parity, and per-screen reads. Access is managed on the platform's Access page (platform:access); sending needs \"Send to people outside the workspace\". CRO Selection declares no automations; supplier reminders are approved in the send review.",
  "documentation": {
    "quickStart": [
      "Read the guide and the reference (every nextOffset) and this documentation; pin life.cro-selection 3.0.0 and its digest with one requestKey. An installed 2.1.0 or 2.1.1 copy is upgraded by its owner; its records stay.",
      "Check for an archived CRO Selection app and offer to restore it. Otherwise Use installs it; keep the defaults that connect existing organizations, people, programs, studies and agreements tables.",
      "Owners: open Settings for the default currency, question-deadline default, confidentiality text and blind scoring (off by default). Emails holds the invitation texts and the decision notices.",
      "Requests: start a quick quote or a full selection with scope, sponsor assumptions and baseline by cost category, deadlines and CDA option; the built-in questions and cost categories are copied onto the request to edit. Deadlines, budget and owner are edited where they are shown.",
      "Vendors: add vendors and contacts, build the longlist, create the round (brief, request pack, CDA) and the links, then check the invitation emails and confirm the send once.",
      "Messages: reply privately or publish anonymised clarifications. Proposals: accept submissions and files, map bids into the grid, review deviations.",
      "Evaluation: apply criteria, score blind per reviewer, complete qualification and the bid defence. Decision: record the decision (yourself, or ask your assistant), notify every supplier, complete onboarding, prepare the handoff and close the request.",
      "Assistants: list_app_commands, then schema.describe; every record action is a command that saves directly with Data level Edit. Customise screens, columns and forms with layout.save (the owner approves), settings with settings.save, and add fields on request (extraFields)."
    ],
    "dataContract": "Stable role keys; every field scalar (multiple false), lowercase snake_case, relationships by record ID in text fields. Core data contract v1: organizations (name*, org_type cro/cdmo/other for vendors, country, website, archived), people (optional: name*, organization_id, title, email, archived), programs (optional), studies (optional), agreements (optional; core fields only: name*, counterparty_id, agreement_type, status, effective_date, expiry_date, archived; Contracts-owned fields are not bound). App tables, contract croselection.v1: croselection.settings (one row: default_currency, blind_scoring default false, question_deadline_days default 7, confidentiality_text, decision_texts JSON {winner, others}, invitation_texts JSON {rfi|rfp|quick_quote:{subject, body}}, preferences JSON {stage_labels:{<stage>:<name>}, opening_screen} (kept from 2.x; 3.0.0 shows the stage names and no longer uses the opening screen)); croselection.requests (name*, mode* quick_quote/full_selection, service_type*, program_id, study_id, scope*, assumptions JSON {notes, baseline:[{category, amount}]}, budget_estimate money, currency*, stage*, cda_option* send_pdf/contracts/skip/none, cda_gate, question_deadline, response_deadline*, decision_due, owner, rfi_questions, questions, cost_categories (one per line), archived); croselection.invitations (request_id*, organization_id*, contact_ids, recipient_emails*, status* longlist/rfi_invited/shortlisted/rfp_invited/declined/submitted/finalist/not_selected/selected, cda_status not_needed/sent/signed/in_place_elsewhere, cda_in_place_on, cda_agreement_id, notes); croselection.proposals (invitation_id, round rfi/rfp/quote, version, submitted_on, source exchange/manual/assistant_mapped, total money, pass_through money, currency, start_weeks, duration_months, answers, assumptions_delta, document_ids, accepted_on, notes); croselection.proposal_lines (proposal_id*, category*, description, units, unit_cost money, amount* money, currency*, deviation); croselection.criteria (request_id*, name*, category, weight*, mandatory); croselection.scores (request_id*, invitation_id*, criterion_id*, reviewer*, score* 1 to 5, evidence); croselection.checklist_items (request_id*, invitation_id, scope* qualification/bid_defence/onboarding, item*, owner, due, status* open/done/not_applicable/issue, evidence_document_id, notes); croselection.awards (published output, writer life.cro-selection: request_id*, organization_id*, service_type*, program_id, study_id, total money, currency*, start_date, duration_months, rationale*, approver*, decided_on*, delivery_team, agreement_id, onboarding_status in_progress/complete, handoff_status JSON). * = required. croselection.proposals is also the response table of every exchange group; because the platform requires each database-required field of a response table to be a question for the supplier, invitation_id, round, version, submitted_on, source and currency are set and checked by the app at acceptance instead of being database-required. Rounds, links, messages, clarifications, shared and returned documents, email batches and access events stay in the platform exchange: rounds are found by appRef, links by the invitation they are bound to; no exchange IDs or links are stored in records. Money is stored with an explicit currency and never converted. No patient data. No seed data. Additional fields: a role's table-map entry may declare extraFields [{key, label, kind text|longtext|number|money|date|select|boolean, options}] and writableExtra [keys] for fields added to the table by a reviewed schema change; they show in forms and details and are saved by record.save, never used in calculations. Other bound fields that are not declared show read-only.",
    "interactionContract": "Nine screens with stable IDs: overview, requests, vendors, messages, proposals, evaluation, decision, emails, settings (settings only for the app’s owners). The app draws no header of its own: the platform header shows the app name and status, and messages are the platform’s (output.notice). A side navigation (a scrolling row on narrow screens) switches screens without a request; the request picker sets the working context (output.context requestId), kept across screens and visits; full selections switch between the RFI and RFP round. Overview: what is waiting on us (unread messages, unanswered questions, submissions and files to accept), decisions and onboarding items due, requests by stage on a board (drag a card, or use its menu, to move the request’s stage), recent awards. Requests: all requests (columns from the layout), the journey with the next step and stage buttons, budget, deadlines and owner edited in place, documents out (request pack shared from platform documents), summary for leadership. Vendors: directory with name, type and country edited in place and history per vendor, longlist and shortlist with live status per supplier, create links, the invitation emails shown exactly as they will be sent (batch text, per-supplier personalisation, display name, optional scheduled reminder) and one confirmation that also marks the suppliers invited, email log, supplier details with extend, stop link and CDA options. Messages: private threads, clarifications and addenda, question deadline with the unanswered list. Proposals: sponsor baseline, bid grid of the latest accepted proposals with deviations, other currencies listed, realism check, Ask from a cell, the latest submission per supplier and files to accept, proposals received another way and their lines (amounts edited in place). Evaluation: weighted criteria (weight and mandatory edited in place), reviewer scorecards (prices hidden only when blind scoring is on), qualification and bid defence checklists (status, owner and due date edited in place). Decision: the award (start date edited in place), Notify all, onboarding checklist with the award agreement’s status, handoff. Emails: invitation text per request kind, workspace invitation default, decision notices. Settings: default currency, question-deadline default, confidentiality text, blind scoring. Inline edits send edit:<record>:<field>:<version>; forms keep their drafts after a refused save; record versions are captured when a form or panel opens. Every empty screen offers its first action. After a save the app offers Undo for the person’s last action (undo.list, undo.run). Layout groups for layout.save: column groups requests and vendors, and form groups request_form, vendor_form, contact_form, invitation_form, proposal_form, line_form, criterion_form, checklist_form (order, hidden, labels, defaults). App commands replay the same events through one handler, so a command and a click save the same changes: Edit/Add/Save in any form = record.save; Archive = record.archive; Move to / Back to / Close request and the board = request.stage; Add a vendor to the list = longlist.add; Shortlist / Finalist / Not a finalist / Decline / Restore = invitation.status; CDA in place elsewhere = cda.record_elsewhere; File the signed CDA as an agreement = cda.file_agreement; Lines of a proposal = lines.save; Apply the criteria set = criteria.apply_defaults; Apply the checklist = checklist.apply_defaults; checklist status = checklist.set_status; Save scores = scores.save (one reviewer); Save the decision = decision.record (without notices); Edit award details = award.save; Start / complete onboarding = onboarding.update; Prepare the handoff = handoff.prepare; Link it to the award = award.link_agreement; Save settings and decision notices = settings.save; Save for a request kind / Use the built-in text = invitation_text.save / invitation_text.reset. Read: overview.read, request.read (with the summary for leadership), grid.read, evaluation.read, decision.read. Not commands, by design: every exchange action (round, links, documents, emails, replies, clarifications, acceptances, extend, stop, Notify all), the per-session price reveal, Undo and uploads.",
    "lifecycle": "A new preview shows empty data, never writes and never contacts anyone; exchange and document capabilities need the saved app. Each screen reads only its own tables in one batch; screen changes, filters and the request picker run in the browser without a request when the platform allows it. Record writes are records.save (at most 50 per action) from a person’s own click, edit or form, saved directly with the platform’s checks; a value someone else changed first is not saved and comes back with a message. Exchange writes are one per click: preparation nobody outside has seen is applied on the person’s click; sends, notices, replies, clarifications, acceptances and revocations get the one confirmation, which also carries the record changes of the same click (status, stage, award) and commits them in the same transaction. Layout changes are app changes the owner approves. App commands run the saved app as the assistant, with its access and column restrictions; with Data level Edit their record changes save directly. Archive first: deleting the app archives it, which stops every supplier link; restoring it re-enables the links that have not expired. Removing a tab unbinds; fields and tables are archived, never removed. 3.0.0 keeps the installer schema, commands and outputs of 2.1.x, so the owner’s upgrade carries records, connections and settings across; 1.0.1 and 2.0.0 apps keep working.",
    "limitations": [
      "No supplier accounts or portal, no purchasing, purchase orders, invoices or payments, no e-signature (a signed PDF is uploaded back), no auctions or negotiation workflow, and no automatic award decision: the user decides, in the app or through their assistant, and approves the review.",
      "Supplier pages, emails, messages and files are the platform exchange; this app cannot change their design, send attachments or track opens of emails. Deadlines are 1 to 90 days; up to 10 files of 25 MB per submission.",
      "Questions are sent as a numbered list in the brief and answered in one Answers field; prices are entered as total, pass-through, currency, start and duration. Line items per cost category come from mapping the bid file (by the person, or by the assistant with lines.save).",
      "One exchange call per click: creating the round and the links are separate clicks; sending is one confirmation.",
      "Currencies are never converted: bids in another currency are listed but not compared with the baseline.",
      "The price reveal in Evaluation is a per-session view choice, not a saved permission. Proposals and prices are otherwise protected by app and table access only.",
      "The app detects Contracts only through the shared agreements table; an agreement's status is changed in Contracts. Runway reads awards itself (Add to plan in Runway); Programs milestones are prepared on the award and proposed in Programs by the user's assistant or entered there by hand.",
      "App commands cannot reach suppliers: every exchange action stays a person's click in the app. Screens keep their names (order and visibility can change). Additional fields show in forms and details but are not used in calculations, filters or the bid grid.",
      "A proposal line, criterion, score or checklist item cannot be deleted from the app; set an amount or weight to 0, or mark an item not applicable. Built-in defaults are not a template library: edit questions and cost categories on each request.",
      "The vendor directory lists organizations of type cro, cdmo and other (labs), because the core contract has no lab type.",
      "Not legal or purchasing advice. No patient data.",
      "Undo covers the person’s own record changes in the open app for 60 minutes; sends and other exchange actions have no Undo."
    ],
    "examples": [
      {
        "prompt": "We need a quote for a 28-day GLP tox study in rats. Set up a quick quote for three labs, due in two weeks.",
        "expectedBehavior": "Runs schema.describe, then record.save for one request (mode quick_quote, service preclinical_study, scope, assumptions with a baseline per cost category, response deadline) and, when asked, longlist.add for the named vendors, each with a stable requestKey; reports what was saved. Explains that the round, links and invitation email are created and confirmed by the user in Vendors. Sends nothing."
      },
      {
        "prompt": "Personalise the RFP invitation for Helix: mention our call last week.",
        "expectedBehavior": "Reads the default with read_exchange_email_default, prepares the batch with prepare_exchange_email and an override for that supplier's exchange, shows the text for review and tells the user to confirm the send in the app or the TrialAgents review. Never sends and never shows a link."
      },
      {
        "prompt": "Map the accepted Northlake proposal file into the bid grid and tell me what differs from our assumptions.",
        "expectedBehavior": "Confirms the file was accepted as an AI-readable document, reads it with read_document_text, and runs lines.save for that proposal (grid categories, amounts, currency, deviation text); then reports the deviations from grid.read. Does not read unaccepted uploads."
      },
      {
        "prompt": "Add a field \"Years in oncology\" to our vendors and hide the country column.",
        "expectedBehavior": "Prepares the schema change adding the number field to the organizations table, then one app revision declaring it in the table map (extraFields, writableExtra, bindings, manifest) so it shows in the vendor form and details; runs layout.save hiding vendors:country. The schema change and the app changes wait for the user’s approval; other apps are unaffected."
      },
      {
        "prompt": "Which CRO should we pick? We'll go with Helix — award it, approved by our CEO today.",
        "expectedBehavior": "Summarises grid.read, evaluation.read and decision.read (weighted scores, mandatory fails, deviations, qualification) with gaps, without choosing. When the user names Helix, drafts the rationale for the user to confirm, then runs decision.record with that supplier, the rationale, approver and today’s date (an override reason only if the user gives one for an open qualification issue) once the user agrees, and tells the user to send the notices with Notify all on the Decision screen."
      }
    ],
    "tasks": {
      "mode": "none",
      "whenUseful": "CRO Selection declares no automations and needs none (owner decision, 15 November 2026). Overview shows what is waiting on us and what is due; supplier reminders are approved by the owner in the send review and sent by the platform exchange at the chosen date; bid mapping is done on request by the user’s assistant (lines.save) or by hand in Proposals.",
      "readRequirements": "None.",
      "outputContract": "None: no automation output.",
      "promptExample": "What is waiting on us in CRO Selection, and which proposals still need lines in the bid grid?"
    }
  }
