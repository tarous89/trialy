    "dataContract": "Seven persistent role tables with stable UUID relationships: projects, experiments(projectId,protocolId), protocols(versionLabel), observations(experimentId), measurements(experimentId,analyte,condition,timePoint,replicate,value,unit,control,sourceRef), interpretations(experimentId), reports(projectId). No external or human subject information. Demo data is wholly local and fictional. Each role requires a real bound typeId and approved table-level manifest; logical camelCase keys map to actual snake_case column keys. No copied protocol text retroactively overwrites old source. Raw laboratory files are *references* only, not stored or uploaded by frontend-js. Fetch each role in <=7 pages of <=100 records; suppress derived metrics on partial/denied result, never count a single page as total. Archive sets authorized archived:true with reviewed update; not hard deletion. Fields remain scalar except explicit text lists in batch references. Optional project segregation requires backend permissions; custom screens have app-level access only. All fields are scalar multiple:false. Optional empty values are null; required fields cannot be empty. Physical keys and exact select options are specified in the role schemas below. Relation text stores saved record UUIDs, not labels or arrays. Create parents first and substitute committed receipt IDs. Table map is a JSON string keyed by role: {typeId:actual UUID,fields:{logicalName:physical_key},writableFields:[authorized logical names]}. Bind all readable physical keys and manifest fields with current schemaVersion/kind/mode. Missing mappings, unknown totals, arrays and truncated reads are incomplete, not zero. Keep different recorded time points in separate descriptive groups even when analyte, unit and condition match.",
