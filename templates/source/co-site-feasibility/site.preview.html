/* v1.1.0 site-first workflow redesign: product patterns from Veeva Study Startup and Oracle Site Select, original TrialAgents visuals. */
:root{--sfin:#112f43;--sfdeep:#19384e;--sfink:#172e39;--sfmute:#59717b;--sfborder:#d9e6e7;--sflite:#f5f8fa;--sfforest:#087b58;--sfocean:#236e99;--sfsky:#e9f5f3}
.sf-sidebar{background:linear-gradient(165deg,#152f42,#183e4a 75%,#1a4b4c)}
.sf-sidebar .sf-nav.active{background:#e1f8f121;border-left:3px solid #7bdbc2}
.sf-topbar{height:70px;min-height:70px;letter-spacing:0;padding:0 29px}
.sf-study-context{display:flex;align-items:center;gap:11px;min-width:0}
.sf-study-context>span{font-weight:800;letter-spacing:1.4px;font-size:12px;color:#526c73}
.sf-study-context .sf-scope{display:flex;flex-direction:row;align-items:center;gap:8px;font-size:12px}
.sf-study-context .sf-scope select{min-width:250px;max-width:340px;height:40px;font-size:13px;font-weight:650;border-color:#bed7d4}
.sf-top-pill{background:#eef6f5;color:#526c73;font-size:12px}
.sf-content{max-width:1450px;padding:32px 32px 34px}
.sf-heading{margin-bottom:21px}
.sf-heading h1{font-size:30px;font-weight:780}
.sf-heading p{font-size:14px;line-height:1.55}
.sf-card{border-radius:14px;padding:22px 23px;margin-bottom:18px}
.sf-card-header h2{font-size:17px}
.sf-stat{min-height:110px;padding:19px 21px}
.sf-stat strong{font-size:29px}
.sf-stat span{font-size:12.5px}
.sf-stat small{font-size:12px}
.sf-btn{min-height:38px;font-size:13px}
.sf-table-scroll table{font-size:13px}
.sf-table-scroll th{font-size:12px;padding:13px 14px}
.sf-table-scroll td{font-size:13px;padding:13px 14px}
.sf-table-scroll strong{font-size:13px}
.sf-row-actions .sf-row-link{font-size:12px;min-height:30px}
.sf-mini-insight,.sf-disclaimer,.sf-table-hint{font-size:12px}
.sf-overview-grid .sf-card{min-height:230px}
.sf-journey{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:20px}
.sf-journey-item{min-width:0;position:relative}
