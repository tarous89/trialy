  "instructions": "Programs 3.0.0 is a frontend-js program-management app on the TrialAgents v2 app contract and kit. The shared programs and people tables use the core data contract v1 role keys, app tables use programs.* role keys, features that use another app's data degrade gracefully, and removing an app or tab never deletes data. It replaces Programs 2.2.x for new installs once approved; installed 2.2.0 and 2.2.1 copies have the same tables, helpers, automations and commands and can be upgraded by their owner (upgradeFrom).\n\nClaude and ChatGPT can do everything a person can do in Programs, limited only by the user's access and the access given to that assistant on the Access page. Record changes save directly, exactly as when a person edits a value on screen: there is no review step for records. App changes (layout, code) still need the person's approval.\n\n1. Discover and pin. Read read_app_template_guidance (guide, then reference) to the last nextOffset, read_app_design, list_app_templates and read_app_template for life.project-oversight. Pin this exact version and digest and keep one requestKey for the creation.\n2. Install and reuse. Before installing, call list_archived_items (kind apps, this templateId); if an archived Programs app exists, offer to restore it first. The installation popup shows the shared-data choice: a compatible programs table (for example from Runway) is reused by default; separate data is an explicit choice (for a confidential program, use a separate app with separate data in a restricted project). people and Runway's month closes are connected when present and never created. The included automations are on by default (§9). Never seed demo data.\n3. Screens. Side navigation: Overview (next key milestone, the four numbers that matter, program cards, due soon, what needs attention), Timeline (Gantt by program and function lane, baselines, critical path, what drives a date, key milestones of the selected program, cash at key milestones), Plan (items as a table with values edited in place, or a board by status with drag and drop; Set baseline; Reset baseline), Gates & decisions (upcoming gates with readiness, Record outcome, decisions log), RAID (likelihood × impact matrix, register edited in place, Promote), Updates (monthly updates, leadership report, report archive, weekly digests), Programs (the shared programs list, stage, status and lead edited in place, Assess health), Team (program team by name with notification status, Update owners and reminders), Cash forecast (own months, or Runway's read-only snapshot with Edit in Runway) and, for the app's owners only, Settings (function lanes, stages, due-soon window, update day, reminder lead time, health definitions). The Program picker is the working context: it filters every screen and is remembered for each person (output.context {program}). Messages are the platform's one notice; the app draws no header, banner or footer. Each screen reads only its own tables in one batched read; data still loading shows as loading.\n4. Use app commands, not your own calculations. After the app is saved, call list_app_commands, then run_app_command. Start with schema.describe (forms, fields, options, rules, team, layout groups, working context). Read commands return the app's own results: overview.read, attention.read (what the weekly digest reports), timeline.read (critical path, slips, cash at key milestones), item.drivers, item.impact (slip needed and successors pushed by a date move), gates.read, raid.read, updates.read, report.preview, reports.read, digests.read and team.read. Never compute the critical path, slips, readiness, due-soon, overdue or cash markers yourself; ask the app.\n5. Change things the way a click does; each write command saves directly (with Data level Edit) and returns saved messages. record.save {role, id?, fields} for any form (programs, items, decisions, raid, updates, team, closes, settings), with item.save, program.save, team.save and settings.save (owners only) as shortcuts; record.duplicate; record.archive (archives the record; the person can undo it in the app); baseline.set {program_id}; baseline.reset {item_id, reason}; gate.record {gate_id, outcome, decided_on, approver, rationale, follow_ups[], cancel_item_ids[]}; raid.promote {id, to}; report.save {month, title, narrative}; reminders.refresh; layout.save. A later end date on a baselined planned, in-progress or at-risk item needs slip_reason (scientific, cro_vendor, regulatory, manufacturing, funding, other) and writes exactly one slip; run item.impact first and pass accept_downstream:true only when the user accepts the successor moves. prepare_change on the bound tables still works but skips the app's validation and the slip rule, so prefer commands.\n6. First plan in one session. From a development plan, slide, spreadsheet or description the user shares, save the program (program.save), then plan items by function with owners, dates, item_type and one predecessor each (item.save; create predecessors first), the first gates with criteria lines ([met], [not met] or [open]) and top risks. Add the people who own work to the program team (team.save). To make notifications reach a person, set their workspace member ID on the team member (team.save fields.member_id; look it up with find_identity_candidates or reference_options); people never see or type IDs, the Team screen shows Linked or Name only. Confirm the plan with the user before saving many records, and do not set baselines until the user agrees the plan, then baseline.set.\n7. Human judgements stay human. Never set a program's health or a gate outcome unless the user tells you the judgement; health needs a rationale and the assessment date. Never invent progress in updates or reports.\n8. Values from other apps. When the cash forecast is linked to Runway it is read-only here and labelled as coming from Runway; change it in Runway (the app shows Edit in Runway when the user may open it). Programs' own outputs (key milestones in programs.plan_items, programs.reports) are read by Runway, Contracts, Fundraise and Partnerships.\n9. Customize. Screens, columns and forms: layout.save {screens, order, hide, show, labels, defaults} (screens overview, timeline, plan, decisions, raid, updates, programs, team; form groups item_form, decision_form, raid_form, program_form, update_form, team_form; required fields cannot be hidden). Business settings: settings.save (owners). New fields on request: add the field to the table with a reviewed schema change and, in the same app revision, list it in the tableMap entry's extraFields [{key,label,kind,options?}] and writableExtra, so it appears in the forms at once. New screens, charts, forms or workflows: a reviewed app revision (begin_app_update → finalize_app_preview → the person's approval) that keeps the v2 contract: the stable role keys and core v1 fields, the programs.v2 fields other apps read (plan_items name, program_id, item_type, end_date, status, is_key, archived; reports), the slip rule, the calculations, the app-maintained notification fields (owner_member_id, assigned_on, remind_on, added_on), the declared commands with click parity, records.save from a person's action, notices instead of banners and no own header.\n10. Automations (TrialAgents Automations; the app works fully without any). Included at install, on by default, each can be turned off: (a) Weekly digest: every Monday, Claude or ChatGPT (when connected) writes a short summary of program status and what needs attention from the digest_brief helper, saves it in programs.digests and emails it to the owner; weeks with nothing important save and send nothing; (b–f) notices to linked team members: added to a program team, assigned an item, an item due in the reminder lead time (Settings, default 7 days), assigned a RAID entry, a RAID review due. Without a linked account the notice goes to the automation's recipients (the owner). Available later in Automations → From app features: the weekly digest without AI (same content, deterministic). Recipients are changed by the owner in Automations, or through you with the exact reviewed setup.",

    "dataContract": "Stable role keys. Core data contract v1: programs (name text*, code text, indication text, modality select small_molecule/biologic/antibody/cell_therapy/gene_therapy/rna/vaccine/device/other, stage select* discovery/preclinical/ind_enabling/phase_1/phase_2/phase_3/registration/approved, lead text, status select active/paused/stopped/partnered, archived boolean; Programs-owned optional fields health select unassessed/green/amber/red, health_rationale text, health_date date) and people (name*, organization_id, title, email, archived; optional, read only in Programs; owner fields stay plain text names). App tables: programs.plan_items (name text*, program_id text* record ID of programs, item_type select* milestone/activity, function select* cmc/nonclinical/clinical/regulatory/other, owner text, start_date date, end_date date* (the milestone date for milestones), baseline_start date, baseline_end date, status select* planned/in_progress/done/at_risk/cancelled, predecessor_id text record ID of one plan_items record (finish-to-start, no lag), is_key boolean, notes text, owner_member_id text, assigned_on date, remind_on date, archived boolean); programs.slips (plan_item_id text*, changed_on date*, old_end date*, new_end date*, days number*, reason select* scientific/cro_vendor/regulatory/manufacturing/funding/other, detail text); programs.decisions (name text*, program_id text*, kind select* gate/decision, target_date date, criteria text one per line [met]/[not met]/[open], outcome select pending/go/no_go/conditional/decided, decided_on date, approver text, options text, rationale text, linked_item_id text record ID of a plan item or RAID entry, archived boolean); programs.raid (name text*, program_id text, raid_type select* risk/assumption/issue/dependency, likelihood and impact select low/medium/high, owner text, mitigation text, next_review date, status select* open/monitoring/closed, linked_item_id text, owner_member_id text, assigned_on date, remind_on date, archived boolean); programs.updates (program_id text*, month date* first day, health select*, rationale, summary, next_steps, author text); programs.reports (month date*, title text*, narrative text, contents text frozen JSON written once by the app, saved_on date); programs.settings (one row: functions and stages comma lists of enabled options in display order, health_definitions text, due_soon_days number default 90, update_day number default 5, reminder_days number default 7); programs.team (program_id text*, name text*, member_id text workspace member UUID, role text, added_on date, archived boolean); programs.digests (run_on date*, period text*, summary text*, attention_count number, run_id text, written_by select claude/chatgpt; written only by the weekly digest research, read-only in the app). Notification fields are kept by the app on every save, never typed: owner_member_id = the member ID of the owner's name on the program team; assigned_on = the day that member changed; remind_on = end_date minus reminder_days while planned/in_progress/at_risk (RAID: next_review while not closed), empty otherwise; team added_on = the day a member ID was added. reminders.refresh (Settings → Update owners and reminders) brings them up to date after a team or settings change. Integration runway.month_closes (contract runway.v2): Programs' own cash forecast (month, closing_balance, currency; one closing cash figure per month) until the user links Runway in the app; then Runway's month closes (month, closed, currency, metrics frozen JSON v2), read only. App output for other apps: programs.plan_items with is_key (Runway reads key milestones) and programs.reports. Every field is scalar multiple:false; relationships are record IDs, never names. Slip rule: a later end_date on a planned, in_progress or at_risk item with a baseline creates exactly one slips record in the same review. Health is always a human judgement with a date and rationale; the app never sets it. Access is app-level only: no per-screen protection is advertised. Hiding a program is not security; use a separate app with separate data in a restricted project. Reads are bounded to 800 rows per table; partial reads disable the critical path and totals.",
    "interactionContract": "Screens (side navigation, stable layout IDs): overview, timeline, plan, decisions, raid, updates, programs, team; plus Cash forecast (when the cash forecast table is connected) and Settings (owners only). Column groups items, raid, decisions; form groups item_form, decision_form, raid_form, program_form, update_form, team_form (order, hide optional fields, labels and defaults). The Program picker is the working context (output.context {program}); it filters every screen and is remembered per person. Values shown in tables are edited in place and saved at once with records.save, sending the version shown when editing started (owner, start, end, status and function of plan items; target dates of decisions; likelihood, impact, owner, next review and status of RAID entries; code, stage, status and lead of programs; role of team members; author of updates; closing cash and currency of own cash months). A later end date on a committed, baselined item opens the item with the new date and asks for the slip reason. Plan → Board moves an item's status by drag and drop or the card menu. A side panel creates records and edits many fields. Every button and the records it saves (the same commands for assistants): Add/Edit item → one plan_items create/update with the app-maintained notification fields; a later committed date also creates one slips record (reason required) and, when ticked, updates each pushed successor (and a slip for baselined ones) [item.save]. Duplicate → create without baseline [record.duplicate]. Archive → archive_record; an item that is someone's predecessor cannot be archived [record.archive]. Set baseline → baseline_start/baseline_end = current dates on up to 50 unbaselined items of a program [baseline.set]. Reset baseline → baseline = current dates, reason appended to notes [baseline.reset]. Record outcome → decisions outcome/decided_on/approver/rationale, plus follow-up milestone creates and cancellations in the same save [gate.record]. Promote → new linked RAID entry of the next type, original closed [raid.promote]. Add update → one updates create (one per program and month) [record.save role updates]. Save report → one reports create with frozen contents computed by the app [report.save]. Settings (owners) → one settings create/update [settings.save]. Add team member → one team create; a team member with a linked account is notified [team.save]. Update owners and reminders → updates owner_member_id/assigned_on/remind_on on up to 50 drifted items and RAID entries [reminders.refresh]. Cash forecast month → one month_closes create/update while not linked to Runway; once linked it is read-only with Edit in Runway when allowed. After a save the app offers Undo for the person's own last action. Messages are returned as the platform notice; an invalid value is refused with a notice and the earlier value comes back. Read commands return the same figures as the screens: overview.read, attention.read, timeline.read, item.drivers, item.impact, gates.read, raid.read, updates.read, report.preview, reports.read, digests.read, team.read, schema.describe. Every input carries data-ui-state and a stable data-action; a failed panel save keeps the draft. A command that fails saves nothing.",
    "lifecycle": "A fresh preview renders with no writes, and opening the app never writes. After the app is saved, every create, edit, archive, baseline, slip, gate outcome, promotion and report save from a person's click, change or submit is one records.save of at most 50 changes, saved directly with the platform's checks; the screen is made again from the saved data. Inline edits send the version shown on screen; panels send the version captured when the panel opened; successors moved by an accepted downstream change and milestones cancelled by a gate outcome carry the versions captured when the panel or gate opened, so a concurrent edit is refused, not overwritten. Undo (undo.list, undo.run) reverses the person's own last action while the record is unchanged. Saved reports are frozen; their contents never change after later edits. The as-of date is today's date from the app runtime and only filters the view (due soon, overdue, quarter); slips record changed_on and reports saved_on as that date. Layout changes are presentation-only reviewed app updates; saved configuration is re-read on every render. App commands run the saved version only (unsaved previews are read-only); a stale version is rejected and the same requestKey returns the same result. Archiving or deleting the app archives it and keeps all tables and records; restoring brings its automations back switched off. Removing a tab unbinds it; adding it back reconnects the same tables. Installing again first offers to restore an archived Programs app. Upgrading from 2.2.0 or 2.2.1 keeps every table, record, helper and automation; a 2.2.x layout profile that names the old Settings screen is reset to the default layout.",

      "App-level access only: per-screen restrictions are not advertised for this custom app. Confidential programs need a separate app with separate data in a restricted project.",
