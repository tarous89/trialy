  "instructions": "Programs 2.2.0 is a custom frontend-js program-management app that follows docs/product/MODULAR_APPS_AND_SHARED_DATA.md: the shared programs and people tables use the core data contract v1 role keys, app tables use programs.* role keys, features that use another app's data degrade gracefully, and removing an app or tab never deletes data. It replaces Programs 2.1.0 for new installs; saved apps are not migrated.\n\nClaude and ChatGPT can do everything a person can do in Programs, limited only by the user's access and the access given to that assistant on the Access page. Every write is a reviewed proposal the user approves.\n\n1. Discover and pin. Read read_app_template_guidance (usage, then authoring when extending) to the last nextOffset, read_app_design, list_app_templates and read_app_template for life.project-oversight. Pin this exact version and digest and keep one requestKey for the creation.\n2. Install and reuse. Before installing, call list_archived_items (kind apps, this templateId); if an archived Programs app exists, offer to restore it first. The platform Use action shows the shared-data choice: a compatible programs table (for example from Runway) is reused by default; separate data is an explicit choice (for a confidential program, use a separate app with separate data in a restricted project). people and Runway's month closes are connected when present and never created. The Add app dialog lists the included automations, all on by default (§9). Never seed demo data.\n3. Use app commands, not your own calculations. After the app is saved, call list_app_commands, then run_app_command. Start with schema.describe (forms, fields, options, rules, team, layout groups). Read commands return the app's own results: overview.read, attention.read (what the weekly digest reports), timeline.read (critical path, slips, cash at key milestones), item.drivers, item.impact (slip needed and successors pushed by a date move), gates.read, raid.read, updates.read, report.preview, reports.read, digests.read and team.read. Never compute the critical path, slips, readiness, due-soon, overdue or cash markers yourself; ask the app.\n4. Change things the way a click does. Propose commands run the same handler as the button and return the same review: record.save {role, id?, fields} for any form (programs, items, decisions, raid, updates, team, closes, settings), with item.save, program.save, team.save and settings.save as shortcuts; record.duplicate; record.archive (archive, never delete); baseline.set {program_id}; baseline.reset {item_id, reason}; gate.record {gate_id, outcome, decided_on, approver, rationale, follow_ups[], cancel_item_ids[]}; raid.promote {id, to}; report.save {month, title, narrative}; reminders.refresh; layout.save. A later end date on a baselined planned, in-progress or at-risk item needs slip_reason (scientific, cro_vendor, regulatory, manufacturing, funding, other) and writes exactly one slip; run item.impact first and pass accept_downstream:true only when the user accepts the successor moves. prepare_change on the bound tables still works but skips the app's validation and the slip rule, so prefer commands.\n5. First plan in one session. From a development plan, slide, spreadsheet or description the user shares, propose the program (program.save), then plan items by function with owners, dates, item_type and one predecessor each (item.save; create predecessors first), the first gates with criteria lines ([met], [not met] or [open]) and top risks. Add the people who own work to the program team (team.save; a workspace member ID makes notifications work: look it up with find_identity_candidates or reference_options, or leave it blank). Do not set baselines until the user confirms the plan, then baseline.set.\n6. Human judgements stay human. Never set a program's health or a gate outcome unless the user tells you the judgement; health needs a rationale and the assessment date. Never invent progress in updates or reports.\n7. Values from other apps. When the cash forecast is linked to Runway it is read-only here and labelled \"From Runway\"; change it in Runway (the app shows Edit in Runway when the user may open it). Programs' own outputs (key milestones in programs.plan_items, programs.reports) are read by Runway, Contracts, Fundraise and Partnerships.\n8. Customize everything. Screens, columns and forms: layout.save {screens, order, hide, show, labels, defaults} (form groups item_form, decision_form, raid_form, program_form, update_form, team_form; required fields cannot be hidden); the user can also use the native gear. Business settings: settings.save. New fields on request: add the field to the table with a reviewed schema change and, in the same app revision, list it in the tableMap entry's extraFields [{key,label,kind,options?}] and writableExtra, so it appears in the forms and details at once; fields added later in Database are not picked up automatically. New screens, charts, forms, theme or workflows: a reviewed app revision (begin_app_update → finalize_app_preview → the user's confirmation). A revision must keep: the stable role keys and core v1 fields, the programs.v2 fields other apps read (plan_items name, program_id, item_type, end_date, status, is_key, archived; reports), the slip rule, the calculations, the app-maintained notification fields (owner_member_id, assigned_on, remind_on, added_on), the \"From App\" labels and the declared commands with click parity; a revision that changes one says so in the review.\n9. Automations (TrialAgents Automations; the app works fully without any). Included at install, on by default, each can be turned off: (a) Weekly digest: every Monday, Claude or ChatGPT (when connected) writes a short summary of program status and what needs attention from the digest_brief helper, saves it in programs.digests and emails it to the owner; weeks with nothing important save and send nothing; (b–f) notices to team members with a member ID: added to a program team, assigned an item, an item due in the reminder lead time (Settings, default 7 days), assigned a RAID entry, a RAID review due. Without a member ID the notice goes to the automation's recipients (the owner). Available later in Automations → From app features: the weekly digest without AI (same content, deterministic). Recipients can be changed by the owner in Automations or through you with the exact reviewed setup.\n",

    "dataContract": "Stable role keys. Core data contract v1: programs (name text*, code text, indication text, modality select small_molecule/biologic/antibody/cell_therapy/gene_therapy/rna/vaccine/device/other, stage select* discovery/preclinical/ind_enabling/phase_1/phase_2/phase_3/registration/approved, lead text, status select active/paused/stopped/partnered, archived boolean; Programs-owned optional fields health select unassessed/green/amber/red, health_rationale text, health_date date) and people (name*, organization_id, title, email, archived; optional, read only in Programs; owner fields stay plain text names). App tables: programs.plan_items (name text*, program_id text* record ID of programs, item_type select* milestone/activity, function select* cmc/nonclinical/clinical/regulatory/other, owner text, start_date date, end_date date* (the milestone date for milestones), baseline_start date, baseline_end date, status select* planned/in_progress/done/at_risk/cancelled, predecessor_id text record ID of one plan_items record (finish-to-start, no lag), is_key boolean, notes text, owner_member_id text, assigned_on date, remind_on date, archived boolean); programs.slips (plan_item_id text*, changed_on date*, old_end date*, new_end date*, days number*, reason select* scientific/cro_vendor/regulatory/manufacturing/funding/other, detail text); programs.decisions (name text*, program_id text*, kind select* gate/decision, target_date date, criteria text one per line [met]/[not met]/[open], outcome select pending/go/no_go/conditional/decided, decided_on date, approver text, options text, rationale text, linked_item_id text record ID of a plan item or RAID entry, archived boolean); programs.raid (name text*, program_id text, raid_type select* risk/assumption/issue/dependency, likelihood and impact select low/medium/high, owner text, mitigation text, next_review date, status select* open/monitoring/closed, linked_item_id text, owner_member_id text, assigned_on date, remind_on date, archived boolean); programs.updates (program_id text*, month date* first day, health select*, rationale, summary, next_steps, author text); programs.reports (month date*, title text*, narrative text, contents text frozen JSON written once by the app, saved_on date); programs.settings (one row: functions and stages comma lists of enabled options in display order, health_definitions text, due_soon_days number default 90, update_day number default 5, reminder_days number default 7); programs.team (program_id text*, name text*, member_id text workspace member UUID, role text, added_on date, archived boolean); programs.digests (run_on date*, period text*, summary text*, attention_count number, run_id text, written_by select claude/chatgpt; written only by the weekly digest research, read-only in the app). Notification fields are kept by the app on every save, never typed: owner_member_id = the member ID of the owner's name on the program team; assigned_on = the day that member changed; remind_on = end_date minus reminder_days while planned/in_progress/at_risk (RAID: next_review while not closed), empty otherwise; team added_on = the day a member ID was added. reminders.refresh (Settings → Update owners and reminders) brings them up to date after a team or settings change. Integration runway.month_closes (contract runway.v2): Programs' own cash forecast (month, closing_balance, currency; one closing cash figure per month) until the user links Runway in the app; then Runway's month closes (month, closed, currency, metrics frozen JSON v2), read only. App output for other apps: programs.plan_items with is_key (Runway reads key milestones) and programs.reports. Every field is scalar multiple:false; relationships are record IDs, never names. Slip rule: a later end_date on a planned, in_progress or at_risk item with a baseline creates exactly one slips record in the same review. Health is always a human judgement with a date and rationale; the app never sets it. Access is app-level only: no per-screen protection is advertised. Hiding a program is not security; use a separate app with separate data in a restricted project. Reads are bounded to 800 rows per table; partial reads disable the critical path and totals.",
    "interactionContract": "Seven screens with stable IDs for the native layout gear: overview, timeline, plan, decisions, raid, updates, settings; column groups items, raid, decisions; form groups item_form, decision_form, raid_form, program_form, update_form, team_form (order, hide optional fields, labels and defaults). Overview: next key milestone, KPIs, program cards, next N days, slips this quarter, exceptions. Timeline: Gantt by program and function lane, baselines, critical path, \"what drives this date\", Present mode, cash markers. Plan, Gates & decisions, RAID, Updates (monthly updates, leadership report, report archive, weekly digests) and Settings (settings, cash forecast, program team, programs). Every button and the records it proposes (the same commands for assistants): Add/Edit item → one plan_items create/update with the app-maintained notification fields; a later committed date also creates one slips record (reason required) and, when accepted, updates each pushed successor (and a slip for baselined ones) [item.save]. Duplicate → create without baseline [record.duplicate]. Archive → archived:true, reminders cleared; an item that is someone's predecessor cannot be archived [record.archive]. Set baseline → baseline_start/baseline_end = current dates on up to 50 unbaselined items of a program [baseline.set]. Reset baseline → baseline = current dates, reason appended to notes [baseline.reset]. Record outcome → decisions outcome/decided_on/approver/rationale, plus follow-up milestone creates and cancellations in the same review [gate.record]. Promote → new linked RAID entry of the next type, original closed [raid.promote]. Add update → one updates create (one per program and month) [record.save role updates]. Save report → one reports create with frozen contents computed by the app [report.save]. Settings → one settings create/update [settings.save]. Add team member → one team create; with a member ID the person is notified [team.save]. Update owners and reminders → updates owner_member_id/assigned_on/remind_on on up to 50 drifted items and RAID entries [reminders.refresh]. Cash forecast month → one month_closes create/update while not linked to Runway; once linked it is read-only and labelled \"From Runway\" with Edit in Runway when allowed. Read-only features have read commands that return the same figures as the screens: overview.read, attention.read, timeline.read, item.drivers, item.impact, gates.read, raid.read, updates.read, report.preview, reports.read, digests.read, team.read, schema.describe. Every input carries data-ui-state and a stable data-action; failed saves keep the draft. A command that fails leaves no partial review.",
    "lifecycle": "A fresh preview renders with no writes. After the app is saved, every create, edit, archive, baseline, slip, gate outcome, promotion and report save is an exact records.propose batch (≤ 50 writes) that the user approves in the host review; the app shows a notice until then and the database is unchanged. Edits capture the record version when the editor opens; successors moved by an accepted downstream preview and milestones cancelled by a gate outcome carry the versions captured when the editor or gate opened, so a concurrent edit is rejected, not overwritten. Reconcile ambiguous saves by receipt; never retry with a new key. Saved reports are frozen; their contents never change after later edits. The as-of date is today's date from the app runtime and only filters the view (due soon, overdue, quarter); slips record changed_on and reports saved_on as that date. Layout changes are presentation-only reviewed app updates; saved configuration is re-read on every render. App commands run the saved version only (unsaved previews are read-only); a stale version is rejected and the same requestKey returns the same review. Archiving or deleting the app archives it and keeps all tables and records; restoring brings its automations back switched off. Removing a tab unbinds it; adding it back reconnects the same tables. Installing again first offers to restore an archived Programs app.",
    "limitations": [

const map=Object.fromEntries(roles.map(role=>[role,{typeId:role,fields:schema[role].logicalFields,writableFields:schema[role].readOnly?[]:Object.keys(schema[role].logicalFields)}]));
const bindings=roles.map(role=>({typeId:role,fields:Object.values(schema[role].logicalFields)}));
const config={...metadata.defaults,demoLabel:true,asOfOverride:'2026-11-11',tableMap:JSON.stringify(map)};
const render=new Function('input','tools','templateConfiguration','templateBindings',source);
let state={},rows=demo.records.map(r=>({...r})),proposal=null,next=1;
function dispatch(event){if(event.action==='tracker:layout'){alert('Layout is managed in native TrialAgents app settings. This file demonstrates the program screens only.');return;}
 const out=render({saved:true,writable:true,state,event},{call:(name,v)=>{if(name==='records.read'){const all=rows.filter(r=>r.role===v.typeId);return {rows:all.slice(v.offset,v.offset+v.limit),total:all.length};}if(name==='records.propose'){proposal=v;return {status:'proposed'};}if(name==='integrations.list')return {integrations:[]};throw Error('Unsupported preview capability');}},config,bindings);
 state=out.state;document.getElementById('surface').innerHTML=out.html;
 if(proposal){const changes=proposal;proposal=null;if(confirm('FICTIONAL LOCAL REVIEW ONLY\n'+JSON.stringify(changes,null,2).slice(0,3000))){if(changes.some(c=>c.kind==='update_record'&&!rows.some(r=>r.id===c.recordId&&r.version===c.expectedVersion))){alert('Stale review: a record changed since the form opened.');return;}for(const c of changes){if(c.kind==='create_record')rows.push({role:c.typeId,id:'00000000-0000-4000-9000-'+String(next++).padStart(12,'0'),version:0,data:c.data});else{const r=rows.find(r=>r.id===c.recordId);r.data={...r.data,...c.data};r.version++;}}dispatch({kind:'open',action:''});}}
}
function eventFor(kind,target){const trigger=target.closest('[data-action]');if(!trigger)return;const form=trigger.closest('form');dispatch({kind,action:trigger.dataset.action,value:target.type==='checkbox'?target.checked:target.value??null,form:form?Object.fromEntries(new FormData(form)):{}});}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled&&b.type!=='submit')eventFor('click',b);});
document.addEventListener('submit',e=>{e.preventDefault();eventFor('submit',e.target);});
document.addEventListener('change',e=>eventFor('change',e.target));
dispatch({kind:'open',action:''});
