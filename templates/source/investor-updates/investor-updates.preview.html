  "id": "life.investor-updates",
  "version": "2.0.0",
  "name": "Investor Updates",
  "description": "Keep your board, investors and shareholders informed by email or in meetings. Investors are people (optionally linked to firms) in categories with optional share-class rules. Claude or ChatGPT writes each update, agenda and recap as blocks with levels; the app builds one version per category, checks every fact, flags moved promises, gets one- or two-step approval and sends through TrialAgents: per-person online page and archive, read tracking without open pixels, questions and \"I can help\".",

  "instructions": "Investor Updates 2.0.0 (life.investor-updates) is a frontend-js app on the v2 app contract and the TrialAgents kit, built on the external exchange (update rooms). Recipients are shared people, optionally linked to shared organizations (core contract v1, read/write); programs (core v1) is optional and only read; the app's own tables use investorupdates.* role keys; removing an app or tab never deletes data. The installer schema, helpers, automations and app commands are the same as in 1.0.0 and 1.0.1, so an owner can upgrade an installed copy without moving data.\n\n1. Discover and pin. Read the app guide and the technical reference (read_app_template_guidance) and this documentation; pin life.investor-updates 2.0.0 and its digest with one requestKey. Before installing, check list_archived_items for an archived Investor Updates app and offer to restore it.\n\n2. Install. Use connects existing people and organizations tables by default (for example Fundraise's). Add app shows four install recommendations, all on: Agenda and pre-read draft (meeting_before_draft), Ready for review (ready_for_review), New question or offer of help (new_response) and Weekly digest (weekly_digest). Add app is the one approval; research needs the owner's ready Claude or ChatGPT runner, otherwise it stays at Needs setup and the app works fully. Assistants never confirm Add app.\n\n3. Screens (the app's own side navigation below the platform header; a scrolling row on phones). Overview: Today (what is due per plan and meeting, drafts waiting, engagement per category, open questions) and Questions and offers of help (a board by status: drag a card or use its menu). Updates: Updates (search and filters; open one to review it) and Meetings (date and status edited in the list). An open update shows every category version exactly as rendered, the fact check, the promise tracker, blocks with their level (changed in place), documents on the page and the next step: submit, approve (one or two steps), Send. Investors: People (status edited in the list), Categories (name, level, questions and \"I can help\" edited in the list) and Share classes. Plans & templates: Plans (status edited in the list, Draft now), Templates and Email texts. Settings, for the app's owners only: sender display, approval steps, agenda lead time, questions and \"I can help\" on update pages, confidentiality footer. Automations and access are managed on their platform pages; the app links to them.\n\n4. Saving. Record edits save directly (records.save) from a person's own click, change or submit, with the record version shown when editing started; a value someone else changed first is not saved and comes back with a message. There is no review step for record changes and the app shows no \"prepared for review\" text. Messages use the platform's one message. Undo offers the person's last change. Archiving a category, share class, recipient, template, plan or meeting is a platform archive (nothing is deleted, Undo brings it back); a draft update is cancelled instead.\n\n5. First run. The installer creates empty tables only; the empty Overview offers \"Add the standard setup\", which saves the Board, Investors and Shareholders categories and the five standard templates (Monthly board update, Quarterly investor update, Milestone flash, Meeting agenda and pre-read, Meeting recap) as normal editable records. The first settings.save does the same. share_classes starts empty.\n\n6. Investors. Add people (investor.create: an existing person_id; for a new person the person, or first the new firm, is saved, then run investor.create again with person_id), their categories and share classes. Category membership = people added directly + everyone holding one of the category's share classes, minus paused and archived recipients and addresses unsubscribed from the series.\n\n7. Plans and automations. plan.save creates a plan (format email or meeting, template, categories, sources, cadence, send-by day, approvers). For an email plan, set up its scheduled draft: read_app_automation_features, read_app_automation_feature_contexts (choose the plan), prepare_app_automation_feature (scheduled_draft) and the exact confirm_app_service_review a person approves; or the user does it in Automations. The app stores no schedules, recipients or on/off; it keeps plans.next_period_end, which it sets from the cadence and advances when the period is sent.\n\n8. Drafting. Run update.read and schema.describe first. Draft with update.create_draft (format, plan_id or meeting_id, blocks, facts, submit:true for In review) or update.save_blocks. Blocks only, no HTML; every block has a level (board, investors, everyone); numbers reference facts with sources. Read only the plan's allowed sources under the user's access. Never recompute the app's calculations: versions, due dates, read rates, fact checks and the promise tracker come from the read commands. Write commands save directly with Data level Edit (run_app_command returns the saved rows); with View they are refused.\n\n9. People only. Approval (with the \"I confirm these\" tick for unverified facts), links, every send, answers to questions, reminders and corrections are a person's clicks in the app. Sending keeps its single confirmation: the app shows each email exactly as it goes out, and the person confirms the send once in TrialAgents before anything leaves; the update locks in the same confirmation. No app command approves, sends, answers a recipient, unsubscribes anyone, shows recipient links or writes another app's tables. Assistants may prepare drafts, draft answers (response.draft_answer) and email texts.\n\n10. Customization: layout.save (screen order and visibility; investors and updates columns as group:column; an app change a person approves), category.save, share_class.save, template.save, template.save_from_update, labels.save and preferences.save (owners), custom_field.register (recipients, meetings, updates; returns schema_change when the field still has to be added with a reviewed schema change and an app revision binding it).\n\n11. Recovery. Retries keep the same requestKey; a stale version is a conflict, never an overwrite. Partial reads pause writes and are named in the platform message; data still loading shows as loading, never as empty or zero. Archiving the app pauses its automations and stops its online links; restoring re-enables unexpired links, and automations come back switched off until an owner resumes them.",
