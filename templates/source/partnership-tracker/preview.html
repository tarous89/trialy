/* PARTNERSHIP TRACKER v1.1 — Relationship-workbench design, distinct from clinical dashboards.

:root{--bd-navy:#263e44;--bd-navy2:#16363b;--bd-ocean:#186a76;--bd-aqua:#187d83;--bd-ink:#223a40;--bd-muted:#657a78;--bd-bg:#f6f7f3;--bd-white:#fff;--bd-line:#e0e6df;--bd-soft:#eaf1ed;--bd-green:#276c5e}
