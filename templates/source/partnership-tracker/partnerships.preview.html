  "instructions": "Partnerships 3.0.0 (life.partnership-tracker) is a v2 frontend-js app on the shared kit for a biotech's licensing, partnering and collaboration deals in all directions. It upgrades Partnerships 2.1.0, 2.2.0 and 2.2.1 (same tables and fields; upgradeFrom). Read read_app_template_guidance (guide and reference, every nextOffset) and read_app_automation_guide before preparing it or its automations. Pin life.partnership-tracker 3.0.0 with its digest. Do not add login, accounts, outreach email, imports or file storage.\nINSTALL. Check list_archived_items (kind apps, templateId life.partnership-tracker) and offer to restore an archived app first. Use installs the app; the Use existing data? dialog connects existing organizations, people and programs tables by default (core.v1; reuse, never copy) and, when Contracts or Data Room are in the workspace, their agreements and dataroom.v1 tables. You may prefill the dialog with prepare_data_access; never confirm it. Agreements are read-only here and are not created when absent; without Contracts the CDA, term sheet and agreement fields hold manual references. Data room access and engagement are an integration: the app keeps its own table for access entered by hand, and offers \"Use Data Room's data\" once Data Room exists.\nSCREENS. Overview (what needs attention: open deals, follow-ups due, stalled deals, what is coming up, new signals, funnels by asset and direction). Pipeline (board: drag a card to another stage, or use the move menu on the card; list with inline edits of direction, stage, owner, next step, next date, fit, priority and source; funnel with win/loss; search, filters, saved views and You are). Partners (partners and contacts with inline edits; the side panel holds the full history). Conferences (one conference at a time, remembered per person: prep, meetings and requests with inline status, briefs, who to meet, Log outcome, after the event). Activity (timeline, follow-ups with Done and inline owner and due date, materials log, My week): these are the business record of meetings and disclosures and stay. Research (signals, target suggestions, partnering profiles per asset, research reports with the next digest). Lists (team names, lost reasons, stage labels and hidden stages, activity kinds, deal types, tag categories and custom fields). Settings, owners only (stalled days, how the pipeline opens, rows per page, digest intro line). Access, automations and logs are platform pages (links platform:access, platform:automations).\nSAVING. Record edits save directly: a person's click, inline change, drop or form saves at once with records.save and the version captured when editing started; there is no review dialog and Undo reverses the person's own last change. Delete archives the record (Undo brings it back). A stage move always writes stage history in the same save; Lost and On hold ask for a reason first. Nothing is ever sent to partners.\nAPP COMMANDS. Once the app is saved, use its commands for anything a person can do: list_app_commands, then run_app_command with the app's current version, the command id, its input and a stable requestKey. Start with schema.describe (field keys, stages, lists, tag categories, screens and pipeline columns, custom and additional fields). Read commands (overview.read, opportunities.list, opportunity.read, partners.list, partner.read, contacts.list, activities.list, follow_ups.list, conferences.list, conference.read, signals.list, research_reports.list, briefs.list, digest.read, views.list, settings.read, integrations.read) return the app's own calculations: report those and never compute funnels, stalled deals or due follow-ups yourself. Write commands (record.create/update/archive, opportunity.move_stage/set_links/set_tags/set_contacts, activity.log, follow_up.*, meeting.create/record_outcome, signal.*, brief.mark_reviewed, view.save/update/archive, settings.save, stages.save, lists.save, preferences.save, lost_reasons.save, category.*, categories.add_standard, custom_field.register, data_room_access.add) save directly with Data level Edit (the response lists saved.rows); with View they are refused. Each write command saves in one step; tell the user what you saved. layout.save is kept for compatibility and returns an error in 3.0.0: screens and columns change with an app change (begin_app_update), and pipeline columns and sort belong to saved views. When a result includes schema_change, a table change is still needed (prepare_change update_type, workspace owner) before the new stage, activity kind or custom field is used. Agreements come from Contracts and data room access from Data Room once linked: a write to them is refused, so make the change in that app and say where.\nEVERYTHING COMES IN THROUGH YOU. When the user pastes conference requests (for example partneringONE), meeting notes, emails, business cards or a list: read first (opportunities.list, partner.read), check each organization's history (earlier opportunities with stage and lost_reason, activities, declines) and WARN before adding a target that declined or is on hold. Then save with commands: partners and contacts first (record.create), then opportunities (record.create with tags such as {\"Conference\":[\"BIO-Europe 2026\"],\"Channel\":[\"Conference\"]}), then conference meetings (meeting.create). One command cannot reference the new IDs of another: create parents first, then children with the saved IDs.\nAFTER A MEETING. activity.log saves in one step: the activity (summary, contact_ids, team, document_version_ids with exact versions), an optional stage move (move_to, with stage history) and up to two follow-ups (title, owner, due). Lost and on_hold need a reason from the lost reasons list.\nBRIEFS. Before a meeting with a linked opportunity, write a one-page brief with record.create (table brief, context_id the meeting): their pipeline and recent deals, the people, our history and what was shared, what to ask, cautions (no CDA: non-confidential only).\nGATES. CDA, term sheet and agreement: opportunity.set_links with agreements record IDs when Contracts is connected; new ones are made in Contracts, never by Partnerships. Data room: dataroom_room_id holds the Data Room room_id; without Data Room, data_room_access.add records access by hand.\nAUTOMATIONS. Recurring work is TrialAgents Automations, never a separate host task, and the app never stores or runs schedules. The catalog declares two install recommendations, selected by default when the app is added: partner_research (weekly Monday 07:00; saves new partnerships.signals and one partnerships.research_reports row per run, create only, then emails the digest {{run.summary}} to workspace members after each completed run, also when nothing was found: one automation with one switch) and meeting_briefs (the day before linked meetings; saves draft partnerships.briefs, create only). Their reads use every field the app binds on each table (minus listed exclusions). To add or change them later use read_app_automation_features, prepare_app_automation_feature and the exact confirmation, or Automations -> From app features; verify with read_app_automation_readiness before saying anything runs. Cadence, day, time and recipients are changed on the automation itself. Follow-up reminders are not a recipe because they need the condition status = open: when the user asks, prepare an email action with prepare_app_action, a record_date trigger on partnerships.follow_ups.due at 08:00 (and a second one at +1 day for overdue), the condition status equals open, memberField owner_member_id and the owner as fallback recipient. Team member IDs (settings.team_members, {name: member UUID}) are set with settings.save, not on a screen.\nCUSTOMIZATION. Users may ask you to change how the app works; keep its scope (no new features beyond partnering). Prefer the commands (view.save, stages.save, lists.save, preferences.save, custom_field.register, category.*). Saved views (partnerships.views): name, filters {stage, program, direction, owner, priority, source, organization: [values], tags: {Category: [values]}, custom: {field_key: [values]}}, layout board/list/funnel, columns (pipeline column IDs from schema.describe or cf:<key>), sort {field, dir}, shared, owner (a team name); only the owner changes a view. Settings JSON on the one partnerships.settings row: stage_config {labels, hidden (never identified, signed or lost), custom [{key, label, after}]}; option_lists {activity_kinds, deal_types: {key: label, hidden: []}}; preferences {pipeline_layout, default_view (a shared view ID), page_size 10-50, overview_hidden}; team_members; lost_reasons; stalled_days; digest_text. A new stage or activity kind also needs its option on partnerships.opportunities.stage or partnerships.activities.kind (reviewed schema change). Custom fields: add the field to the table (reviewed schema change; tables opportunities, organizations, people, activities, follow_ups, conferences), add it to the app's tableMap and binding with begin_app_update (same source), then custom_field.register. Screens, layout and design changes are app changes through begin_app_update that a person approves. NEVER contact partners, send or schedule email to anyone outside the workspace, put confidential deal terms in emails or signals, or give legal or valuation advice. Suggest outreach wording only when asked; the user sends it from their own mailbox.\nUPDATE AND RECOVERY. Installed 2.1.0, 2.2.0 and 2.2.1 copies upgrade to 3.0.0 with their owner's approval; records, connections and options carry across (heading, layoutProfile and demoLabel are no longer used). A save refused because someone changed the same value first shows the newer value; re-read and retry. Archiving the app pauses its automations; restoring brings them back disabled.",

    "dataContract": "Stable role keys; every field scalar (multiple false), lowercase snake_case, relationships by record ID in text fields, JSON in text fields. Core data contract v1 (read/write): organizations (name*, org_type, country, website, archived) = partners; people (name*, organization_id, title, email, archived) = contacts (professional only); programs (name*, code, indication, modality, stage*, lead, status, archived) = assets. agreements (core.v1, optional, readOnly, core fields only): CDAs, term sheets, signed agreements written by Contracts; not created when absent. dataroom.access_grants and dataroom.engagement (dataroom.v1, optional integration): Data Room's outputs read-only once linked, otherwise this app's own table for access entered by hand (source manual). App tables (partnerships.v1): settings (one row: digest_text, stalled_days default 21, lost_reasons JSON, team, team_members JSON {name: member UUID}, custom_fields JSON, option_lists JSON, stage_config JSON, preferences JSON); asset_profiles (program_id*, directions JSON, deal_types JSON license/co_development/option/research_collaboration/platform/acquisition/other, territories, target_profile, materials JSON, research_focus, research_exclusions, research_sources, status* active/paused/done); opportunities (name*, organization_id*, program_id*, direction* out_license/in_license/co_development/research_collaboration/academic/platform/other, stage* identified/contacted/non_confidential/cda/confidential_evaluation/term_sheet/exclusivity_diligence/signed/lost/on_hold, stage_on, owner*, priority, fit 1-5, fit_rationale, source research/conference/inbound/outbound/referral/other, contact_ids, next_step, next_date, lost_reason, cda_agreement_id, dataroom_room_id, term_sheet_agreement_id, agreement_id, tags JSON category->values, archived); stage_history (opportunity_id*, from_stage, to_stage*, changed_on*, changed_by, note), written with every stage change; activities (opportunity_id, organization_id*, kind* meeting/call/email/conference_meeting/material_shared/note, occurred_on*, person_ids, team, summary, materials JSON, conference_id, logged_by user/claude/chatgpt, tags, outcome, status requested/confirmed/held/declined/cancelled); follow_ups (owner_member_id, opportunity_id, activity_id, title*, owner*, due*, status* open/done/cancelled, done_on); conferences (name*, starts_on*, ends_on, location, platform partneringone/bio_one_on_one/other/none, deadlines JSON [{label,date}], goals, team, status* planning/live/done, tag_value*); briefs (opportunity_id, conference_id, activity_id, meeting_on, content*, sources JSON, written_by, written_on*); signals (organization_id, opportunity_id, program_id, kind*, title*, why*, source_url*, published_on, found_on*, status* new/reviewed/dismissed/accepted, dismiss_reason, run_id); tag_categories (name*, values JSON, multiple, standard, archived); views (name*, filters* JSON {tags,stage,program,direction,owner}, layout* board/list/funnel, shared, owner*, archived). Additions beyond the scope: settings.time_zone and team, asset_profiles.research_sources, activities.outcome and status, briefs.activity_id, views.archived. Saved data only; each screen reads its tables in bounded pages (8 x 100 rows per table) and disables changes and complete totals when a read is partial. research_reports (run_on*, run_id, cadence daily/weekly/monthly, period, summary*, new_signals, new_targets, sources JSON, written_by claude/chatgpt/user): one per research run, written by the research automation (create only). briefs.status draft/reviewed; views.columns JSON and views.sort JSON. Custom fields: any extra field present in the tableMap and binding and registered in settings.custom_fields.",
    "interactionContract": "v2 app on the shared kit: no header, title or message bar of its own (the platform shows the app name and the one message, returned as notice). Side navigation with eight screens: overview, pipeline, partners, conferences, activity, research, lists and settings (owners only). Overview: open deals (totals from records.summarize), follow-ups due and overdue with Done, stalled opportunities, upcoming meetings and conferences, new signals, funnel by asset and by direction. Pipeline: drag-and-drop board by stage (kit.board; every card has a move menu for keyboard and touch; Lost and On hold ask for a reason in a side panel), list with inline cells (direction, stage, owner, next step, next date, fit, priority, source, custom fields) and paging, funnel with win/loss and loss reasons; search, filters (asset, direction, owner, stage, priority, source, partner, every tag category, custom select or yes/no fields), sort, saved views (private or shared; You are picks the owner). The opportunity side panel shows inline fields, moves stages (stage history in the same save), links CDA, data room, term sheet and agreement, edits tags and contacts, lists activities, follow-ups and materials, and warns about earlier declines. Partners: partners and contacts with inline edits; panels with the full history. Conferences: the conference picker (remembered per person as the working context), stats, prep, meetings with inline status, briefs, Log outcome (status, outcome, next step, follow-up), who to meet, after the event, and Its opportunities (the Conference tag). Activity: timeline, follow-ups (Done, Cancel, inline owner and due), materials log, My week. Research: signals (Reviewed or Dismiss with a reason), target suggestions per asset (Accept creates an opportunity at Identified after a history check), partnering profiles, research reports and the next digest. Lists: team names, lost reasons, stage labels and hidden stages, activity kinds, deal types, tag categories (values and several-per-deal inline) and custom fields. Settings (kit.settings, owners only): stalled days, pipeline layout and default view, rows per page, digest intro line. Edits save at once (records.save, version captured when editing started); Undo offers the person's last change; delete archives. Every empty screen offers its first action; reads still on their way show Loading. App commands: the same 50 names and inputs as 2.2.x; write commands save directly; layout.save returns an error (no layout profile in 3.0.0).",
    "lifecycle": "A new preview shows empty data and never writes. Each screen reads only its tables in fixed batches (records.readMany, up to 8 x 100 rows per table), kept per request, so changing screens, filtering and sorting need no new request; partial reads are labelled and switch changes off. Record writes save directly from a person's own action or a write command (at most 50 changes per save); panels keep the record version from when they opened, so a concurrent change to the same value is refused with the newer value shown. Automations are separate TrialAgents definitions linked to the app: the app never reads their state, never waits for them and keeps working when they are off or failing. Archiving the app pauses them; restoring brings them back disabled. Installed 2.1.0, 2.2.0 and 2.2.1 copies keep their saved source until their owner approves the upgrade to 3.0.0.",

      "whenUseful": "Two install recommendations (selected by default when the app is added; the owner can opt out) and one chat-set-up reminder, all TrialAgents Automations linked to the app; the app never waits for them. (1) partner_research: research on the user's Claude or ChatGPT runner, weekly Monday 07:00 Europe/Berlin by default (change it on the automation). Reads asset profiles, open opportunities, partners and earlier signals (every bound field except listed exclusions, so custom fields never stop it), searches public sources, saves new partnerships.signals (status new) and one partnerships.research_reports row per run, create only, and after each completed run emails {{run.summary}} to workspace members only, in the same automation (the digest format shown in Research > Reports and digest). (2) meeting_briefs: research one day before each activity date; for linked meetings without a brief it saves one draft partnerships.briefs row, create only. (3) Follow-up reminders (on request): email action, record_date on partnerships.follow_ups.due at 08:00 and +1 day, condition status open, memberField owner_member_id.",

      "promptExample": "Partner research for Partnerships. For each active asset profile: read its directions, territories, target profile, research focus, exclusions and preferred sources, the open opportunities and their partners, and the signals of earlier runs (including dismissed ones and their reasons). Search public sources for deals, trial results, pipeline changes, financing and people moves at those partners, and for new companies that fit the target profile. Save each finding as a new partnerships.signals row with status new: kind (deal, trial, pipeline, financing, people, news), title, why (one line on why it matters for a named asset), source_url, published_on, found_on (today), organization_id, opportunity_id and program_id when known, and run_id. Save at most two target suggestions per asset (kind target_suggestion, title = company name, why = the fit rationale) with sources; never suggest a company that is excluded or that declined, unless something material changed, and then say so. Deduplicate by organization + kind + source_url (company name for target suggestions) against all earlier signals; skip anything matching a dismissed signal. Every run, also when nothing new was found, save one partnerships.research_reports row: run_on (today), run_id, cadence (from this automation's schedule), period, summary in the digest format, new_signals, new_targets, sources JSON [{title,url}] and written_by (claude or chatgpt). Save it last, then complete the run with the same summary. Digest format (the summary of every run, saved as the report's summary and used as run.summary): a first line 'Partnerships · <period>: N moved · N due · N new signals' (period 'week of <d Mon>' for weekly, the date for daily, '<Mon YYYY>' for monthly), then the sections Moved, Due this week (Due today / Due this month for other cadences, with the overdue count), Stalled, Coming up, New about your targets, Suggested targets; at most 3 items per section ('· N more'), about 150 words, empty sections left out, one line when nothing happened, no deal terms, notes, briefs or fit rationales; last line 'Open Partnerships →'. Start with partnerships.settings.digest_text when it is set. Stalled means open with no activity, stage change or completed follow-up for settings.stalled_days (default 21). Never contact anyone, change opportunities, stages or any other table, or include confidential deal terms."
