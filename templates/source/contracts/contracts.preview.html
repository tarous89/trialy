;const metadata={
  "id": "life.contracts",
  "version": "2.0.0",
  "name": "Contracts",
  "description": "Register of CDAs, MSAs, SOWs and other agreements with key dates and obligations: contract families with total value, notice and expiry alerts, obligations owed by and to the company, a CDA check, a pre-signature pipeline with drag and drop and a due-diligence list. Edits save at once. Signed originals are TrialAgents documents; Claude or ChatGPT fills in terms with quotes and a person checks them.",
  "tags": [
    "biotech",
    "contracts",
    "agreements",
    "cda",
    "msa",
    "sow",
    "obligations",
    "licensing"
  ],
  "whenToUse": "A small biotech needs one register of its agreements (CDAs, MSAs, SOWs, change orders, MTAs, licences, CMO supply, quality, consulting, clinical trial, data processing and lease agreements) with families, key dates, notice deadlines, obligations, CDAs and reminders, with signed originals stored in TrialAgents and assistant extraction verified by a person.",
  "whenNotToUse": "Drafting or negotiating contract language, clause libraries, redlining, approval chains, e-signature, legal review or risk scoring, procurement, purchase orders and invoice matching (Trial Finance), and employment contracts.",
  "engine": "frontend-js",
  "defaults": {
    "tableMap": "{}",
    "pageSize": 25,
    "readOnly": false,
    "asOfOverride": ""
  },
  "options": {
    "tableMap": {
      "type": "string",
      "description": "JSON object keyed by stable role key: core data contract v1 roles agreements and organizations (required) and people, programs, studies (optional); app roles contracts.settings, contracts.terms, contracts.obligations (output, contract contracts.v1); integration programs.plan_items (programs.v2): this app's own milestone entries, or Programs' plan items (read only) once the user links Programs inside the app. Each value is {typeId:<authorized table UUID>, fields:{<logical key>:<real field key>}, writableFields:[<logical keys>]}. Real keys are lowercase snake_case.",
      "default": "{}"
    },
    "pageSize": {
      "type": "number",
      "description": "Rows per page in registers, 10–50; the template clamps the value.",
      "default": 25
    },
    "readOnly": {
      "type": "boolean",
      "description": "When true, the app saves no records even for users who may edit.",
      "default": false
    },
    "asOfOverride": {
      "type": "string",
      "description": "Optional fixed as-of date (YYYY-MM-DD) for previews and tests only. Leave empty: the app uses today's date from the app runtime.",
      "default": ""

  "instructions": "Contracts 2.0.0 is a frontend-js contract register on the v2 app contract and the kit (it declares 'use trialagents v2'). It follows docs/product/MODULAR_APPS_AND_SHARED_DATA.md: shared tables use core data contract v1 role keys (agreements, organizations, people, programs, studies), app tables use contracts.* role keys, contracts.obligations is a published output (contract contracts.v2, a superset of contracts.v1, writer life.contracts) and programs.plan_items is an integration with Programs. Contracts tracks agreements; it does not draft or sign them. Its tables, fields and options are those of 1.1.x, so an owner can upgrade an installed 1.1.0 or 1.1.1 copy (upgradeFrom) without moving data.\n\n1. Discover and pin. Read read_app_template_guidance (guide, then reference) to the last nextOffset, read_app_design, list_app_templates and read_app_template for life.contracts. Pin this exact version and its digest and keep one requestKey for the installation.\n\n2. Install and reuse. Before installing, call list_archived_items (kind apps, this templateId) and offer to restore an archived Contracts app first. Use shows the Use existing data? dialog: an existing agreements table (for example Runway's) and organizations table are connected by default, and the seven Contracts-owned optional agreements fields (parent_id, program_id, study_id, total_value, currency, signed_on, owner) are added to it in the same installation. people, programs and studies connect when present, otherwise Contracts gets its own tables. When Programs is installed, its plan items are offered for programs.plan_items (read only); otherwise Contracts keeps its own milestone entries. Only the user confirms. Never add example records.\n\n3. Map fields. Core roles use exactly the core data contract v1 fields; never rename, retype or remove them. agreement_type and status stay text fields in the core contract; Contracts writes only the documented option values. Use multiple:false, lowercase snake_case real keys and scalar record-ID text for relationships (counterparty_id, parent_id, program_id, study_id, agreement_id, milestone_id).\n\n4. Screens (side navigation; tabs on narrow screens). Overview: the next deadline in one sentence, four numbers (active, overdue obligations, waiting to be checked, before signature), Needs attention (overdue obligations with Mark done, proposals to verify, agreements that expire before a key milestone), the next reminder window and agreements before signature. Agreements: search (optionally also in the signed originals), filters, Add agreement, Upload a signed original, Due-diligence list, and a table whose Status, Expiry and Owner are edited in place; the name opens the details panel (key terms, renewal decision, verification, signed original, family, obligations, contacts, Duplicate, Archive). Families: family value per currency, change-order share, earliest expiry, next notice, Add child agreement. Obligations: table with Status edited in place and Verify, a 12-month calendar and payments by month per currency. CDAs: \"Have we signed a CDA with…?\", New CDA request, CDAs by organization, confidentiality ending within a year. Pipeline: a board (drafting, in negotiation, out for signature): drag a card or use its menu to change the stage; Mark signed. Counterparties: the shared organizations table, name, type and country edited in place. Milestones: own entries edited in place, or From Programs read only (with the Add Programs / Use its milestones control). Settings, for the app's owners only: default currency, reminder windows, the agreement types and obligation kinds offered.\n\n5. Saving. Every record change is saved directly (records.save) from the person's click, edit or form, with the version captured when editing started; the platform shows the message and an Undo button follows. There is no review step for record edits in the app. Archive is archive_record (nothing is removed). A new agreement's key terms open right after it is saved (a save cannot reference a record it creates). Assistants with Data level Edit save the same changes directly; with View they only read.\n\n6. Two ways in, both chosen by the user; nothing is read automatically. (a) The user gives you a contract, or names an original already uploaded in Contracts: upload it as a TrialAgents document if it is not one yet (platform upload), read it with list_documents and read_document_text (follow hasMore) only if it is AI-readable, and store the agreement, its key terms and its obligations (step 7). If an original is not listed for you, say it is not readable and ask the owner to make it AI-readable in Documents; never guess its contents. (b) The user uploads the original in the app and types the details in, or leaves them blank.\n\n7. Filling in from a contract. The agreements record if it is missing (name, agreement_type, counterparty_id, status, effective_date, expiry_date, signed_on, total_value, currency, parent_id when it is a SOW or change order of a known MSA); then, once its record ID exists, contracts.terms {agreement_id, renewal, renewal_term_months, notice_days, confidentiality_years, cda_direction, purpose, governing_law, document_id, document_version_id, extraction_status:\"proposed\", source_quotes: JSON {field:{quote,page}}} and contracts.obligations {agreement_id, counterparty_id (the agreement's counterparty unless the contract names another party), title, kind, direction, due_date or trigger, recurrence, milestone_id, amount, currency, owner, status:\"open\", verified:false, source_quote (the exact sentence), source_page, source_document_version_id}. Do not calculate the app's dates yourself: the app calculates notice deadline and confidentiality end from these fields and stores them on its next save. Quote exactly and flag uncertainty. Proposals stay \"not checked\" until checked: by a person in the app (Verify proposals, each quote checked against the extracted text), or by you when the user explicitly asks (verified true; on terms extraction_status verified, verified_by the user's name, verified_on today).\n\n8. Every control is an exact record change you can make within the access the user gave you: Add or edit (create or update the record from its form fields); Archive (archive_record); Add child agreement (agreement with parent_id); Status in place or a Pipeline move (agreements.status; contracts.terms.status_since today); Expiry in place (agreements.expiry_date and the recalculated contracts.terms notice_deadline and confidentiality_end); Mark signed (status active, signed_on, effective_date, expiry_date; status_since); obligation Status (contracts.obligations.status); Renewal decision (a line \"Renewal decision on <date>: renew|renegotiate|terminate — note.\" appended to contracts.terms.notes; renegotiate also sets agreements.status in_negotiation and status_since); New CDA request (agreement type cda_nda, status drafting; then terms with cda_direction and purpose); Settings (the one contracts.settings row: default_currency, reminder_days, agreement_types, obligation_kinds); Attach an original (contracts.terms document_id and document_version_id, or document_link). Read-only answers use the same records and the rules in documentation.dataContract: families, \"do we have a CDA with X?\", the due-diligence list, \"what do we owe CRO Y?\" (open obligations, checked first; label unchecked ones). Never give legal advice or risk opinions, draft or negotiate contract language, or send documents.\n\n9. Customization. Changes to screens and design are app revisions the person approves in the approval footer. Forms are generated from the logical schema S in the source (field key, label, kind text/longtext/number/date/select/boolean/person/ref, options, required) and the tableMap: to add a field, add it to the table with a schema change and, in one app revision, add it to S and to that role's tableMap fields and bindings; it then appears in the form, the details panel and validation. Fields bound but not in S are shown read-only under \"Additional fields\". Keep: the v2 marker, the kit, role keys and contracts, the calculation rules, the \"From <App>\" labels of read-only connected values, records.save with expectedVersion, and no app header, banners or footer. Revise the same saved app; preserve IDs, bindings and access.\n\n10. No automations. Contracts has no recommended automations and no scheduled work; Overview, Obligations, CDAs and Pipeline show deadlines and pending agreements on demand. The user may add their own automations in TrialAgents → Automations.",

    "dataContract": "Stable role keys. Core data contract v1: agreements (name text*, counterparty_id text record ID of organizations, agreement_type text with values cda_nda/msa/sow_work_order/change_order/mta/research_collaboration/licence_in/licence_out/cmo_supply/quality_agreement/consulting_advisory/clinical_trial_agreement/data_processing/lease_services/other, status text with values drafting/in_negotiation/out_for_signature/active/expired/terminated/superseded, effective_date date, expiry_date date, archived boolean; Contracts-owned optional fields parent_id text record ID of the master agreement, program_id, study_id, total_value money, currency select USD/EUR/GBP/CHF/CAD/AUD/JPY/CNY/SEK/DKK/NOK/INR, signed_on date, owner text), organizations (name*, org_type, country, website, archived), and optional people, programs, studies (core fields). App tables (contracts.v1): contracts.settings (one row: default_currency, reminder_days comma list default 30,60,90, agreement_types and obligation_kinds comma lists of enabled values in order); contracts.terms (one per agreement: agreement_id text*, renewal select none/automatic/option, renewal_term_months, notice_days, notice_deadline date calculated by the app, confidentiality_years, confidentiality_end date calculated by the app, cda_direction select mutual/incoming/outgoing, purpose, governing_law, document_id, document_version_id, document_link URL text, extraction_status select none/proposed/verified, source_quotes JSON text {field:{quote,page}}, verified_by text, verified_on date, status_since date, notes). Output contracts.obligations (contracts.v2, a superset of contracts.v1, writer life.contracts): agreement_id*, counterparty_id text record ID of organizations (defaults to the agreement's counterparty), title*, kind* payment/report/diligence_milestone/notice/delivery/publication_review/audit/insurance/royalty/other, direction* we_owe/they_owe, due_date, recurrence none/monthly/quarterly/annual, trigger, milestone_id record ID of programs.plan_items, amount money, currency, owner, status* open/done/waived/missed, verified boolean, source_quote, source_page number, source_document_version_id, archived. Integration programs.plan_items (programs.v2; name, program_id, item_type, end_date, status, is_key): Contracts' own milestone entries until the user links Programs in the app, then Programs' plan items read only. Calculations: notice_deadline = expiry_date − notice_days when renewal is automatic or option; confidentiality_end = (expiry_date, or effective_date without expiry) + confidentiality_years × 12 calendar months, day clamped to the month end; family value = master total_value + Σ children per currency, other currencies listed separately and never converted, change-order share = Σ change orders ÷ family value in the master's currency; earliest expiry and next notice over active members; next due of a recurring obligation = first occurrence on or after the as-of date; expires before milestone = active agreement whose program has a key milestone after its expiry. Calculated by the app from the fields whenever it shows them, whoever saved the record; stored copies of notice_deadline and confidentiality_end are refreshed on the app's next save and are used only when the inputs are missing. Unverified (not yet checked) = obligations with verified false or terms with extraction_status proposed; never counted as confirmed. Values read from another connected app are labelled From <App> and are changed in that app. Every field is scalar multiple:false; relationships are record IDs. Reads are bounded to 800 rows per table; partial reads withhold totals and say so. Delete is archive_record. Signed originals are TrialAgents documents with their own permissions and AI-readable flag. Access is app-level; database column rules can hide total_value and amount.",
    "interactionContract": "Nine screens in a side navigation that becomes tabs on narrow screens (input.viewport): overview, agreements, families, obligations, cdas, pipeline, counterparties, milestones (when the milestones role is connected) and settings (owners only, input.appRole). The current screen is remembered per person (output.context {screen}). Overview: next deadline sentence (\"Cancel X by 1 Dec 2026 or it renews for 12 months\"), four numbers, Needs attention (overdue obligations with Mark done, proposals to verify, agreements that expire before a key milestone), the next reminder window and agreements before signature. Agreements: search over the register and optionally the signed originals (documents.search, with coverage), filters (type, counterparty, program, status, checking, expiry window), paging, Add agreement, Upload a signed original (data-trialy-document upload button: the platform upload), Due-diligence list (types, statuses, minimum value; copyable Markdown); Status, Expiry and Owner are inline cells that save at once; the name opens the details panel with key terms, renewal decision, verification, signed original (AI-readable and extraction status, upload or attach), family, obligations with quotes, counterparty contacts, Duplicate, Archive and a link to Logs. Families: per master the family value per currency, change-order share, earliest expiry, next notice and Add child agreement. Obligations: table with next due, inline Status and Verify, a 12-month calendar and payments by month per currency. CDAs: the \"Have we signed a CDA with…?\" check, New CDA request (counterparty and purpose, status drafting, then its key terms), CDAs by organization and confidentiality ending within a year. Pipeline: kit board with three columns (drafting, in negotiation, out for signature); a drop or the card menu saves the stage and status_since; Mark signed opens the signature panel. Counterparties: organizations with inline name, type and country, agreement and contact counts. Milestones: own entries with inline name, date, status and key flag, or From Programs read only. Settings: kit settings form (default currency, reminder windows, agreement types and obligation kinds offered). Side panels (kit.panel) for creating a record, editing many fields, key terms, verification (each proposed value with its quote and page, checked with documents.quote, a decision per obligation and the verifier's name, one save), signature, attachment, renewal decision and the due-diligence list. Messages are output.notice only; Undo uses undo.list/undo.run after a save. Reads: one records.readMany per group of tables the screen shows (settings; agreements+terms+organizations; obligations; milestones+programs; people+studies); a pending read shows as loading. No app header, banners, footer, login, browser storage or network calls.",
    "lifecycle": "Unsaved previews never read documents or write. Saved apps read their tables on every screen and keep them in the frame for screen changes and filters. Record changes save directly from the person's own click, edit or form (records.save, at most 50 changes, expectedVersion captured when editing started); a refused save brings the earlier value back with the platform's message; Undo is offered for the person's last action. A new agreement's key terms open right after the agreement is saved. Uploading an original is a platform upload with explicit confirmation; the app then offers to attach the new version. An assistant fills in a contract only when the user asks; its entries stay not checked until a person verifies them in the app, or the assistant does on the user's explicit request, with the name and date recorded. Archiving keeps records and their history (Logs); removing the app or a screen never deletes data. Linking Programs is a one-time choice in the in-app integration dialog; after that the milestones are read only and Contracts' own entries stay in Database. Upgrading from 1.1.0 or 1.1.1 keeps every table, field and record; the dropped presentation options (heading, layoutProfile, demoLabel) no longer apply.",
    "limitations": [
      "No drafting, templates, clause library, redlining, negotiation workflow, approval chains or e-signature; no legal advice or risk scores. Contracts tracks agreements; it does not sign them.",
      "Filling in from a contract is done by the user's connected assistant (Claude or ChatGPT) on request, not by the app or on a schedule; only AI-readable originals can be read, and scanned originals need text extraction to finish first.",

function apply(changes){for(const c of changes){if(c.kind==='create_record')rows.push({role:c.typeId,id:'00000000-0000-4000-9000-'+String(next++).padStart(12,'0'),version:0,data:c.data});else if(c.kind==='archive_record')rows=rows.filter(r=>r.id!==c.recordId);else{const r=rows.find(r=>r.id===c.recordId);if(r){r.data={...r.data,...c.data};r.version++;}}}}
