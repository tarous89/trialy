aleAndDue(round);\n body+='<div class=\"fr-grid2\"><section class=\"fr-panel fr-pad\"><div class=\"fr-panel-head\"><div><h2>Funnel</h2><p>Opportunities by stage in this round</p></div></div>'+funnel(round)+'</section>'+\n  '<section class=\"fr-panel fr-pad\"><div class=\"fr-panel-head\"><div><h2>Stale and due</h2><p>No activity for more than '+STALE_DAYS+' days, and follow-ups due by '+esc(dateLabel(addDays(AS_OF,6)))+'</p></div></div>'+(sd.length?'<ul class=\"fr-list\">'+sd.slice(0,14).map(x=>'<li><span>'+pill(x.kind==='stale'?'Stale':x.kind==='overdue'?'Overdue':'Due',x.kind==='overdue'?'red':x.kind==='due'?'amber':'')+' <strong>'+esc(x.name)+'</strong><small class=\"fr-sub\">'+esc(x.text)+(x.kind!=='stale'&&x.date?' · '+dateLabel(x.date):'')+'</small></span>'+btn('Open',x.act,'fr-btn small',false,'aria-label=\"Open '+esc(x.name)+'\"')+'</li>').join('')+'</ul>'+(sd.length>14?'<p class=\"fr-muted\">And '+(sd.length-14)+' more on the Activity screen.</p>':''):'<p class=\"fr-muted\">Nothing stale or due.</p>')+'</section></div>';\n body+='<section class=\"fr-panel fr-pad\"><div class=\"fr-panel-head\"><div><h2>Engagement highlights</h2><p>'+esc(ROOM_LINKED?'From the linked Data Room, read-only':'From your own data-room entries')+'</p></div>'+btn('Engagement','nav:engagement','fr-btn small')+'</div>'+(ROOM_STATE==='restricted'?'<p class=\"fr-muted\">'+(ROOM_LINKED?'Data Room data is unavailable.':'Restricted: you cannot read the data-room tables.')+'</p>':SIGNALS.length?'<ul class=\"fr-list\">'+SIGNALS.slice(0,6).map(s=>'<li><span>'+pill(s.kind==='hot'?'Hot':s.kind==='reopened'?'Re-opened':'Never opened',s.kind==='never'?'amber':'green')+' <strong>'+esc(orgName(s.org))+'</strong><small class=\"fr-sub\">'+esc(s.text)+'</small></span></li>').join('')+'</ul>':'<p class=\"fr-muted\">No engagement signals yet.</p>')+'</section>';\n return body;}\n\n/* ---------- Pipeline ---------- */\nfunction pipeline(){\n let body=heading(null,true)+checks();const round=ROUND[st.round]; ion class=\"fr-col\" aria-label=\"'+esc(STAGE_LABEL[s])+'\"><h3>'+esc(STAGE_LABEL[s])+' <span>'+l.length+'</span></h3>'+(l.length?l.map(card).join(''):'<p class=\"fr-muted small\">None</p>')+'</section>';}).join('')+'</div></div>'+partialNote('opps')+'</section>';\n return body;}\nfunction partialNote(role){return '<div class=\"fr-footer\"><span>'+esc(partialLabel(role))+'</span></div>';}\nfunction card(o){const p=PROFILE[o.organization_id]||{},dot=engagementDot(o.organization_id),a=amountOf(o);\n return '<article class=\"fr-card\"><div class=\"fr-card-head\"><strong>'+esc(orgName(o.organization_id))+'</strong>'+(dot?'<span class=\"fr-dot '+dot+'\" role=\"img\" aria-label=\"'+esc(dot==='hot'?'Data room: active this week':dot==='opened'?'Data room: opened':'Data room: access, never opened')+'\" title=\"'+esc(dot==='hot'?'Data room: active this week':dot==='opened'?'Data room: opened':'Data room: access, never opened')+'\"></span>':'')+'</div>'+\n '<div class=\"fr-card-tags\">'+(p.tier?pill('Tier '+p.tier.toUpperCase(),'teal'):'')+pill(cap(o.interest),interestTone(o.interest))+(bool(o.is_lead)?pill('Lead','lead'):'')+'</div>'+\n '<div class=\"fr-card-amt\">'+esc(a===null?'No amount':exactMoney(a,o.currency))+'</div>'+(o.next_step||o.next_due?'<div class=\"fr-card-next\">'+esc(String(o.next_step||'Next step')+(o.next_due?' · '+dateLabel(o.next_due):''))+'</div>':'')+\n '<div class=\"fr-card-actions\">'+btn('Details','details:opps:'+o.id,'fr-btn small',false,'aria-label=\"Details for '+esc(orgName(o.organization_id))+'\"')+btn('Move','move:'+o.id,'fr-btn small',!canWrite('opps'),'aria-label=\"Move '+esc(orgName(o.organization_id))+'\"')+'</div></article>';}\n\n/* ---------- Investors ---------- */\nconst TIER_RANK={a:0,b:1,c:2};const LEAD_RANK={yes:0,sometimes:1,no:2};\nfunction investorRows(){return INVESTOR_ORGS.map(o=>({org:o,p:PROFILE[o.id]||null})).sort((x,y)=>(TIER_RANK[x.p&&x.p.tier]??3)-(TIER_RANK[y.p&&y.p.tier]??3)||(LEAD_RANK[x.p&&x.p.leads_rounds]??3)-(LEAD_RANK[y.p&&y.p.leads_rounds]??3)||String(x.org.data.name||'').localeCompare(String(y.org.data.name||'')));}\nfunction investors(){\n let body=heading(null,true)+checks();const all=investorRows();\n const counts={targets:all.filter(x=>inPipeline(x.org.id)).length,proposed:all.filter(x=>statusOf(x.org.id)==='proposed').length,rejected:all.filter(x=>statusOf(x.org.id)==='rejected').length};\n body+='<div class=\"fr-seg\" role=\"tablist\" aria-label=\"Investor lists\">'+[['targets','Target list'],['proposed','Proposed ('+counts.proposed+')'],['rejected','Rejected ('+counts.rejected+')']].map(x=>btn(esc(x[1]),'inv-tab:'+x[0],'fr-seg-btn',false,'role=\"tab\" aria-selected=\"'+(st.invTab===x[0])+'\"')).join('')+'</div>';\n let rows=all.filter(x=>st.invTab==='targets'?inPipeline(x.org.id):statusOf(x.org.id)===(st.invTab==='proposed'?'proposed':'rejected'));\n const q=st.query.toLowerCase().trim(),f=st.filters;\n if(q)rows=rows.filter(x=>[x.org.data.name,x.p&&x.p.intro_path,x.p&&x.p.notes,x.org.data.country].some(v=>String(v||'').toLowerCase().includes(q)));\n if(f.tier)rows=rows.filter(x=>x.p&&x.p.tier===f.tier);if(f.investor_type)rows=rows.filter(x=>x.p&&x.p.investor_type===f.investor_type);if(f.leads_rounds)rows=rows.filter(x=>x.p&&x.p.leads_rounds===f.leads_rounds);\n for(const k of ['modalities','therapeutic_areas','dev_stages'])if(f[k])rows=rows.filter(x=>x.p&&listOf(x.p[k]).map(v=>v.toLowerCase()).includes(f[k].toLowerCase()));\n const p=paged(rows),cols=visibleCols('investors');\n const intro=st.invTab==='proposed'?'Researched by Claude or ChatGPT with sources and dates. They stay proposed until you accept them; rejected investors never appear in the pipeline.':st.invTab==='rejected'?'Rejected proposals are kept for reference and never appear in the pipeline.':'Ranked by tier, then whether they lead rounds. Investors are shared organizations; their profiles belong to Fundraise.';\n const cell=(k,x)=>{const pr=x.p||{},o=OPPS.find(op=>op.organization_id===x.org.id&&op.round_id===st.round);\n  if(k==='name')return '<td><strong>'+esc(x.org.data.name||'Unnamed')+'</strong><small class=\"fr-sub\">'+esc([x.org.data.country,!x.p?'No profile yet':''].filter(Boolean).join(' · '))+'</small></td>';\n  if(k==='investor_type')return '<td>'+esc(TYPE_LABEL[pr.investor_type]||'—')+'</td>';\n  if(k==='tier')return '<td>'+(pr.tier?pill(pr.tier.toUpperCase(),'teal'):'—')+'</td>';\n  if(k==='fit')return '<td><small>'+esc([pr.modalities,pr.therapeutic_areas,pr.dev_stages].filter(Boolean).join(' · ')||'—')+'</small></td>';\n  if(k==='cheque')return '<td>'+esc(num(pr.check_min)!==null||num(pr.check_max)!==null?money(num(pr.check_min),pr.currency)+' – '+money(num(pr.check_max),''):'—')+'</td>';\n  if(k==='leads_rounds')return '<td>'+esc(cap(pr.leads_rounds||'—'))+'</td>';\n  if(k==='fund_vintage_year')return '<td>'+esc(pr.fund_vintage_year||'—')+'</td>';\n  if(k==='intro_path')return '<td><small>'+esc(pr.intro_path||'—')+'</small></td>';\n  if(k==='in_round')return '<td>'+(o?pill(STAGE_LABEL[o.stage]||o.stage,o.stage==='passed'?'':'blue'):'—')+'</td>';\n  return '<td></td>';};\n const actions=x=>{const id=x.org.id,pr=x.p;if(st.invTab==='proposed')return btn('Accept','decide:'+pr.id+':accepted','fr-btn small',!writableField('profiles','profile_status'))+btn('Reject','decide:'+pr.id+':rejected','fr-btn small danger',!writableField('profiles','profile_status'))+btn('History','details:investor:'+id,'fr-btn small');\n  if(st.invTab==='rejected')return btn('Accept','decide:'+pr.id+':accepted','fr-btn small',!writableField('profiles','profile_status'))+btn('History','details:investor:'+id,'fr-btn small');\n  const inRound=OPPS.some(op=>op.organization_id===id&&op.round_id===st.round);\n  return btn('History','details:investor:'+id,'fr-btn small')+(pr?btn('Edit profile','edit:profiles:'+pr.id,'fr-btn small',!canWrite('profiles')):btn('Add profile','add:profiles:'+id,'fr-btn small',!canWrite('profiles')))+(inRound||!ROUND[st.round]?'':btn('Add to round','add:opps ;const metadata={
  "id": "life.investor-crm",
  "version": "2.0.0",
  "name": "Fundraise",
  "description": "Investor pipeline for a round, from first contact to signed commitment: a ranked target list on shared organizations, a pipeline board by stage, a round thermometer where only signed commitments count as raised, stale and due follow-ups, lead and syndicate, light offer comparison, tranches tied to milestones (published for Runway and Investor Updates), pass-reason patterns and data-room engagement per investor. Data room and milestone data are your own entries until you link Data Room or Programs inside the app.",
  "tags": [
    "biotech",
    "fundraising",
    "investors",
    "pipeline",
    "term-sheet",
    "tranches",
    "data-room",
    "board"
  ],
  "whenToUse": "A small biotech runs a financing round and needs a ranked investor list, pipeline, follow-ups, terms, tranches and data-room engagement in one place: lead first, then syndicate; soft, verbal and signed kept apart; several rounds over time with shared investor history; strategic and pharma investors and public equity funds as investor types.",
  "whenNotToUse": "Investor databases, email campaigns or sending email, cap-table registers, subscription or legal documents, e-signature, fund accounting, post-round investor updates (Investor Updates), deck hosting and view tracking (Data Room), and grants (Grants).",
  "engine": "frontend-js",
  "defaults": {
    "heading": "Fundraise",
    "tableMap": "{}",
    "pageSize": 25,
    "layoutProfile": "{}",
    "readOnly": false,
    "demoLabel": false,
    "asOfOverride": ""
  },
  "options": {
    "heading": {
      "type": "string",
      "description": "App heading shown above every screen.",
      "default": "Fundraise"
    },
    "tableMap": {
      "type": "string",
      "description": "JSON object keyed by stable role key: core data contract v1 roles organizations and people; app roles fundraise.settings, fundraise.investor_profiles, fundraise.rounds, fundraise.opportunities, fundraise.activities and the output fundraise.tranches (fundraise.v1); integrations dataroom.access_grants and dataroom.engagement (dataroom.v1) and programs.plan_items (programs.v2): this app's own tables for manual entry, or the provider's tables read-only (writableFields empty) once linked. Each value is {typeId, fields:{logical:real}, writableFields:[logical]}. Installed by the platform; do not edit by hand.",
      "default": "{}"
    },
    "pageSize": {
      "type": "number",
      "description": "Rows per page in registers, 10–50; the template clamps the value.",
      "default": 25
    },
    "layoutProfile": {
      "type": "string",
      "description": "JSON presentation profile written only by native layout settings through a reviewed, versioned app update.",
      "default": "{}"
    },
    "readOnly": {
      "type": "boolean",
      "description": "When true, the app proposes no writes even for users who may edit.",
      "default": false
    },
    "demoLabel": {
      "type": "boolean",
      "description": "Label the app as a fictional demo. Only for the repository preview.",
      "default": false
    },
    "asOfOverride": {
      "type": "string",
      "description": "Optional fixed as-of date (YYYY-MM-DD) for previews and tests only. Leave empty: the app uses today's date from the app runtime.",
      "default": ""
    }
  },
  "instructions": "Fundraise 2.0.0 (life.investor-crm) is a custom frontend-js fundraising app that follows docs/product/MODULAR_APPS_AND_SHARED_DATA.md: investors and contacts live in the shared organizations and people tables (core data contract v1), Fundraise's own tables use fundraise.* role keys, data another app can provide is an integration (own tables for manual entry, read-only once linked), and removing an app or tab never deletes data. It replaces Investor CRM 1.0.1 as a new major version for new installs; saved 1.0.1 apps are not migrated.\n\n1. Discover and pin. Read read_app_template_guidance (usage, then authoring when extending, and contracts) to the last nextOffset, read_app_design, list_app_templates and read_app_template for life.investor-crm. Pin this exact version and digest and keep one requestKey for the creation.\n2. Install. Before installing, call list_archived_items (kind apps, this templateId); if an archived Fundraise app exists, offer to restore it first. The platform Use action shows the Use existing data? dialog when compatible tables exist: existing organizations and people tables are connected by default; a Data Room provider's dataroom.access_grants/dataroom.engagement tables and Programs' programs.plan_items are connected read-only when the user chooses Connect. Everything not connected gets a new table: Fundraise always works alone. Assistants may prefill the dialog with prepare_data_access but never confirm it. Never seed demo data.\n3. Roles and fields. Core roles use exactly the core contract v1 fields; never rename, retype or remove them. Investors are organizations with org_type investor plus one fundraise.investor_profiles row each. Relationships are scalar record-ID text: organization_id, primary_contact_id, contact_id, round_id, opportunity_id, lead_org_id, milestone_id, grant_id, person_id. fundraise.tranches is published read-only for Runway and Investor Updates (contract fundraise.v1); Fundraise is its single writer.\n4. Build the target list. From the user's own list and research (for example \"funds that led preclinical oncology seeds in the last 18 months\"), propose organizations (org_type investor) and investor profiles with profile_status proposed, source and source_date. Never invent cheque sizes, fund vintages or partners; leave unknown fields empty. Proposed investors stay proposed until the user accepts them in Investors; rejected investors never appear in the pipeline. Deduplicate by organization name and website before proposing.\n5. Pipeline. One fundraise.opportunities row per investor per round (stage, interest none/soft/verbal/signed, amounts, currency, next step, owner). Only signed counts as raised (amount_committed); verbal and soft are shown separately. An amount in another currency than the round is flagged and excluded, never converted. Never mark a commitment signed: the user does.\n6. Activities. Propose fundraise.activities from the user's own connected mail or calendar as source assistant, for review. Every activity save must also set the opportunity's last_activity_on to the activity date when it is later, in the same reviewed batch. Draft follow-up texts only; never send email.\n7. Lead, offers and tranches. Record offers on the opportunity (offer_* fields); the lead is is_lead on one opportunity per round (and lead_org_id on the round). Tranches belong to the round: tranche_no, amount, currency, condition, milestone_id (a programs.plan_items record: the app's own milestone entries, or Programs' plan items once linked), expected_on, status.\n8. Data-room engagement. Without a linked Data Room, record access and views in Fundraise's own dataroom.* tables (typed in, or proposed from DocSend or ShareVault reports the user shares). Once linked, those tables are read-only provider data; give access in the Data Room app.\n9. Integrations. Inside the app a subtle line offers \"Add Data Room\"/\"Add Programs\" when the provider template is available, or \"Use its data\" once a provider is in the workspace, as a data-trialy-integration button; the platform dialog shows both sources and the user chooses one (read_app_integration; the choice is an app-only human action). Own entries stay in Database; nothing is copied or merged.\n10. Customization: layout changes use the native gear (tracker:layout → prepare_tool_layout); business settings (stages, pass reasons, fit vocabularies, stale threshold, default currency) are a reviewed write to the fundraise.settings row; extra fields need a reviewed schema change and a separately reviewed app revision. Revise the same saved app; preserve IDs, bindings and access.\n11. Automations are optional and configured only after the app is saved: a weekly round digest email, a signed commitment notice email and monthly investor research on the Claude or ChatGPT runner. The app never waits for them.\nNever give legal or investment advice. Contacts are professional only.",
  "documentation": {
    "quickStart": [
      "Read the current usage, authoring and contracts guidance and this template's documentation; pin life.investor-crm 2.0.0 and its digest with one requestKey.",
      "Before installing, check for an archived Fundraise app and offer to restore it. Use installs it; keep the default to connect existing organizations and people tables.",
      "Round → New round: name, type, target and currency. Settings: stages, pass reasons, fit vocabularies and the stale threshold.",
      "Investors → Add investor (an organization), then Add profile; or ask Claude or ChatGPT to research and propose investors with sources, then accept or reject them.",
      "Investors → Add to round, then work the Pipeline: Move, Log activity, next steps. Overview shows the thermometer, the funnel and stale and due items.",
      "Round: record offers, compare them, mark the lead, add tranches tied to milestones. Engagement: record data-room access and views, or link a Data Room."
    ],
    "dataContract": "Core data contract v1: organizations (name text*, org_type select company/investor/cro/cdmo/site/funder/partner/agency/other, country, website, archived) and people (name text*, organization_id, title, email, archived). App contract fundraise.v1: fundraise.settings (one row: default_currency select, stale_days number default 14, stages, pass_reasons, modalities, therapeutic_areas, dev_stages as comma lists; stages and pass_reasons are ordered subsets of the schema options); fundraise.investor_profiles (organization_id text*, investor_type select* specialist_ls_vc/generalist_vc/pharma_cvc/strategic/family_office/angel/public_fund/other, tier a/b/c, profile_status select* proposed/accepted/rejected, modalities, therapeutic_areas, dev_stages, check_min money, check_max money, currency, leads_rounds yes/no/sometimes, fund_vintage_year number, intro_path, source, source_date date, notes, archived); fundraise.rounds (name*, round_type* pre_seed/seed/bridge/series_a/series_b/series_c/other, target_amount money, currency*, status* planning/active/closed/abandoned, opened_on, target_close, closed_on, lead_org_id, notes, archived); fundraise.opportunities (round_id*, organization_id*, primary_contact_id, stage* target/contacted/first_meeting/partner_meeting/due_diligence/term_sheet/committed/closed/passed, interest* none/soft/verbal/signed, amount_indicated money, amount_committed money, currency*, is_lead boolean, owner, next_step, next_due date, last_activity_on date, pass_reason select too_early/want_in_vivo_data/want_clinical_data/outside_mandate/cheque_size/valuation/team/competition/timing/other, pass_detail, offer_received_on, offer_amount, offer_pre_money, offer_instrument priced/safe/convertible/other, offer_board_seat boolean, offer_expires_on, offer_status received/negotiating/accepted/declined/expired, offer_notes, cda_status none/sent/signed, cda_signed_on, archived); fundraise.activities (opportunity_id*, contact_id, activity_on date*, kind* email/call/meeting/intro/event/other, summary*, outcome, follow_up_due date, source manual/assistant). Output fundraise.tranches fundraise.v1, exactly the registry entry: round_id text*, tranche_no number*, amount money*, currency select* (USD EUR GBP CHF CAD AUD JPY CNY SEK DKK NOK INR), condition text*, milestone_id text (a programs.plan_items record), expected_on date, status select* expected/met/released/waived/missed. Integrations (optional, integration): dataroom.access_grants and dataroom.engagement, contract dataroom.v1 exactly as the registry (writer: the Data Room app); programs.plan_items, contract programs.v2, binding only name, program_id, item_type, end_date, status, is_key. Unlinked, each is Fundraise's own table (manual entries; program_id holds the program name or code); linked, the provider's table is bound read-only. * = required. All fields scalar (multiple:false); lowercase snake_case keys.",
    "interactionContract": "Seven screens with stable IDs for the native layout gear: overview, pipeline, investors, round, activity, engagement, settings; column groups investors and activity. Overview: round thermometer (signed solid, verbal, soft vs target) and lead badge, KPIs, funnel by stage, stale and due list, engagement highlights. Pipeline: board by stage scrolling horizontally inside its card; cards show investor, tier, interest, amount, next step and an engagement dot; filters tier, investor type, owner, interest; Move opens a reviewed stage/interest edit (passing needs a reason); Details opens the opportunity side panel (contacts, activity, offer, data room). Investors: ranked target list (tier, then lead behaviour), Proposed and Rejected lists with Accept/Reject, Add investor/Add profile, Add to round, history across rounds. Round: settings, syndicate with % of round, offer comparison of up to three offers, tranches with on-track status from the milestone, own milestones or Programs milestones. Activity: log, follow-ups due, pass reasons this round and across rounds. Engagement: access, views, signals and diligence depth; read-only once linked. Settings: business settings, where each kind of data comes from, links to Access and Automations. Integration lines are <button data-trialy-integration=\"install|connect <role>\"> buttons shown only when integrations.list returns an offer; the platform opens the dialog. Every input carries data-ui-state and a stable data-action; drafts are merged into returned state and survive failed proposals. Submits create one records.propose batch (at most 50 writes) of exact changed fields; versions are captured when an editor or confirmation opens. The gear emits tracker:layout. No app login, browser storage, network calls or automation reads.",
    "lifecycle": "A fresh preview renders with no writes. After the app is saved, every create, edit, move, lead change, accept/reject and archive is an exact records.propose batch the user approves in the host review; the app shows a notice until then and the database is unchanged. Saving an activity also updates last_activity_on on its opportunity in the same review. Marking a lead unmarks the previous lead and sets the round's lead in the same review. Versions are captured when the editor or confirmation opens, so a concurrent edit is rejected, not overwritten. The as-of date is today's date from the app runtime and only filters the view (stale, due, signals). Linking a Data Room or Programs inside the app is one reviewed app save by the user; the app's own entries stay in Database and nothing is merged. Archiving or deleting the app archives it and keeps all tables and records; restoring brings its automations back switched off. Removing a tab unbinds it; adding it back reconnects the same tables. Installing again first offers to restore an archived Fundraise app.",
    "limitations": [
      "No investor database: investors come from your own list and assistant research with sources.",
      "No email sending, deck hosting, e-signature, cap table or subscription documents; post-round updates belong to Investor Updates.",
      "Amounts in another currency than the round are excluded from totals until an fx-rates output role is published; nothing is converted.",
      "Days in stage use the last logged activity: record history is not available to the app. Diligence depth counts documents viewed; the shared-document count is not part of dataroom.v1.",
      "Reads are bounded to 800 rows per table; partial reads disable totals and say so. App-level access only: share investor data explicitly, read-only where appropriate.",
      "\"Add Data Room\" appears only once a Data Room template is approved in the catalog; until then, record access by hand or link a custom app that provides dataroom.v1."
    ],
    "examples": [
      {
        "prompt": "Start our seed round (fictional): EUR 15M target, close by March. Build a target list of specialist life-science funds that led preclinical oncology seeds in the last 18 months.",
        "expectedBehavior": "Pins the template, installs the app (connecting existing organizations and people), proposes the round, then organizations and investor profiles with profile_status proposed, source and date, for review. Invents no cheque sizes."
      },
      {
        "prompt": "Log yesterday's partner meeting with Northlake Bio Ventures from my calendar and set a follow-up for Friday.",
        "expectedBehavior": "Proposes one fundraise.activities record (source assistant, follow_up_due Friday) and the opportunity's last_activity_on in the same reviewed batch."
      },
      {
        "prompt": "How much have we raised?",
        "expectedBehavior": "Reports signed commitments only, in the round currency, with verbal and soft separately and any other-currency amounts flagged as excluded."
      },
      {
        "prompt": "Draft this week's round update for the board.",
        "expectedBehavior": "Drafts text from raised/verbal/soft vs target, lead status, stale and due items and engagement highlights; sends nothing."
      },
      {
        "prompt": "We have no automation. How do I keep follow-ups on track?",
        "expectedBehavior": "Explains Overview stale and due and Activity follow-ups; no automation is required."
      }
    ],
    "tasks": {
      "mode": "optional",
      "whenUseful": "Three optional automations; no automation is a fully supported path. (1) Weekly round digest: a TrialAgents email action every Monday 08:00 Europe/Berlin to the app owner: raised, verbal and soft vs target, lead status, stale and due items, engagement highlights when available. (2) Signed commitment notice: a TrialAgents email action triggered when fundraise.opportunities.interest becomes signed, to the owner. (3) Investor research on the shared Claude or ChatGPT runner, monthly or on request: from the round's fit criteria, proposes new organizations and fundraise.investor_profiles with profile_status proposed, source and source_date, deduplicated by organization name and website, writing only those roles under a narrow expiring grant, or proposing for review. Manual path: the team checks Overview stale and due and Activity follow-ups.",
      "readRequirements": "Digest: fundraise.rounds (active round), fundraise.opportunities (interest, amounts, currency, is_lead, stage, offer_status, last_activity_on, next_due), fundraise.activities (follow_up_due), fundraise.settings.stale_days, dataroom.engagement when readable. Signed notice: fundraise.opportunities (organization_id, round_id, amount_committed, currency) and organizations.name. Research: fundraise.settings vocabularies, existing organizations (name, website) and fundraise.investor_profiles for deduplication.",
      "outputContract": "Digest: one email per week; totals only from complete reads, otherwise the email says the data was partial and withholds totals. Signed notice: one email per opportunity that becomes signed. Research: new organizations (org_type investor) and investor profiles with profile_status proposed, source and source_date only; never updates accepted or rejected profiles, never changes opportunities; reports no_update when nothing new is found.",
      "promptExample": "Monthly (Europe/Berlin, first Monday 09:00): read Fundraise settings (modalities, therapeutic_areas, dev_stages) and the active round. Search public sources for investors that led or co-led rounds matching those criteria in the last 18 months. For each new fund not already in organizations (match by name and website), propose an organizations record {name, org_type: investor, country, website} and a fundraise.investor_profiles record {organization_id, investor_type, profile_status: proposed, modalities, therapeutic_areas, dev_stages, leads_rounds, source: the URL, source_date: today}. Leave cheque size and vintage empty unless the source states them. If nothing new, report no_update."
    }

function eventFor(kind,target){const trigger=target.closest('[data-action]');if(!trigger)return;const form=trigger.closest('form');dispatch({kind,action:trigger.dataset.action,value:target.type==='checkbox'?target.checked:target.value??null,form:form?Object.fromEntries(new FormData(form)):{}});}
