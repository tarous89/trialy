'%');\n return 'Unknown change';}\nfunction adoptionPlan(sc){\n const D=applyChanges(BASE,sc.changes),out=[],skipped=[];const keysOf={lines:['start_month','end_month','amount'],positions:['start_month','end_month','annual_salary'],milestones:['target_month']};\n for(const role of ['lines','positions','milestones']){for(const x of D[role]){if(x._new)continue;const tr=role==='milestones'?x._role||'milestones':role,m=roleMap[tr],realKey=k=>tr==='programItems'&&k==='target_month'?'end_date':k;if(!m)continue;if(role==='milestones'&&x._source&&x._source!=='runway'&&x._source!=='link_unavailable'){if(x.target_month!==(BASE.milestones.find(o=>o.id===x.id)||{}).target_month)skipped.push('“'+String(x.name||'Milestone')+'” is owned by the Programs app; change its date there.');continue;}const orig=BASE[role].find(o=>o.id===x.id);if(!orig)continue;const data={};\n  if(x._drop){if(!m.fields.archived)throw Error('Adopting this scenario needs the archived field on '+ROLE_LABEL[tr]+'s.');data[m.fields.archived]=true;}\n  for(const k of keysOf[role]){if(String(x[k]??'')!==String(orig[k]??'')){if(!m.fields[realKey(k)])throw Error('Field '+k+' is not bound.');data[m.fields[realKey(k)]]=x[k]===''?null:x[k];}}\n  if(Object.keys(data).length)out.push({kind:'update_record',recordId:x.id,expectedVersion:orig.version,data});}}\n for(const x of D.lines.filter(l=>l._new))out.push({kind:'create_record',typeId:roleMap.lines.typeId,data:toReal('lines',pick(x,['name','direction','category','program_id','counterparty_id','agreement_id','driver','amount','currency','start_month','end_month','status','cash_in_type','notes']))});\n for(const x of D.positions.filter(p=>p._new))out.push({kind:'create_record',typeId:roleMap.positions.typeId,data:toReal('positions',{title:x.title,program_id:x.program_id||null,start_month:x.start_month,annual_salary:x.annual_salary,currency:x.currency,status:'planned',archived:false})});\n for(const c of sc.changes)if(c.kind==='fx_shift')skipped.push(describe(c)+' is an a " fill=\"#5B6B7C\" font-size=\"11\">'+esc(compact(v))+'</text>';}\n cols.forEach((x,i)=>{let y=0;const x0=l+i*bw+bw*0.18,ww=bw*0.64;for(const c of cats){const v=x.spend[c]||0;if(!v)continue;const y1=yy(y+v),y0=yy(y);out+='<rect x=\"'+x0.toFixed(1)+'\" y=\"'+y1.toFixed(1)+'\" width=\"'+ww.toFixed(1)+'\" height=\"'+Math.max(0,y0-y1).toFixed(1)+'\" fill=\"'+catColor(c)+'\"'+(x.forecast?' opacity=\"0.55\"':'')+'><title>'+esc(c+' · '+monthLabel(x.m)+' · '+money(v)+(x.forecast?' (forecast)':' (actual)'))+'</title></rect>';y+=v;}\n  if(x.forecast)out+='<rect x=\"'+x0.toFixed(1)+'\" y=\"'+yy(y).toFixed(1)+'\" width=\"'+ww.toFixed(1)+'\" height=\"'+Math.max(0,yy(0)-yy(y)).toFixed(1)+'\" fill=\"none\" stroke=\"#5B6B7C\" stroke-dasharray=\"3 3\"/>';\n  if(i%Math.max(1,Math.ceil(cols.length/9))===0)out+='<text x=\"'+(x0+ww/2).toFixed(1)+'\" y=\"'+(h-18)+'\" text-anchor=\"middle\" fill=\"#5B6B7C\" font-size=\"11\">'+esc(shortMonth(x.m))+'</text>';});\n const split=cols.findIndex(x=>x.forecast);if(split>0)out+='<line x1=\"'+(l+split*bw).toFixed(1)+'\" x2=\"'+(l+split*bw).toFixed(1)+'\" y1=\"'+t+'\" y2=\"'+(h-b)+'\" stroke=\"#9AA7B4\" stroke-dasharray=\"2 4\"/><text x=\"'+(l+split*bw+4).toFixed(1)+'\" y=\"'+(t+10)+'\" fill=\"#5B6B7C\" font-size=\"10\">Forecast</text>';\n const legend='<div class=\"rw-legend\">'+cats.map(c=>'<span><i style=\"background:'+catColor(c)+'\"></i>'+esc(c)+'</span>').join('')+'<span><i class=\"dash\"></i>Forecast (lighter, dashed outline)</span></div>';\n return '<svg class=\"rw-chart\" viewBox=\"0 0 '+w+' '+h+'\" role=\"img\" aria-label=\"Monthly spend by category in '+esc(C2)+': actual months solid, forecast months lighter with a dashed outline.\">'+out+'</svg>'+legend+tableFallback('Monthly spend by category ('+C2+')',['Month','Type'].concat(cats).concat(['Net burn']),cols.map((x,i)=>[monthLabel(x.m),x.forecast?'Forecast':'Actual'].concat(cats.map(c=>grouped(Math.round(x.spend[c]||0)))).concat([grouped(Math.round(tot[i]))])));\n}\n\n/* ---------- screens ---------- */\nfunction kpi(title,value,foot,tone){return '<div class=\"rw-kpi '+(tone||'')+'\"><div class=\"rw-kpi-label\">'+esc(title)+'</div><div class=\"rw-kpi-value\">'+esc(value)+'</div><div class=\"rw-kpi-foot\">'+esc(foot||'')+'</div></div>';}\nfunction sentence(m){\n if(!m.runway)return '';const r=m.runway;\n if(r.beyond)return 'Cash lasts beyond '+monthLabel(r.lastsUntil)+', the end of the '+HORIZON+'-month forecast.';\n const reached=m.milestones.filter(x=>!x.passed&&x.m<=r.lastsUntil),next=m.milestones.find(x=>!x.passed&&x.m>r.lastsUntil);\n if(reached.length){const x=reached[reached.length-1],gap=diffMonths(x.m,r.lastsUntil);return 'Cash lasts until '+monthLabel(r.lastsUntil)+(gap?', '+plural(gap,'month')+' after '+x.name+'.':', the month of '+x.name+'.');}\n if(next)return 'Cash lasts until '+monthLabel(r.lastsUntil)+', '+plural(diffMonths(r.lastsUntil,next.m),'month')+' before '+next.name+'.';\n return 'Cash lasts until '+monthLabel(r.lastsUntil)+'.';}\nfunction snapshotHero(){if(!latestSnap)return '<div class=\"rw-hero\"><div class=\"rw-hero-over\">Runway</div><div class=\"rw-hero-sentence\">Live runway is not available to you, and no approved snapshot exists yet.</div></div>';const s=latestSnap.m;\n return '<div class=\"rw-hero\"><div class=\"rw-hero-over\">Approved snapshot · '+esc(monthLabel(s.asOf))+'</div><div class=\"rw-hero-sentence\">'+esc(s.runway.beyond?'Cash lasted beyond the forecast horizon at the '+monthLabel(s.asOf)+' close.':'At the '+monthLabel(s.asOf)+' close, cash lasted until '+monthLabel(s.runway.lastsUntil)+' ('+plural(s.runway.months,'month')+').')+'</div><div class=\"rw-hero-foot\"><span>Live people cost: <strong>restricted</strong></span><span>Cash-out <strong>'+esc(s.runway.cashOut?monthLabel(s.runway.cashOut):'beyond horizon')+'</strong></span><span>Start raise <strong>'+esc(s.runway.startRaise?monthLabel(s.runway.startRaise):'—')+'</strong></span></div></div>';}\nfunction overview(){\n let body=heading()+checks();\n if(!exact&&salaryBlock){body+=snapshotHero()+snapshotsPanel(true);return body;}\n if(!model.ready){return body+'<section class=\"rw-panel rw-pad\"><div class=\"rw-empty\"><strong>Set up your first runway</strong><p>Enter the bank balance and date and the reporting currency in Settings, then add a few spend lines and one financing event in Plan.</p>'+btn('Open Settings','nav:settings','rw-btn rw-btn-primary')+'</div></section>';}\n const r=model.runway,rc=model.runwayC;\n body+='<div class=\"rw-hero\"><div class=\"rw-hero-over\">Runway · as of '+esc(monthLabel(model.A))+(exact?'':' · provisional')+'</div><div class=\"rw-hero-sentence\">'+esc(sentence(model))+'</div><div class=\"rw-hero-foot\"><span>Cash now <strong>'+esc(money(model.start))+'</strong></span><span>With contingent cash <strong>'+esc(runwayText(rc))+'</strong></span><span>Trailing runway <strong>'+esc(model.trailing&&model.trailing.months!==null?grouped(model.trailing.months,1)+' months':'needs '+trailingN+' closed months')+'</strong></span></div></div>';\n body+='<div class=\"rw-kpis\">'+kpi('Runway',runwayText(r),'Target '+target+' months · committed and received cash only',!r.beyond&&r.months<target?'bad':'')+kpi('Cash-out month',r.beyond?'Beyond '+monthLabel(r.lastsUntil):monthLabel(r.cashOut),'First month forecast cash falls below zero')+kpi('Start raising by',r.beyond?'—':monthLabel(r.startRaise),'First month with less than '+target+' months of runway left')+'</div>';\n const base={label:'Forecast',color:'#175B94',points:model.months.map(x=>({m:x.m,cash:x.close}))},cont={label:'With contingent cash',color:'#2E8B9A',dash:'2 5',points:model.months.map(x=>({m:x.m,cash:x.closeCont}))};\n body+='<section class=\"rw-panel rw-pad\"><div class=\"rw-panel-head\"><div><h2>Cash curve</h2><p>Closing cash by month · '+esc(C2)+' · as of '+esc(monthLabel(model.A))+' · next '+CHART_MONTHS+' months</p></div></div>'+cashChart([base,cont],{history:model.history,milestones:model.milestones.filter(x=>!x.passed)})+'<div class=\"rw-legend\"><span><i class=\"solid\"></i>Actual cash</span><span><i class=\"dot\"></i>Forecast (dotted)</span><span><i class=\"dot teal\"></i>Including contingent cash</span>'+(reserve?'<span><i class=\"reserve\"></i>Minimum reserve</span>':'')+'<span><i class=\"ms green\"></i>Cushion ≥ 6 months</span><span><i class=\"ms amber\"></i>3–6</span><span><i class=\"ms red\"></i>&lt; 3</span></div>'+tableFallback('Closing cash ('+C2+')',['Month','Forecast','With contingent'],model.history.slice(-6).map(hh=>[monthLabel(hh.m)+' (actual)',grouped(Math.round(hh.cash)),'']).concat(model.months.slice(0,CHART_MONTHS).map(x=>[monthLabel(x.m),grouped(Math.round(x.close)),grouped(Math.round(x.closeCont))])))+'</section>';\n const past=model.history.filter(x=>x.source==='close').slice(-6).map(x=>({m:x.m,...model.actualMonth(x.m),forecast:false})),fut=model.months.slice(0,12).map(x=>({m:x.m,spend:x.spend,opIn:x.opIn,forecast:true}));\n body+='<section class=\"rw-panel rw-pad\"><div class=\"rw-panel-head\"><div><h2>Monthly burn by category</h2><p>Spend by category · '+esc(C2)+' · actual closed months, then the next 12 forecast months</p></div></div>'+burnChart(past.concat(fut))+'</section>';\n const br=bridge();const ms=model.milestones.filter(x=>!x.passed);\n body+='<div class=\"rw-grid2\"><section class=\"rw-panel rw-pad\"><div class=\"rw-panel-head\"><div><h2>Why runway changed</h2><p>'+(br&&!br.unavailable?'Since the '+esc(monthLabel(br.asOf))+' snapshot':'Since the last snapshot')+'</p></div>'+(br&&!br.unavailable?pill(signed(br.total)+' months',br.total<0?'red':br.total>0?'green':''):'')+'</div>'+(br?br.unavailable?'<p class=\"rw-muted\">The last snapshot is too old to compare month by month.</p>':'<ul class=\"rw-list\">'+br.parts.map(p=>'<li><span>'+esc(p.label)+'</span><strong class=\"'+(p.v<0?'neg':p.v>0?'pos':'')+'\">'+esc(signed(p.v))+' months</strong></li>').join('')+'<li class=\"total\"><span>Runway '+esc(runwayText(br.from))+' → '+esc(runwayText(br.to))+'</span><strong>'+esc(signed(br.total))+' months</strong></li></ul>'+(br.capped?'<p class=\"rw-muted\">At least one runway reaches the '+HORIZON+'-month horizon, so the change may be larger.</p>':''):'<p class=\"rw-muted\">Close a month to freeze the first snapshot. The bridge then explains each change.</p>')+'</section>';\n const ex=exceptions();\n body+='<section class=\"rw-panel rw-pad\"><div class=\"rw-panel-head\"><div><h2>Exceptions</h2><p>Items that need attention before relying on the numbers</p></div>'+pill(ex.length?String(ex.length):'None',ex.length?'amber':'green')+'</div>'+(ex.length?'<ul class=\"rw-list\">'+ex.map(e=>'<li><span>'+esc(e[0])+'</span>'+(e[1]?btn(esc(e[2]),e[1],'rw-link'):'')+'</li>').join('')+'</ul>':'<p class=\"rw-muted\">No open exceptions.</p>')+'</section></div>';\n if(!ms.length&&PROGRAMS_LINK!=='ok')body+='<section class=\"rw-panel rw-pad\"><h2>Cash at milestones</h2>'+programsLinkNote()+'</section>';\n if(ms.length)body+='<section class=\"rw-panel\"><div class=\"rw-pad\"><div class=\"rw-panel-head\"><div><h2>Cash at milestones</h2><p>Forecast closing cash in the milestone month and cushion to '+(reserve?'the minimum reserve':'cash-out')+'</p></div></div></div><div class=\"rw-scroll\" role=\"region\" aria-label=\"Cash at milestones\" tabindex=\"0\"><table class=\"rw-table\"><thead><tr><th scope=\"col\">Milestone</th><th scope=\"col\">Program</th><th scope=\"col\">Month</th><th scope=\"col\" class=\"num\">Cash</th><th scope=\"col\">Cushion</th><th scope=\"col\">Source</th></tr></thead><tbody>'+ms.map(x=>'<tr><td><strong>'+esc(x.name)+'</strong></td><td>'+esc(progName(x.program))+'</td><td>'+esc(monthLabel(x.m))+'</td><td class=\"num\">'+esc(money(x.cash))+'</td><td>'+pill(cushionText(x.cushion),cushionTone(x.cushion))+'</td><td>'+esc(SOURCE_LABEL[x.source]||'Runway')+'</td></tr>').join('')+'</tbody></table></div>'+(programsLinkNote()?'<div class=\"rw-pad rw-pad-top0\">'+programsLinkNote()+'</div>':'')+'</section>';\n return body;}\nfunction exceptions(){const ex=[];const next=addMonths(model.A,1);\n if(model.A&&BASE.actuals.some(a=>ym(a.month)===next))ex.push([monthLabel(next)+' has actuals but is not closed.','nav:actuals','Close month']);\n for(const w of model.warns.filter(w=>/is not closed\\./.test(w)))ex.push([w,'nav:actuals','Actuals']);\n if(model.excluded.length)ex.push([excludedText(model.excluded),'nav:settings','Add rates']);\n if(st.preview&&st.preview.changes.length)ex.push(['Unsaved scenario preview “'+st.preview.name+'”.','nav:scenarios','Review']);\n const out=scenarioList.filter(s=>s.status==='saved'&&s.outdated);if(out.length)ex.push([plural(out.length,'saved scenario')+' outdated by forecast changes.','nav:scenarios','Review']);\n if(model.runway&&!model.runway.beyond&&model.runway.months<target)ex.push(['Runway is below the '+target+'-month target.','nav:scenarios','What-if']);\n return ex;}\n\n/* registers */\nfunction filtered(role,rows,fields){const q=st.query.toLowerCase().trim();let out=rows;\n if(q)out=out.filter(r=>fields.some(k=>String(k==='program_id'?progName(r.data[k]):r.data[k]??'').toLowerCase().includes(q)));\n for(const [k,v] of Object.entries(st.filters))if(v)out=out.filter(r=>String(r.data[k]??'')===v);return out;}\nfunction paged(items,per){per=per||Math.min(50,Math.max(10,num(cfg.pageSize,25)||25));const max=Math.max(0,Math.ceil(items.length/per)-1);st.page=Math.min(st.page,max);return {slice:items.slice(st.page*per,(st.page+1)*per),page:st.page,max,total:items.length,per};}\nfunction pager(p,scope){return '<div class=\"rw-footer\"><span>'+(p.total?'Showing '+(p.page*p.per+1)+'–'+Math.min(p.total,(p.page+1)*p.per)+' of '+p.total:'No rows')+(scope?' · '+esc(scope):'')+'</span><span class=\"rw-pager\">'+btn('Previous','prev-page','rw-btn small',p.page===0)+'<span>Page '+(p.page+1)+' of '+(p.max+1)+'</span>'+btn('Next','next-page','rw-btn small',p.page>=p.max)+'</span></div>';}\nfunction toolbar(role,addLabel,filters){filters=filters.filter(f=>f.options.length);const ac   "id": "life.cash-runway",
  "version": "2.2.0",
  "name": "Runway",
  "description": "Cash, burn and runway by program, with what-if scenarios. One live forecast from spend and cash-in lines, people and milestones; a locked budget per year; monthly close with variance and frozen snapshots; 12 currencies with monthly rates. Claude and ChatGPT can run every action through app commands.",

  "whenToUse": "A small biotech (roughly 10–50 people) needs cash runway, burn, budget versus actual and what-ifs by program without an ERP: how long the cash lasts, whether it reaches the next milestone, when to start raising, and a clean monthly picture for the board.",
  "whenNotToUse": "General ledger or bookkeeping, payroll, three-statement reporting, revenue/AR/AP or debt modelling, consolidation, 13-week cash, tax-credit calculation, cap table or dilution, bank or accounting connectors, and any patient-level data.",

  "instructions": "Runway 2.2.0 is a custom frontend-js finance app that follows docs/product/MODULAR_APPS_AND_SHARED_DATA.md and the Runway 2.2.0 scope (RUNWAY.md §14). Saved 1.x, 2.0 and 2.1 apps are not migrated.\n\n1. Discover and pin. Read read_app_template_guidance (usage, then authoring when extending) to the last nextOffset, read_app_design, list_app_templates and read_app_template for life.cash-runway. Pin this exact version and digest and keep one requestKey.\n2. Install. Before installing, call list_archived_items (kind apps, this templateId) and offer to restore an archived Runway first. The platform Use action shows the Use existing data? dialog: it connects existing programs, organizations and agreements tables by default (core.v1; reuse, never copy) and offers the recommended automations, all selected. You may prefill it with prepare_data_access; only the signed-in owner confirms it. Never seed demo data.\n3. Control the app through its commands. When app commands are available, list_app_commands returns every action a person can take by clicking. Use run_app_command: read commands (summary.read, cashflow.read, scenario.evaluate, scenario.compare, variance.read, bridge.read, sources.read, schema.describe) return Runway's own results; never compute runway, burn or cash yourself. Propose and layout commands return the exact change a click would make as a review: show it to the user and confirm with confirm_workspace_change only after they agree. Without app commands, prepare reviewed record changes with prepare_change on the bound tables, and leave month closes, budget locks and adoption to the user in the app.\n4. First runway in one session. Ask for the bank balance and its month-end date, the reporting currency, programs and next milestones, the main spend lines and expected financing. Then settings.save, program.save, line.save, position.save, milestone.save and fx.save (rates for every non-reporting currency), each reviewed.\n5. Monthly close. From a P&L or bank statement the user shares, map lines to categories, ask when a line is ambiguous, then month.close with the closing balance, actuals by category and commentary. The app computes and freezes the snapshot; you never write metrics.\n6. What-ifs. Translate plain language into changes (shift_program, scale_program, stop_program, add_position, remove_position, move_cash_in, resize_cash_in, fx_shift, add_line, stop_line, shift_line, scale_line, scale_category, shift_position, change_salary) and run scenario.evaluate to report the app's figures. Save only when asked: scenario.save with status draft leaves it for the user to open, status saved makes it adoptable; scenario.adopt only on an explicit request.\n7. Customize. Screens, columns and form fields (order, hidden optional fields, labels, defaults) with layout.save. Categories with category.add or category.hide; a new custom category also needs the reviewed schema change the command returns (add the select option on plan lines and actuals; workspace owner). A new field: a reviewed schema change on the table, then a reviewed app revision that binds it and lists it in tableMap extraFields (and writableExtra); the form shows it without code changes. Code changes (theme, charts, screens) use begin_app_update and keep role keys, the runway.month_closes runway.v2 contract, the calculation rules, frozen fields, data-ui-state and appCommands.\n8. Integrations. Programs milestones, CRO Selection awards, Contracts payment obligations and Fundraise tranches are integrations: Runway keeps its own entries until the user chooses Use its data inside the app (a human-only platform dialog). Linked data is read only here; to change it, work in the app that writes it (the role_read_only error names it). Add to plan (source.add_to_plan) copies amounts into plan lines; source.update_line applies a changed source after review.\n9. Automations. Four recommendations are offered at install: runway alert email, month-close reminder, monthly exchange rates (research that saves only new runway.fx_rates rows under the bounded write permission approved with it), and the monthly runway digest email built from the frozen snapshot. Zero automations is supported; the app never waits for them.\n10. Never compute or overwrite results, never treat contingent cash as committed, never give accounting, tax or investment advice, and never write without the user's review except within an approved automation's bounded permission.",
  "documentation": {
    "quickStart": [
      "Read the current usage/authoring guidance and this template's documentation; pin life.cash-runway 2.2.0 and its digest with one requestKey.",
      "Before installing, check for an archived Runway app and offer to restore it. Install with Use: the Use existing data? dialog connects existing programs, organizations and agreements tables and offers the recommended automations.",
      "Settings → Create settings (or settings.save): reporting currency, opening bank balance and its month-end date, runway target (default 18 months), trailing window (3 or 6), minimum reserve, loaded-cost %.",
      "Settings → Programs and FX rates: add programs, and a monthly rate (units per 1 EUR) for every currency other than the reporting currency, including the reporting currency itself when it is not EUR.",
      "Plan → add spend and cash-in lines, payment schedules and milestones; Plan → From other sources adds CRO commitments, contract payments and expected financing to the plan. People → add current roles and planned hires.",
      "Overview shows the runway sentence, cash curve, burn and exceptions. Each month: Actuals → Close month. Plan → Budgets → Lock as budget once per year to get variance.",
      "Assistants: list_app_commands, then run_app_command for any of these steps; read commands return Runway's own figures, and every change is a review the user confirms."
    ],
    "dataContract": "Stable role keys: runway.settings (one row: reporting_currency select of 12 currencies; enabled_currencies text comma list; runway_target_months number, default 18; trailing_window_months number 3 or 6; min_cash_reserve money; loaded_cost_pct number; opening_balance money in the reporting currency; opening_date date, the month-end of the opening balance; categories text comma list ordering the spend categories). runway.plan_lines ( name text*, direction select spend/cash_in*, category select Clinical/CMC/Research/People/G&A/Facilities/Other*, program_id text record ID, counterparty_id text record ID, agreement_id text record ID, schedule_group text, driver select monthly/one_off/spread*, amount money* non-negative, currency select*, start_month date*, end_month date (inclusive), status select committed/discretionary/contingent/received*, cash_in_type select equity/grant/partnership/tax_credit/other (required for cash_in), notes text, source_role text, source_record_id text, source_version text (set by Add to plan), archived boolean). runway.positions (title*, program_id, start_month*, end_month, annual_salary money*, currency*, status current/planned*, person_id text, archived). runway.actuals (month*, category*, program_id, direction*, amount*, currency*, cash_in_type, note). runway.month_closes, an app output for other apps (month*, closing_balance money*, currency*, closed boolean, commentary text, runway_months number, cash_out_month date, runway_status select ok/below_target, metrics text frozen JSON, rates_used text frozen JSON, closed_at date). runway.budgets (name*, year number*, locked_on date*, currency*, totals text frozen JSON, rates_used text frozen JSON, notes). runway.scenarios (name*, status draft/saved/adopted/archived*, changes_json text (the scenario's changes, written by the app), based_on_close date, based_on_version text forecast fingerprint (saved scenarios only), created_on date, summary text). runway.fx_rates (month*, currency*, rate_per_eur number*, source ecb/manual*, source_ref text). Core contract v1 (shared workspace tables, one per role): programs (name*, code, indication, modality, stage*, lead, status, archived; health fields are owned by the Programs app), organizations (name*, org_type, country, website, archived), agreements (name*, counterparty_id, agreement_type, status, effective_date, expiry_date, archived). Integrations (Runway's own table until the user links the provider inside the app; then read only): programs.plan_items programs.v2 (Runway's milestone list: name*, program_id, item_type, end_date* target month, status, is_key, archived; or the Programs app's key milestones), croselection.awards croselection.v1 (organization_id, service_type*, program_id, total, currency*, start_date, duration_months, decided_on*, agreement_id), contracts.obligations contracts.v1 (title*, agreement_id, kind*, direction*, due_date, recurrence, amount, currency, status*, verified, archived; only open payment obligations are offered, and only verified ones when linked), fundraise.tranches fundraise.v1 (tranche_no*, amount*, currency*, condition*, expected_on, status*). * = required. All fields are scalar (multiple:false); months are stored as the first day of the month; relationships are record IDs, never names.\n\nCalculations (deterministic, in the app, no clock): the as-of month is the latest closed month, or the opening month. Cash starts from the opening balance, then each confirmed close. monthly = amount every month from start to end; one_off = amount in the start month; spread = amount ÷ months from start to end inclusive. People cost = annual_salary ÷ 12 × (1 + loaded_cost_pct/100) for active months. Amounts convert through EUR cross-rates: closed months use their own month's rate, future months the latest available rate; a missing rate flags and excludes the row. Net burn = spend − operating cash in (cash_in_type other); equity, grants, partnership and tax credits are financing. Runway = full months after the as-of month with forecast closing cash ≥ 0, counting committed and received cash in; a second value adds contingent. Cash-out month = first month below zero. Start-raise = first month with less than the target runway left. Cushion = months of cash after a milestone (to the reserve when one is set). Variance = actual − budget by month and category (and program where coded). The runway bridge splits the change since the last snapshot into closed months, spend lines, people and cash-in; the parts add up to the total.\n\nAccess: Runway is a custom app with app-level access only; per-tab restrictions are not advertised. Restrict positions.annual_salary with a database column restriction for anyone who should not see pay: live people cost and live runway then show restricted, and snapshots still show the approved runway. Missing partners: without programs, program breakdowns hide with a note and totals are unaffected; without programs.plan_items, only Runway milestones are used; references to archived, deleted or unreadable records show as unavailable and are kept on edit. Reads are bounded (up to 800 rows per table, 88 reads per render); partial, unavailable or unbound tables withhold exact totals. Categories: settings.categories lists the shown categories in order; names beyond Clinical, CMC, Research, People, G&A, Facilities and Other are custom (the select option is added by a reviewed schema change); People and Other always exist; hidden categories still count.",
    "interactionContract": "Seven screens with stable IDs for the native layout gear: overview, cash_flow, plan, people, scenarios, actuals, settings. Overview: runway sentence, runway months, cash-out and start-raise dates, cash curve (actual solid, forecast dotted, contingent dotted, reserve line, milestone markers green ≥ 6 months, amber 3–6, red < 3), monthly burn by category (separate chart), the bridge since the last snapshot and exceptions; every chart has a data-table fallback. Cash flow: monthly table (opening, cash in, spend by category or category × program, net burn, closing), source switch (live forecast, preview, saved scenarios, locked budgets), include-contingent toggle, cell drill-down to the lines behind it, and Export CSV as copyable text. Plan: lines register with search, Filters (direction, status, category, program), 25 rows per page, Details side panel, Edit, Duplicate and Archive, Source changed flags; From other sources (commitments, contract payments, expected financing) with Add to plan and Update line; payment schedule form; milestones (Runway's own list, or Programs key milestones read only with Edit in Programs); Lock as budget. People: roles and hires register, headcount and people cost by program for 12 months, runway effect shown in the editor before saving and in the archive confirmation. Scenarios: build a preview with any of 15 change kinds (nothing stored), save it in one review, open drafts left by an assistant, copy, compare 2–4 side by side with an overlay chart, adopt (versions captured when the confirmation opens; stale records are rejected), archive. Actuals: months with open/closed status, Close month (bank balance, actuals by category, cash received, commentary), variance against the locked budget, snapshots opened read-only, commentary edits. Settings: settings form, FX rates, programs, organizations, and pointers to platform Access and Automations. Every input carries data-ui-state and a stable data-action; drafts survive re-renders and failed proposals; Save is visible from the start and enabled only with changes. All writes are records.propose changes approved in the trusted TrialAgents review. Overview's cash-at-milestone table labels each milestone's source (Runway, Programs app, linked, or Programs link unavailable). App commands (appCommands, 37 commands) run the same handlers as these controls: read commands return the app's results; propose and layout commands return the click path's exact review. Layout groups line_form, position_form, milestone_form, actual_form and settings_form order and hide optional form fields; layout.save also sets field labels and defaults.",
    "lifecycle": "A fresh preview renders with no writes. After the app is saved, every create, edit, archive, close, lock, scenario save and adoption is an exact records.propose batch that the user approves in the host review; the app shows a notice until then and the database is unchanged. Edits and archives carry the record version captured when the editor or confirmation opened, so concurrent changes fail instead of being overwritten, and the draft is kept. Closing a month writes the actuals and one month_closes record whose metrics JSON is frozen; budgets are frozen at lock; neither is edited later (only close commentary can change). Scenario previews live only in UI state. A scenario is one record with its changes; a saved scenario is flagged Outdated when lines, positions, milestones, settings, closes or rates change after it was saved, and must be re-saved before adoption. Drafts (left by an assistant) are never Outdated and cannot be adopted until saved. Lines added from another source keep its record ID and version; a later source change is flagged and applied only by a reviewed update. Reviewed layout changes persist only presentation configuration and are re-read on every render. Revisions keep the same app ID, bindings and access. Catalog updates never migrate saved apps. Removing the app archives it and keeps every table and record; restoring brings it back with its bindings and automations switched off. Reinstalling first offers to restore the archived app. Removing a binding (for example programs.plan_items) only unbinds; re-adding it reconnects the same table.",
    "limitations": [
      "No accounting, bank or payroll connectors and no file parsers; actuals are typed in or proposed by an assistant from a document the user shares.",
      "Monthly granularity only; no 13-week cash view, revenue, AR/AP, debt, deferred revenue or three-statement model.",
      "App-level access only: per-screen restrictions are not supported for this custom app. Protect salaries with the database column restriction.",
      "Export CSV shows copyable CSV text; custom apps cannot start a file download yet. Database tables also offer CSV download in TrialAgents.",
