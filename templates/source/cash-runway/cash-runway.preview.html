ed?firstOf(model.A):null,based_on_version:saved?FP:null};\n if(draft)propose([{kind:'update_record',recordId:draft.id,expectedVersion:draft.version,data:toReal('scenarios',data)}],'Scenario “'+name+'” saved'+(saved?'; it can now be adopted.':' as a draft.'));\n else propose([{kind:'create_record',typeId:roleMap.scenarios.typeId,data:toReal('scenarios',data)}],(saved?'Scenario':'Draft scenario')+' “'+name+'” saved with '+plural(changes.length,'change')+'.');}\n\n/* ---------- actions that need the forecast (phase C) ---------- */\n/* Lock a year as budget: one frozen record with monthly totals by category and program, and the rates used. */\nfunction lockBudget(y){if(!exact)throw Error('Locking needs complete, valid data. Fix the items under Needs attention on Overview first.');if(!/^\\d{4}$/.test(String(y||'')))throw Error('Choose a year.');\n if(budgetsAll.some(b=>String(num(b.row.data.year,0))===y&&b.row.data.currency===C2))throw Error('A budget for '+y+' is already locked and cannot be edited.');if(!canWrite('budgets'))throw Error('You cannot create budgets.');\n const b=budgetTotals(model,y);if(b.missing.length)throw Error(excludedText(b.missing)+' Add the rates before locking.');\n save([{kind:'create_record',typeId:roleMap.budgets.typeId,data:toReal('budgets',{name:'Budget '+y,year:Number(y),locked_on:firstOf(model.A),currency:C2,totals:JSON.stringify(b.totals),rates_used:JSON.stringify(b.rates),notes:'Locked from the live forecast as of '+monthLabel(model.A)+'.'})}],'Budget '+y+' locked. It stays frozen; later edits to lines do not change it.');st.lockYear='';}\n/* Monthly close: the actuals of the month and one frozen snapshot, in one save. Months close in order. */\nfunction closeMonth(d){const m=ym(d.month);\n if(!exact)throw Error('Fix the items under Needs attention on Overview before closing a month.');\n if(!m||m<=model.A)throw Error('Choose a month after '+monthLabel(model.A)+'.');if(m!==addMonths(model.A,1))throw Error('Close months in order: the next month to close is '+monthLabel(addMonths(model.A,1))+'.');\n if(!canWrite('closes')||!canWrite('actuals'))throw Error('You cannot close months.');\n const bal=num(d.closing_balance);if(bal===null)throw Error('Enter the closing bank balance.');const cur=CURRENCIES.includes(d.currency)?d.currency:C2;\n const newActuals=[],existing=BASE.actuals.filter(a=>ym(a.month)===m);\n for(const cat of enabledCats){const v=d['actual_'+cat];if(v===undefined||String(v).trim()==='')continue;if(existing.some(a=>a.direction==='spend'&&a.category===cat))continue;const n=Number(v);if(!Number.isFinite(n)||n<0)throw Error('Enter a non-negative amount for '+cat+'.');newActuals.push({month:firstOf(m),category:cat,direction:'spend',amount:n,currency:cur});}\n if(String(d.cash_in_amount??'').trim()!==''){const n=Number(d.cash_in_amount);if(!Number.isFinite(n)||n<0)throw Error('Enter a non-negative cash-in amount.');const t=CASH_IN_TYPES.includes(d.cash_in_type)?d.cash_in_type:'';if(!t)throw Error('Choose the cash-in type.');newActuals.push({month:firstOf(m),category:'Other',direction:'cash_in',amount:n,currency:cur,cash_in_type:t});}\n if(!existing.length&&!newActuals.length)throw Error('Enter at least one actual for '+monthLabel(m)+'.');\n const D=dataset({actuals:BASE.actuals.concat(newActuals.map((a,i)=>({id:'new-'+i,...a}))),closes:BASE.closes.concat([{id:'new-close',month:firstOf(m),closing_balance:bal,currency:cur,closed:true}])});\n const after=engine(D);if(!after.ready)throw Error('The close cannot be calculated: '+after.blocks.join(' '));if(after.excluded.some(x=>x.month===m))throw Error(excludedText(after.excluded.filter(x=>x.month===m))+' Add the rate before closing.');\n const b=budgetFor(m),metrics=snapshotMetrics(after,b),status=!after.runway.beyond&&after.runway.months<target?'below_target':'ok';\n const changes=newActuals.map(a=>({kind:'create_record',typeId:roleMap.actuals.typeId,data:toReal('actuals',a)}));\n changes.push({kind:'create_record',typeId:roleMap.closes.typeId,d t'){const d={...(st.panel&&st.panel.kind==='close'?st.panel:{}),...form};st.panel={...d,kind:'close'};closeMonth(d);st.panel=null;return true;}\n if(a.startsWith('commentary:')){openEditor('closes','edit',a.slice(11));return true;}\n if(a==='lock-budget'){lockBudget(String(form.year||st.lockYear||event.value||''));return true;}\n if(a==='preview-new'){st.preview={name:'What-if '+(scenarioList.length+1),changes:[]};st.changeDraft={kind:'shift_program'};return true;}\n if(a.startsWith('preview-from:')){const sc=scenarioList.find(s=>s.id===a.slice(13));if(!sc)throw Error('Scenario not found.');st.preview={name:sc.status==='draft'?sc.name:'Copy of '+sc.name,changes:sc.changes.map(c=>pick(c,['kind','target_id','months','pct','amount','currency','from_month','label','category','line'])),...(sc.status==='draft'?{fromDraft:sc.id}:{})};st.changeDraft={kind:'shift_program'};return true;}\n if(a==='change-add'){const d={...(st.changeDraft||{}),...pick(form,CHANGE_KEYS)};st.changeDraft=d;if(form.preview_name!==undefined&&st.preview)st.preview.name=String(form.preview_name).slice(0,100);const c=normalizeChange(d);if(!st.preview)st.preview={name:'What-if '+(scenarioList.length+1),changes:[]};if(st.preview.changes.length>=12)throw Error('A what-if holds up to 12 changes.');st.preview.changes.push(c);st.changeDraft={kind:d.kind};return true;}\n if(a==='preview-save'){if(!st.preview||!st.preview.changes.length)throw Error('Add at least one change before saving.');const name=String(form.preview_name||st.preview.name||'').trim().slice(0,100)||'What-if';st.preview.name=name;\n  saveScenario(name,st.preview.changes,'saved',st.preview.fromDraft?scenarioList.find(x=>x.id===st.preview.fromDraft&&x.status==='draft')||null:null);st.preview=null;st.changeDraft=null;return true;}\n if(a.startsWith('adopt:')){adoptScenario(a.slice(6));return true;}\n if(a.startsWith('scenario-archive:')){archiveScenario(a.slice(17));return true;}\n if(a.startsWith('source-add:')){const [role,id]=a.slice(11).spl ;const metadata={
  "id": "life.cash-runway",
  "version": "3.0.0",
  "name": "Runway",
  "description": "Cash, burn and runway by program, with what-if scenarios. One live forecast from spend and cash-in lines, people and milestones; a locked budget per year; monthly close with variance and frozen snapshots; 12 currencies with monthly rates. Values are edited where they are shown and saved at once. Claude and ChatGPT can run every action through app commands.",

  ],
  "whenToUse": "A small biotech (roughly 10–50 people) needs cash runway, burn, budget versus actual and what-ifs by program without an ERP: how long the cash lasts, whether it reaches the next milestone, when to start raising, and a clean monthly picture for the board.",
  "whenNotToUse": "General ledger or bookkeeping, payroll, three-statement reporting, revenue/AR/AP or debt modelling, consolidation, 13-week cash, tax-credit calculation, cap table or dilution, bank or accounting connectors, and any patient-level data.",

  "instructions": "Runway 3.0.0 is a frontend-js app on the v2 contract and the kit (life.cash-runway). It replaces 2.2.1 with the same installer schema, role keys, calculation engine, app commands and recommended automations; an owner can upgrade a 2.2.0 or 2.2.1 copy (upgradeFrom) and keep its records.\n\n1. Discover and pin. Read read_app_template_guidance (guide, then reference when extending) to the last nextOffset, read_app_design, list_app_templates and read_app_template for life.cash-runway. Pin this exact version and digest and keep one requestKey.\n2. Install. Before installing, call list_archived_items (kind apps, this templateId) and offer to restore an archived Runway first. The installation popup connects existing programs, organizations and agreements tables (core.v1; reuse, never copy) and offers the recommended automations. Only the person confirms it. Never seed demo data.\n3. Screens. Overview (runway sentence, the numbers that matter, Needs attention, cash curve, burn, why runway changed, cash at milestones), Cash flow, Plan (spend and cash-in lines, milestones, budgets, from other sources), People (list or board), Scenarios, Monthly close (starting point, months, variance, snapshots, actual records), Exchange rates, Programs, Organizations, and Settings for owners of the app only (reporting currency, target, trailing window, reserve, loaded cost, categories). A person edits values where they are shown and they save at once; a side panel creates records or edits many fields; Delete archives the record and offers Undo.\n4. Control the app through its commands. list_app_commands returns every action a person can take; run_app_command runs it. Read commands (summary.read, cashflow.read, cashflow.drill, export.csv, scenario.evaluate, scenario.compare, variance.read, bridge.read, sources.read, schema.describe) return Runway's own results; never compute runway, burn or cash yourself. Write commands save directly (the result lists what was saved) when your Data level is Edit, with the same checks as a click; with View only they are refused. Tell the user what you saved. layout.save returns a layout change for the person to approve.\n5. First runway. Ask for the bank balance and its month-end date, the reporting currency, programs and next milestones, the main spend lines and expected financing. Then settings.save, program.save, line.save, position.save, milestone.save and fx.save (rates for every non-reporting currency). Runway settings beyond the opening balance and its date can be changed only by owners of the app.\n6. Monthly close. From a P&L or bank statement the user shares, map lines to categories, ask when a line is ambiguous, confirm the figures with the user, then month.close with the closing balance, actuals by category and commentary. The app computes and freezes the snapshot; you never write metrics.\n7. What-ifs. Translate plain language into changes (shift_program, scale_program, stop_program, add_position, remove_position, move_cash_in, resize_cash_in, fx_shift, add_line, stop_line, shift_line, scale_line, scale_category, shift_position, change_salary) and run scenario.evaluate to report the app's figures. Save only when asked: scenario.save with status draft leaves it for the user to open, status saved makes it adoptable; scenario.adopt only on an explicit request.\n8. Customize. Screens, columns and form fields (order, hidden optional fields, labels, defaults) with layout.save. Categories with category.add or category.hide; a new custom category also needs the reviewed schema change the command returns. A new field: a reviewed schema change, then an app revision that lists it in tableMap extraFields (and writableExtra). Code changes use begin_app_update and keep the v2 marker, role keys, the runway.month_closes runway.v2 contract, the calculation rules, frozen fields and appCommands.\n9. Integrations. Programs milestones, CRO Selection awards, Contracts payment obligations and Fundraise tranches are Runway's own entries until the user chooses Use its data inside the app (a platform dialog). Linked data is read only here. Add to plan (source.add_to_plan) copies amounts into plan lines; source.update_line applies a changed source.\n10. Automations. Four recommendations: runway alert email, month-close reminder, monthly exchange rates (research that saves only new runway.fx_rates rows under the bounded write permission approved with it) and the monthly runway digest email built from the frozen snapshot. Zero automations is supported.\n11. Never compute or overwrite results, never treat contingent cash as committed, never give accounting, tax or investment advice, and confirm with the user before saving figures they did not state.",
  "documentation": {
    "quickStart": [
      "Read the current guide and this template's documentation; pin life.cash-runway 3.0.0 and its digest with one requestKey.",
      "Before installing, check for an archived Runway app and offer to restore it. The installation popup connects existing programs, organizations and agreements tables and offers the recommended automations.",

    "dataContract": "Stable role keys: runway.settings (one row: reporting_currency select of 12 currencies; enabled_currencies text comma list; runway_target_months number, default 18; trailing_window_months number 3 or 6; min_cash_reserve money; loaded_cost_pct number; opening_balance money in the reporting currency; opening_date date, the month-end of the opening balance; categories text comma list ordering the spend categories). runway.plan_lines ( name text*, direction select spend/cash_in*, category select Clinical/CMC/Research/People/G&A/Facilities/Other*, program_id text record ID, counterparty_id text record ID, agreement_id text record ID, schedule_group text, driver select monthly/one_off/spread*, amount money* non-negative, currency select*, start_month date*, end_month date (inclusive), status select committed/discretionary/contingent/received*, cash_in_type select equity/grant/partnership/tax_credit/other (required for cash_in), notes text, source_role text, source_record_id text, source_version text (set by Add to plan), archived boolean). runway.positions (title*, program_id, start_month*, end_month, annual_salary money*, currency*, status current/planned*, person_id text, archived). runway.actuals (month*, category*, program_id, direction*, amount*, currency*, cash_in_type, note). runway.month_closes, an app output for other apps (month*, closing_balance money*, currency*, closed boolean, commentary text, runway_months number, cash_out_month date, runway_status select ok/below_target, metrics text frozen JSON, rates_used text frozen JSON, closed_at date). runway.budgets (name*, year number*, locked_on date*, currency*, totals text frozen JSON, rates_used text frozen JSON, notes). runway.scenarios (name*, status draft/saved/adopted/archived*, changes_json text (the scenario's changes, written by the app), based_on_close date, based_on_version text forecast fingerprint (saved scenarios only), created_on date, summary text). runway.fx_rates (month*, currency*, rate_per_eur number*, source ecb/manual*, source_ref text). Core contract v1 (shared workspace tables, one per role): programs (name*, code, indication, modality, stage*, lead, status, archived; health fields are owned by the Programs app), organizations (name*, org_type, country, website, archived), agreements (name*, counterparty_id, agreement_type, status, effective_date, expiry_date, archived). Integrations (Runway's own table until the user links the provider inside the app; then read only): programs.plan_items programs.v2 (Runway's milestone list: name*, program_id, item_type, end_date* target month, status, is_key, archived; or the Programs app's key milestones), croselection.awards croselection.v1 (organization_id, service_type*, program_id, total, currency*, start_date, duration_months, decided_on*, agreement_id), contracts.obligations contracts.v1 (title*, agreement_id, kind*, direction*, due_date, recurrence, amount, currency, status*, verified, archived; only open payment obligations are offered, and only verified ones when linked), fundraise.tranches fundraise.v1 (tranche_no*, amount*, currency*, condition*, expected_on, status*). * = required. All fields are scalar (multiple:false); months are stored as the first day of the month; relationships are record IDs, never names.\n\nCalculations (deterministic, in the app, no clock): the as-of month is the latest closed month, or the opening month. Cash starts from the opening balance, then each confirmed close. monthly = amount every month from start to end; one_off = amount in the start month; spread = amount ÷ months from start to end inclusive. People cost = annual_salary ÷ 12 × (1 + loaded_cost_pct/100) for active months. Amounts convert through EUR cross-rates: closed months use their own month's rate, future months the latest available rate; a missing rate flags and excludes the row. Net burn = spend − operating cash in (cash_in_type other); equity, grants, partnership and tax credits are financing. Runway = full months after the as-of month with forecast closing cash ≥ 0, counting committed and received cash in; a second value adds contingent. Cash-out month = first month below zero. Start-raise = first month with less than the target runway left. Cushion = months of cash after a milestone (to the reserve when one is set). Variance = actual − budget by month and category (and program where coded). The runway bridge splits the change since the last snapshot into closed months, spend lines, people and cash-in; the parts add up to the total.\n\nAccess: app-level access with app roles; Settings (business choices) are for owners of the app, record edits for editors, viewers read. Restrict positions.annual_salary with a database column restriction for anyone who should not see pay: live people cost and live runway then show restricted, and snapshots still show the approved runway. Missing partners: without programs, program breakdowns hide with a note and totals are unaffected; without programs.plan_items, only Runway milestones are used; references to archived, deleted or unreadable records show as unavailable and are kept on edit. Each screen reads only its tables (records.readMany): the forecast reads every row of its tables, up to 800 per table; exchange rates, programs and organizations read one sorted, searchable page; counts over a whole table use records.summarize. Partial, unavailable or unbound tables withhold exact totals, and data still loading shows as loading, never as zero. Categories: settings.categories lists the shown categories in order; names beyond Clinical, CMC, Research, People, G&A, Facilities and Other are custom (the select option is added by a reviewed schema change); People and Other always exist; hidden categories still count.",
    "interactionContract": "v2 app on the kit, with its own side navigation below the platform header and no header, banner or footer of its own; messages are the platform notice. Screens: overview, cash_flow, plan, people, scenarios, actuals (Monthly close), rates (Exchange rates), programs, organizations and settings (owners only). The layout declaration (templateLayoutSchema) keeps the 2.x screen ids overview, cash_flow, plan, people, scenarios, actuals and settings, so saved layout profiles stay valid; rates, programs and organizations follow them. Overview: runway sentence, runway, cash-out, start-raise, cash now, with contingent and trailing runway; Needs attention lists missing or excluded data with the action that fixes it (set up, starting point, add rates, close a month); cash curve and burn charts with a table of values; why runway changed since the last snapshot; cash at milestones with cushions. Cash flow: monthly table (opening, cash in, spend by category or category × program, net burn, closing), source (live forecast, what-if, saved scenarios, locked budgets), include contingent, drill-down to the lines behind a value, CSV as copyable text. Plan: lines with search and filters, a program picker remembered per person (output.context), inline edits of name, category, driver, amount, months and status, Edit, Duplicate, Delete (archive with Undo), payment schedule panel, From other sources with Add to plan and Update line; Milestones (own list or Programs key milestones, read only); Budgets (Lock as budget, locked budgets). People: list with inline edits, or a board where a planned hire is dragged to current (or moved with the card menu); headcount and people cost by program for 12 months; the side panel shows the runway effect before saving. Scenarios: build a what-if with any of 15 change kinds (nothing stored), save, open drafts, copy, adopt (one click; versions captured; stale records are rejected), archive, compare 2–4 with an overlay chart. Monthly close: starting point (opening balance and date, inline), months with status and record counts, Close <month> panel (bank balance, actuals by category, cash received, commentary), variance against the locked budget, snapshots, actual records (inline edits in open months; closed months are frozen). Exchange rates, Programs and Organizations: paged, sorted, searchable lists with inline edits and Add. Settings: the owner-only form, with links to platform Access and Automations. Every empty screen offers its first action. App commands (37) run the same functions as these controls.",
    "lifecycle": "Opening never writes. After the app is saved, every create, edit, delete, close, lock, scenario save and adoption from a person's click, change or submit saves at once with records.save (at most 50 changes), with the platform's checks; the screen then shows the saved data and the person's last action can be undone (Undo, 60 minutes, while the records are unchanged). Edits and deletes carry the record version captured when editing started, so a concurrent change of the same value is refused and the earlier value comes back with a message. Delete is an archive: nothing is removed. Closing a month writes the actuals and one month_closes record whose metrics JSON is frozen; budgets are frozen at lock; neither is edited later (only close commentary can change). What-ifs live only in the person's screen state until saved. A saved scenario is flagged Outdated when lines, positions, milestones, settings, closes or rates change after it was saved, and must be re-saved before adoption; drafts (left by an assistant) are never Outdated and cannot be adopted until saved. Lines added from another source keep its record ID and version; a later source change is flagged and applied only by Update line. Write commands from an assistant with Data = Edit save directly in one call, with the same checks; layout.save returns a change for a person to approve. Revisions keep the same app ID, bindings and access. An owner can upgrade a 2.2.0 or 2.2.1 copy to 3.0.0 (same tables, options and automations). Removing the app archives it and keeps every table and record.",
    "limitations": [
      "No accounting, bank or payroll connectors and no file parsers; actuals are typed in or saved by an assistant from a document the user shares.",
      "Monthly granularity only; no 13-week cash view, revenue, AR/AP, debt, deferred revenue or three-statement model.",
      "Protect salaries with the database column restriction (platform Access); live people cost and live runway then show restricted and snapshots still show the approved runway.",

    "examples": [

function eventFor(kind,target){const trigger=target.closest('[data-action]');if(!trigger)return;const form=trigger.closest('form');dispatch({kind,action:trigger.dataset.action,value:target.type==='checkbox'?target.checked:target.value??null,form:form?Object.fromEntries(new FormData(form)):{}});}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled&&b.type!=='submit')eventFor('click',b);});
document.addEventListener('submit',e=>{e.preventDefault();eventFor('submit',e.target);});
document.addEventListener('change',e=>eventFor('change',e.target));
