tton&gt;&lt;/div&gt;&lt;/header&gt;&lt;div class=&quot;pg-grid2&quot;&gt;&lt;section class=&quot;pg-panel pg-pad&quot;&gt;&lt;div class=&quot;pg-panel-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Program settings&lt;/h2&gt;&lt;p&gt;Stored in the Programs settings table; changes are reviewed.&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;pg-btn pg-btn-primary&quot; data-action=&quot;edit-settings&quot;&gt;Create settings&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;pg-kv&quot;&gt;&lt;span&gt;Function lanes&lt;/span&gt;&lt;strong&gt;CMC, Nonclinical, Clinical, Regulatory, Other&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;pg-kv&quot;&gt;&lt;span&gt;Stages&lt;/span&gt;&lt;strong&gt;Discovery, Preclinical, IND-enabling, Phase 1, Phase 2, Phase 3, Registration, Approved&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;pg-kv&quot;&gt;&lt;span&gt;Due-soon window&lt;/span&gt;&lt;strong&gt;90 days&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;pg-kv&quot;&gt;&lt;span&gt;Monthly update day&lt;/span&gt;&lt;strong&gt;Day 5&lt;/strong&gt;&lt;/div&gt;&lt;div class=&quot;pg-kv&quot;&gt;&lt;span&gt;Reminder lead time&lt;/span&gt;&lt;strong&gt;7 days before the date&lt;/strong&gt;&lt;/div&gt;&lt;h3 class=&quot;pg-h3&quot;&gt;Health definitions&lt;/h3&gt;&lt;p class=&quot;pg-commentary&quot;&gt;Not defined yet. Write what green, amber and red mean for your programs.&lt;/p&gt;&lt;p class=&quot;pg-muted&quot;&gt;No settings saved yet; defaults are shown.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;pg-panel pg-pad&quot;&gt;&lt;div class=&quot;pg-panel-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Cash forecast&lt;/h2&gt;&lt;p&gt;Closing cash by month, used for cash at key milestones.&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;pg-btn&quot; data-action=&quot;add:closes&quot;&gt;&lt;svg width=&quot;15&quot; height=&quot;15&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M12 5v14M5 12h14&quot;/&gt;&lt;/svg&gt; Add month&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;pg-muted&quot;&gt;No months entered yet.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;pg-panel&quot;&gt;&lt;div class=&quot;pg-pad&quot;&gt;&lt;div class=&quot;pg-panel-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Program team&lt;/h2&gt;&lt;p&gt;Who works on each program. Owners are picked from here. With a workspace member ID, TrialAgents notifies the person when they are added, when they are assigned an item or a review, and before it is due.&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;pg-btn&quot; data-action=&quot;add:team&quot;&gt;&lt;svg width=&quot;15&quot; height=&quot;15&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M12 5v14M5 12h14&quot;/&gt;&lt;/svg&gt; Add team member&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pg-none&quot;&gt;No team members yet. Add the people who own milestones, risks and updates.&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;pg-panel pg-pad&quot;&gt;&lt;h2&gt;Access, automations and links&lt;/h2&gt;&lt;ul class=&quot;pg-list plain&quot;&gt;&lt;li&gt;&lt;span&gt;&lt;strong&gt;Access&lt;/strong&gt;: TrialAgents sidebar \u2192 Access \u2192 Projects \u2192 this app. Access is app-level; share with a write restriction for board members. Confidential programs belong in a separate Programs app with separate data in a restricted project \u2014 hiding a program here is not security.&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;&lt;strong&gt;Automations&lt;/strong&gt;: TrialAgents sidebar \u2192 Automations. Included when the app is added (each can be turned off): the weekly digest to you, written by Claude or ChatGPT when one is connected and sent only when something needs attention, and notices to team members when they are added, assigned or something is due. A digest without AI is available in Automations \u2192 From app features. The app never waits for them.&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;&lt;strong&gt;Claude and ChatGPT&lt;/strong&gt;: can do anything you can do here, within the access you give them on the Access page; each change is reviewed.&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;&lt;strong&gt;Layout&lt;/strong&gt;: the gear reorders, renames or hides screens and columns through a reviewed app update.&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;&lt;strong&gt;Cash at milestones&lt;/strong&gt;: from the cash forecast on this screen.&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;span&gt;&lt;strong&gt;As-of date&lt;/strong&gt;: fixed for this preview (8 Feb 2027).&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;/div&gt;&lt;section class=&quot;pg-panel&quot;&gt;&lt;div class=&quot;pg-pad&quot;&gt;&lt;div class=&quot;pg-panel-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Programs&lt;/h2&gt;&lt;p&gt;Shared workspace table (core role programs), also used by Runway and other apps. Health is a dated human judgement; the app never sets it.&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;pg-btn&quot; data-action=&quot;add:programs&quot;&gt;&lt;svg width=&quot;15&quot; height=&quot;15&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M12 5v14M5 12h14&quot;/&gt;&lt;/svg&gt; Add program&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;pg-scroll&quot; role=&quot;region&quot; aria-label=&quot;Programs&quot; tabindex=&quot;0&quot;&gt;&lt;table class=&quot;pg-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Program&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Stage&lt;/t lector(&#x27;#empty&#x27;).textContent=document.querySelector(&#x27;[data-risk]:not([hidden])&#x27;)?&#x27;&#x27;:&#x27;No entries in this cell.&#x27;});let b=document.querySelector(&#x27;#reset&#x27;);if(b)b.onclick=()=&gt;{document.querySelectorAll(&#x27;[data-risk]&#x27;).forEach(e=&gt;e.hidden=false);document.querySelector(&#x27;#empty&#x27;).textContent=&#x27;&#x27;}&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;\"><\/iframe><\/article><\/div><\/noscript><main class=\"wrap\"><small>NORTHTHERAPEUTICS\u3000 /\u3000 PROGRAMS<\/small><h1>Programs design review<\/h1><p>Choose a numbered recommendation to compare layouts and record your decision.<\/p><nav id=\"nav\" aria-label=\"Recommendations\"><\/nav><div class=\"top\"><div><small id=\"num\"><\/small><h2 id=\"title\"><\/h2><\/div><label>Decision <select id=\"decision\"><option>Undecided<\/option><option>Approve<\/option><option>Revise<\/option><option>Keep current<\/option><\/select><\/label><\/div><div class=\"notes\"><p><strong>Current design<\/strong><span id=\"why\"><\/span><\/p><p><strong>Proposed design<\/strong><span id=\"how\"><\/span><\/p><\/div><div class=\"tools\" id=\"modes\"><\/div><div id=\"screens\"><\/div><p class=\"foot\">Current views use the Programs 2.2.1 template rendered locally with fictional records. Both designs use a simplified platform header. Proposed screens are design studies and include next-version features. Decisions are saved in this browser when local storage is available.<\/p><button id=\"export\">Download decisions<\/button><\/main><script>const [sections,frames]=[[[\"shell\", \"App navigation\", \"Give the app the full workspace\", \"The dark 224 px rail repeats the app name, subtitle and review policy. Settings sits among daily destinations.\", \"Use a quiet 168 px app rail with six work destinations and a bottom-pinned settings button. Keep the platform header above it. On narrow screens, collapse the app rail to a labeled navigation menu.\"], [\"overview\", \"Overview\", \"Put the next decision on the first screen\", \"The KPI strip, program cards, upcoming dates and exceptions compete for attention.\", \"Use one portfolio table with stage, next milestone, date and health aligned across programs. Give exceptions their own short list sorted by urgency.\"], [\"milestones\", \"Milestones\", \"Reveal activities inside each milestone\", \"The Plan register gives activities and milestones equal visual weight.\", \"Start with milestone rows. Expand an outcome to inspect its activities, owners and dates. Shared activities carry a location count. Keep the add action beside the list.\"], [\"timeline\", \"Timeline\", \"Make dates and dependencies readable\", \"Function lanes, controls, dates and explanatory text compete with the current Gantt.\", \"Freeze the name column, align dates to a weekly scale, use diamonds for milestones and bars for activities. Show the approved baseline as a hollow marker and highlight only the selected dependency chain.\"], [\"editor\", \"Record editing\", \"Keep the record and its context together\", \"The item form combines scheduling, ownership and predecessor input in one editor.\", \"Use a side drawer. Put owner, date and dependencies first, and tuck optional budget and partners behind disclosure controls. A linked field can search or create a permitted target inline.\"], [\"decisions\", \"Gates & decisions\", \"Show the missing criterion\", \"The register summarizes gates, while the user needs to know what is blocking the next decision.\", \"Place upcoming gates beside the selected checklist. Show the fraction of criteria met, the open criterion, the approver and the action to record the outcome.\"], [\"risks\", \"Risks & issues\", \"Connect the matrix to the worklist\", \"The RAID label assumes familiarity with project-management terminology. The matrix and register demand separate scans.\", \"Pair a compact likelihood\\u2013impact matrix with a ranked issue list. Give each row an owner and review date. A selected cell should filter the list, with an explicit reset.\"], [\"updates\", \"Updates\", \"Show reporting coverage before the narrative\", \"The monthly update register, report builder, archive and digest history use separate views.\", \"Lead with month and program coverage. Show the submitted update beside missing submissions, then offer the existing report snapshot action. Keep archive and weekly digests one click away.\"], [\"settings\", \"App settings\", \"Make configuration easy to find and leave\", \"Settings combines program administration, team, cash inputs and business rules.\", \"Give programs and teams a direct route from their records. Keep program-specific defaults, reminders and forecast source in a compact settings screen reached from the rail gear.\"]], [[\"<!doctype html><html lang=\\\"en\\\"><meta charset=\\\"utf-8\\\"><meta name=\\\"viewport\\\" content=\\\"width=device-width,initial-scale=1\\\"><style>:root{--bg:#F7F7FA;--paper:#fff;--ink:#102332;--muted:#4D5F70;--soft:#55667A;--line:#DCE4EA;--plum:#795094;--plum-dark:#5E3C74;--plum-lite:#F3ECF7;--rail:#2B3546;--rail2:#36425A;--green:#1E7A4F;--amber:#8A5A0E;--red:#B42335;--dark:#182C35}\\n*{box-sizing:border-box}\\nbody{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,\\\"Segoe UI\\\",Roboto,\\\"Helvetica Neue\\\",Arial,sans-serif}\\nbutton,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}\\n:focus-visible{outline:3px solid #A57FC0;outline-offset:2px}\\n.pg-shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:760px;background:var(--bg)}\\n.pg-rail{background:var(--rail);color:#EEF1F6;padding:22px 12px;display:flex;flex-direction:column;gap:18px;min-width:0}\\n.pg-brand{display:flex;flex-direction:column;padding:0 10px 14px;border-bottom:1px solid #3E4A60}.pg-brand strong{font-size:17px;letter-spacing:-.2px}.pg-brand span{font-size:12px;color:#BDC5D3}\\n.pg-nav{displa
