<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="icon" type="image/png" href="/trialagents-mark-black.png"/><title>TrialAgents</title>
<!-- The one font starts downloading with the page, so cards draw in it at once (font-display:optional: never swapped in later). -->
<link rel="preload" href="/fonts/inter-variable.woff2" as="font" type="font/woff2" crossorigin/>
<!-- L1.5: the page frame is drawn at once, before any script or request. React replaces it. -->
<style>body{margin:0;background:#f7f9f8}.ty-boot{display:flex;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.ty-boot-side{width:236px;flex-shrink:0;background:#14241c}.ty-boot-main{flex:1;min-width:0}.ty-boot-head{height:64px;background:#fff;border-bottom:1px solid #e3e9e5}.ty-boot-body{padding:40px 42px}.ty-boot-bar{height:26px;width:180px;border-radius:8px;background:#e6ece8}.ty-boot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:28px}.ty-boot-card{height:190px;border-radius:14px;background:#eef2ef}@media(max-width:760px){.ty-boot-side{display:none}.ty-boot-body{padding:24px 16px}}@media(prefers-reduced-motion:no-preference){.ty-boot-card,.ty-boot-bar{animation:ty-boot 1.4s ease-in-out infinite alternate}}@keyframes ty-boot{to{opacity:.55}}</style>
</head><body><div id="root"><div class="ty-boot" aria-busy="true" aria-label="Opening TrialAgents"><div class="ty-boot-side"></div><div class="ty-boot-main"><div class="ty-boot-head"></div><div class="ty-boot-body"><div class="ty-boot-bar"></div><div class="ty-boot-grid"><div class="ty-boot-card"></div><div class="ty-boot-card"></div><div class="ty-boot-card"></div></div></div></div></div></div><script async src="/start.js"></script><script type="module" src="/src/web/main.tsx"></script></body></html>
