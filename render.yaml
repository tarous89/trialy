# Development/staging infrastructure only. Production durability still requires review.
services:
  - type: web
    name: trialy-web
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /health
    domains:
      - platform.trialagents.com
    renderSubdomainPolicy: enabled
    preDeployCommand: npm run db:migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trialy-db
          property: connectionString
      - key: TRIALY_RUNTIME_KIND
        value: web
      - key: TRIALY_RUNTIME_PASSWORD
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BRAND_NAME
        value: TrialAgents
      - key: APP_PUBLIC_URL
        value: https://platform.trialagents.com
  - type: worker
    name: trialy-worker
    runtime: docker
    region: frankfurt
    plan: starter
    dockerCommand: npm run worker
    preDeployCommand: npm run db:migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trialy-db
          property: connectionString
      - key: APP_NOTIFICATION_RESEND_API_KEY
        sync: false
      - key: APP_PUBLIC_URL
        value: https://platform.trialagents.com
      - key: TRIALY_RUNTIME_KIND
        value: worker
      - key: TRIALY_RUNTIME_PASSWORD
        sync: false
databases:
  - name: trialy-db
    region: frankfurt
    plan: basic-256mb
    databaseName: trialy_db
    user: trialy_db_user
    postgresMajorVersion: "17"
    diskSizeGB: 1
    ipAllowList: []
