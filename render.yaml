# Development/staging infrastructure only. Production durability still requires review.
services:
  - type: web
    name: trialy-web
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /health
    preDeployCommand: npm run db:migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trialy-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: MCP_ISSUER
        sync: false
      - key: MCP_JWKS_URL
        sync: false
      - key: MCP_AUDIENCE
        sync: false
      - key: MCP_SCOPE
        value: trialy
      - key: BRAND_NAME
        value: Trialy
  - type: worker
    name: trialy-worker
    runtime: docker
    region: frankfurt
    plan: starter
    dockerCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trialy-db
          property: connectionString
databases:
  - name: trialy-db
    region: frankfurt
    plan: basic-256mb
    databaseName: trialy
    user: trialy
    ipAllowList: []
