# Development/staging infrastructure only. Production durability still requires review.
services:
  - type: web
    name: trialy-web
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /health
    preDeployCommand: npm run db:migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trialy-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: BRAND_NAME
        value: Trialy
  - type: worker
    name: trialy-worker
    runtime: docker
    region: frankfurt
    plan: starter
    dockerCommand: npm run worker
    preDeployCommand: npm run db:migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trialy-db
          property: connectionString
databases:
  - name: trialy-db
    region: frankfurt
    plan: basic-256mb
    databaseName: trialy_db
    user: trialy_db_user
    postgresMajorVersion: "17"
    diskSizeGB: 1
    ipAllowList: []
